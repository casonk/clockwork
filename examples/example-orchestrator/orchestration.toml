[[jobs]]
name = "example-orchestrator-orchestrator"
description = "example-orchestrator supplement-source orchestrator daemon"
scope = "user"
service_type = "simple"
working_directory = "%h/git/health-repos/example-orchestrator"
exec_start = "/usr/bin/python3 -m example-orchestrator.orchestrator --poll-seconds 300"
poll_interval = "5m"
after = ["network-online.target"]
wants = ["network-online.target"]
restart = "always"
restart_sec = "30"
standard_output = "journal"
standard_error = "journal"
service_install_wanted_by = ["default.target"]
