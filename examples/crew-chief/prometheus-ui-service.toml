[[jobs]]
name = "crew-chief-prometheus-ui"
description = "Prometheus for the K3s and Cilium cluster — a localhost-only kubectl port-forward on 9190"
scope = "user"
service_type = "simple"
working_directory = "%h/git/util-repos/crew-chief"
exec_start = "%h/git/util-repos/crew-chief/deploy/k3s/forward.sh prometheus"
restart = "always"
restart_sec = "10"
standard_output = "journal"
standard_error = "journal"
service_install_wanted_by = ["default.target"]

[jobs.environment]
KUBECONFIG = "%h/.kube/k3s.yaml"
PROMETHEUS_PORT = "9190"
