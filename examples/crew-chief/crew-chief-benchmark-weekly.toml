
[[jobs]]
name = "crew-chief-benchmark-weekly"
description = "Weekly Ollama model benchmark — tok/s, TTFT, VRAM across all local models"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/crew-chief"
exec_start = "/usr/bin/bash %h/git/util-repos/crew-chief/scripts/run_benchmark.sh"
after = ["network.target"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Weekly crew-chief Ollama model benchmark — Sunday 04:00"

[jobs.environment]
REPO_ROOT = "%h/git/util-repos/crew-chief"

[jobs.timer]
kind = "calendar"
on_calendar = "Sun *-*-* 04:00:00"
persistent = true
randomized_delay_sec = "600"

[jobs.cron]
expression = "0 4 * * 0"
command = "mkdir -p $HOME/.local/share/crew-chief-benchmark-weekly/runs && cd $HOME/git/util-repos/crew-chief && /usr/bin/bash $HOME/git/util-repos/crew-chief/scripts/run_benchmark.sh >> $HOME/.local/share/crew-chief-benchmark-weekly/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: Sun *-*-* 04:00:00"]
