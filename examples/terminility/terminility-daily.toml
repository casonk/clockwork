[[jobs]]
name = "terminility-daily"
description = "Daily rebuild of tmux session aliases for all git repos under the portfolio root"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/terminility"
exec_start = "/usr/bin/bash %h/git/util-repos/terminility/sessions.sh"
after = ["network.target"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Run terminility daily alias rebuild"

[jobs.environment]
TERMINILITY_GIT_BASE = "%h/git"
LOG_DIR = "%h/.local/share/terminility-daily"

[jobs.timer]
kind = "calendar"
on_calendar = "*-*-* 03:00:00"
persistent = true
randomized_delay_sec = "300"

[jobs.cron]
expression = "0 3 * * *"
command = "mkdir -p $HOME/.local/share/terminility-daily/runs && cd $HOME/git/util-repos/terminility && /usr/bin/bash $HOME/git/util-repos/terminility/sessions.sh >> $HOME/.local/share/terminility-daily/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: *-*-* 03:00:00"]
