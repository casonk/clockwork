[[jobs]]
name = "ci-repair-agentic-discovery"
launchd_label = "io.github.casonk.traction-control.ci-repair-agentic-discovery"
description = "Every-other-day read-only discovery of failing GitHub Actions CI"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/ci_repair_agentic.sh --discovery-only"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/ci-repair-agentic.env"]
standard_output = "journal"
standard_error = "journal"

[jobs.environment]
PATH = "%h/.local/npm-global/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin"
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/ci-repair-agentic"
CI_REPAIR_AGENTIC_PROVIDER = "auto"
CI_REPAIR_AGENTIC_MODEL = ""

[jobs.timer]
kind = "interval"
on_boot_sec = "1h"
on_unit_active_sec = "2d"
persistent = true
randomized_delay_sec = "1200"
