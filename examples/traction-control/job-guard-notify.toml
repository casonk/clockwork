
[[jobs]]
name = "job-guard-notify"
launchd_label = "io.github.casonk.traction-control.job-guard-notify"
description = "Tell the owner when the job guard drops a job or deferrals persist; one message per run"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "/usr/bin/python3 %h/git/util-repos/traction-control/scripts/job_guard_notify.py"
environment_files = ["-%h/.config/traction-control/job-guard-notify.env"]
standard_output = "journal"
standard_error = "journal"

[jobs.timer]
kind = "interval"
on_boot_sec = "10m"
on_unit_active_sec = "15m"
persistent = true
randomized_delay_sec = "60"

[jobs.cron]
expression = "*/15 * * * *"
command = "mkdir -p $HOME/.local/share/job-guard-notify/runs && cd $HOME/git/util-repos/traction-control && /usr/bin/python3 $HOME/git/util-repos/traction-control/scripts/job_guard_notify.py >> $HOME/.local/share/job-guard-notify/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: every 15m"]
