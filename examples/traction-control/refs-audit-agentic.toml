[[jobs]]
name = "refs-audit-agentic"
description = "Weekly agentic audit of REFS-PUBLIC.md files across all portfolio repos for missing or stale external references"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/refs_audit_agentic.sh"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/refs-audit-agentic.env"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Run the traction-control weekly REFS audit agent"

[jobs.environment]
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/refs-audit-agentic"
REFS_AUDIT_AGENTIC_PROVIDER = "auto"
REFS_AUDIT_AGENTIC_MODEL = ""

[jobs.timer]
kind = "calendar"
on_calendar = "Wed *-*-* 03:00:00"
persistent = true
randomized_delay_sec = "1800"

[jobs.cron]
expression = "0 3 * * 3"
command = "cd $HOME/git/util-repos/traction-control && $HOME/git/util-repos/traction-control/scripts/refs_audit_agentic.sh >> $HOME/.local/share/refs-audit-agentic/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: Wed *-*-* 03:00:00"]
