
[[jobs]]
name = "repository-description-sync-weekly"
launchd_label = "io.github.casonk.traction-control.repository-description-sync-weekly"
description = "Weekly sync of GitHub descriptions from merged repository settings"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "/usr/bin/python3 %h/git/util-repos/traction-control/scripts/repository_description_sync.py"
after = ["network-online.target"]
wants = ["network-online.target"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Sync repository descriptions from canonical settings"

[jobs.environment]
PATH = "%h/.local/npm-global/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin"

[jobs.timer]
kind = "calendar"
on_calendar = "Sun *-*-* 06:00:00"
persistent = true
randomized_delay_sec = "1800"

[jobs.cron]
expression = "0 6 * * 0"
command = "mkdir -p $HOME/.local/share/repository-description-sync-weekly/runs && cd $HOME/git/util-repos/traction-control && /usr/bin/python3 $HOME/git/util-repos/traction-control/scripts/repository_description_sync.py >> $HOME/.local/share/repository-description-sync-weekly/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: Sun *-*-* 06:00:00"]
