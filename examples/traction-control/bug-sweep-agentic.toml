[[jobs]]
name = "bug-sweep-agentic"
launchd_label = "io.github.casonk.traction-control.bug-sweep-agentic"
description = "Daily agentic review of clean code repos for potential bugs and regressions"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/bug_sweep_agentic.sh"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/bug-sweep-agentic.env"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Run the traction-control daily bug sweep agent"

[jobs.environment]
PATH = "%h/.local/npm-global/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin"
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/bug-sweep-agentic"
BUG_SWEEP_AGENTIC_PROVIDER = "auto"
BUG_SWEEP_AGENTIC_MODEL = ""

[jobs.timer]
kind = "interval"
on_boot_sec = "90m"
on_unit_active_sec = "1d"
persistent = true
randomized_delay_sec = "1800"

[jobs.cron]
expression = "0 0 * * *"
command = "mkdir -p $HOME/.local/share/bug-sweep-agentic/runs && cd $HOME/git/util-repos/traction-control && %h/git/util-repos/traction-control/scripts/bug_sweep_agentic.sh >> $HOME/.local/share/bug-sweep-agentic/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: every 1d"]
