[[jobs]]
name = "archility-daily"
launchd_label = "io.github.casonk.traction-control.archility-daily"
description = "Daily architecture audit through the traction-control profile"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/archility-daily.sh"
after = ["network.target"]
standard_output = "journal"
standard_error = "journal"

[jobs.environment]
PORTFOLIO_ROOT = "%h/git"
ARCHILITY_CMD = "%h/.local/share/traction-control/bootstrap/bin/archility"
LOG_DIR = "%h/.local/share/archility-daily"

[jobs.timer]
kind = "calendar"
on_calendar = "*-*-* 02:00:00"
persistent = true
randomized_delay_sec = "300"
