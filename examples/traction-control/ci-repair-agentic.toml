[[jobs]]
name = "ci-repair-agentic"
description = "Every-other-day agentic scan for failing GitHub Actions push CI across clean portfolio repos"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/ci_repair_agentic.sh"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/ci-repair-agentic.env"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Run the traction-control CI repair agent every other day"

[jobs.environment]
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/ci-repair-agentic"
CI_REPAIR_AGENTIC_PROVIDER = "auto"
CI_REPAIR_AGENTIC_MODEL = ""

[jobs.timer]
kind = "interval"
on_boot_sec = "1h"
on_unit_active_sec = "2d"
persistent = true
randomized_delay_sec = "1200"

[jobs.cron]
expression = "0 0 */2 * *"
command = "mkdir -p $HOME/.local/share/ci-repair-agentic/runs && cd $HOME/git/util-repos/traction-control && %h/git/util-repos/traction-control/scripts/ci_repair_agentic.sh >> $HOME/.local/share/ci-repair-agentic/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: every 2d"]
