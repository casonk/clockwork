[[jobs]]
name = "template-consolidation-agentic"
launchd_label = "io.github.casonk.traction-control.template-consolidation-agentic"
description = "Every-other-day agentic review of repo SECURITY.md and LESSONSLEARNED.md files for shared template promotion"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/template_consolidation_agentic.sh"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/template-consolidation-agentic.env"]
standard_output = "journal"
standard_error = "journal"
timer_description = "Run the traction-control template consolidation agent every other day"

[jobs.environment]
PATH = "%h/.local/npm-global/bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin"
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/template-consolidation-agentic"
TEMPLATE_CONSOLIDATION_PROVIDER = "auto"
TEMPLATE_CONSOLIDATION_MODEL = ""

[jobs.timer]
kind = "interval"
on_boot_sec = "30m"
on_unit_active_sec = "2d"
persistent = true
randomized_delay_sec = "900"

[jobs.cron]
expression = "0 0 */2 * *"
command = "mkdir -p $HOME/.local/share/template-consolidation-agentic/runs && cd $HOME/git/util-repos/traction-control && %h/git/util-repos/traction-control/scripts/template_consolidation_agentic.sh >> $HOME/.local/share/template-consolidation-agentic/runs/cron.log 2>&1"
comments = ["Auto-generated from systemd timer: every 2d"]
