[[jobs]]
name = "tachometer-disk-pressure-agentic"
launchd_label = "io.github.casonk.traction-control.tachometer-disk-pressure-agentic"
description = "Agentic remediation for tachometer disk-pressure alerts"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/traction-control"
exec_start = "%h/git/util-repos/traction-control/scripts/tachometer_disk_pressure_agentic.sh"
after = ["network-online.target"]
wants = ["network-online.target"]
environment_files = ["-%h/.config/traction-control/tachometer-disk-pressure-agentic.env"]
standard_output = "journal"
standard_error = "journal"

[jobs.environment]
PORTFOLIO_ROOT = "%h/git"
LOG_DIR = "%h/.local/share/tachometer-disk-pressure-agentic"
TACHOMETER_DISK_PRESSURE_AGENTIC_PROVIDER = "auto"
TACHOMETER_DISK_PRESSURE_AGENTIC_MODEL = ""

[jobs.timer]
kind = "interval"
on_boot_sec = "110m"
on_unit_active_sec = "6h"
persistent = true
randomized_delay_sec = "1200"
