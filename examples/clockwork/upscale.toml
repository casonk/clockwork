[[jobs]]
name = "clockwork-upscale"
description = "Experimental AI super-resolution of the watch library (Real-ESRGAN on the GPU)"
scope = "user"
service_type = "simple"
working_directory = "%h/git/util-repos/clockwork"
# Each render runs through ecu at batch or interactive priority.
exec_start = "%h/.local/share/clockwork/upscale-venv/bin/python %h/git/util-repos/clockwork/web/upscale.py run"
# Tuning (duty cycle, temperature limits, disk floor, ...): see config/upscale.env.example.
environment_files = ["-%h/git/util-repos/clockwork/config/upscale.env.local"]
after = ["network-online.target"]
restart = "on-failure"
restart_sec = "60"
standard_output = "journal"
standard_error = "journal"
service_install_wanted_by = ["default.target"]

[jobs.environment]
CLOCKWORK_WATCH_DIR = "%h/watch"
