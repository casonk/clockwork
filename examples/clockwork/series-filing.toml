[[jobs]]
name = "clockwork-series-filing"
description = "Link completed episodes from the torrent dirs into existing library show folders"
scope = "user"
service_type = "oneshot"
working_directory = "%h/git/util-repos/clockwork"
exec_start = "/usr/bin/python3 %h/git/util-repos/clockwork/scripts/file_completed_series.py"
environment_files = ["-%h/.config/clockwork/media-library.env"]
standard_output = "journal"
standard_error = "journal"
timer_description = "File completed episodes into the library"

[jobs.environment]
CLOCKWORK_WATCH_DIR = "%h/watch"

[jobs.timer]
kind = "interval"
on_boot_sec = "5m"
on_startup_sec = "5m"
on_unit_active_sec = "10m"
on_unit_inactive_sec = "10m"
persistent = true

[jobs.cron]
expression = "*/10 * * * *"
command = "cd $HOME/git/util-repos/clockwork && /usr/bin/python3 scripts/file_completed_series.py >> $HOME/.local/share/clockwork-media-library/series-filing.cron.log 2>&1"
comments = ["Auto-generated from systemd timer: every 10m"]
