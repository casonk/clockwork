<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>To Watch — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --surface3:  #191c2a;
      --border:    #2e3250;
      --accent:    #5b7fff;
      --accent-dim:#2d3f8a;
      --green:     #3ecf6e;
      --green-dim: #1a4d30;
      --red:       #e05252;
      --red-dim:   #4d1a1a;
      --yellow:    #e0b832;
      --yellow-dim:#4d3d0a;
      --text:      #e2e4f0;
      --muted:     #8890b0;
      --cyan:      #1abc9c;
      --cyan-dim:  #0a3330;
      --mono:      "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-link { font-size: 20px; text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
    .back-link:hover { opacity: 1; }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle { color: var(--muted); font-size: 12px; }

    /* ── Progress bar ── */
    .progress-bar { height: 3px; background: var(--border); }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

    /* ── Flash ── */
    #flash-list {
      max-width: 680px; margin: 14px auto 0;
      padding: 0 14px; display: flex; flex-direction: column; gap: 5px;
    }
    .flash {
      padding: 8px 12px; border-radius: 7px; font-size: 12px;
      display: flex; align-items: center; gap: 8px;
      animation: flash-in 0.2s ease;
    }
    @keyframes flash-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    .flash.success { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .flash.error   { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }
    .flash-close {
      margin-left: auto; background: none; border: none; color: inherit;
      cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.7;
    }
    .flash-close:hover { opacity: 1; }

    /* ── Layout ── */
    main { max-width: 680px; margin: 0 auto; padding: 18px 14px 100px; }

    /* ── Empty state ── */
    .empty-state { text-align: center; color: var(--muted); padding: 48px 24px; font-size: 14px; }
    .empty-state p { margin-bottom: 6px; }

    /* ── Category card ── */
    .category {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 14px; overflow: hidden;
    }
    .category-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .category-name {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted); flex: 1;
    }
    .category-count {
      font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    }
    .category-count .to-watch { color: var(--accent); font-weight: 700; }
    .category-count .lib-found { color: var(--green); font-weight: 700; }

    /* ── Item list ── */
    .items { padding: 6px 0; max-height: 452px; overflow-y: auto; }
    .items::-webkit-scrollbar { width: 4px; }
    .items::-webkit-scrollbar-track { background: transparent; }
    .items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .items::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    .item {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 14px; min-height: 44px;
    }
    .item:not(:last-child) { border-bottom: 1px solid rgba(46,50,80,0.4); }

    /* Toggle checkbox */
    .check-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 2px solid var(--border);
      background: transparent; cursor: pointer; font-size: 13px;
      transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .check-btn.watched  { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .check-btn.unwatched { background: transparent; border-color: var(--border); color: transparent; }
    .check-btn.unwatched:hover { border-color: var(--muted); }

    .item-body {
      flex: 1; display: flex; align-items: baseline; gap: 6px; min-width: 0;
    }
    .item-title {
      font-size: 14px; user-select: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-title.watched  { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
    .item-title.unwatched { color: var(--text); }
    .item-year { font-size: 11px; color: var(--muted); flex-shrink: 0; }

    /* ── Library status dot ── */
    .lib-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.2s;
    }
    .lib-dot.found   { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .lib-dot.missing { background: var(--border); }

    /* ── Find (search) button ── */
    .find-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted);
      font-size: 13px; cursor: pointer; line-height: 1;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      opacity: 0.5; flex-shrink: 0;
    }
    .item:hover .find-btn { opacity: 1; }
    .find-btn:hover, .find-btn.active {
      color: var(--cyan); border-color: var(--cyan-dim); background: var(--cyan-dim);
      opacity: 1;
    }
    .find-btn.searching { animation: pulse 1s infinite; color: var(--cyan); opacity: 1; }

    .delete-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--muted);
      font-size: 15px; cursor: pointer; line-height: 1;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      opacity: 0.4; flex-shrink: 0;
    }
    .item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }

    /* ── Search panel ── */
    .search-panel {
      border-top: 1px solid var(--border);
      background: var(--surface3);
      padding: 10px 14px;
      display: none;
    }
    .search-panel.open { display: block; }

    .search-panel-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .search-source-badge {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }
    .search-source-badge.nyaa      { background: #1a0a3d; border-color: #a07bff; color: #a07bff; }
    .search-source-badge.torrents-csv { background: #0a2030; border-color: #3ab0e0; color: #3ab0e0; }

    .search-loading {
      text-align: center; color: var(--muted); font-size: 12px; padding: 12px 0;
    }
    .search-empty {
      text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0; font-style: italic;
    }

    .torrent-result {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(46,50,80,0.3);
    }
    .torrent-result:last-child { border-bottom: none; }

    .torrent-name {
      flex: 1; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; cursor: pointer;
    }
    .torrent-name:hover { color: var(--accent); }
    .torrent-name.expanded { white-space: normal; overflow: visible; text-overflow: unset; }

    .quality-pill {
      font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
      flex-shrink: 0; white-space: nowrap; font-family: var(--mono);
    }
    .q-2160p, .q-4K { background: #0a3330; color: var(--cyan); border: 1px solid var(--cyan-dim); }
    .q-1080p         { background: var(--accent-dim); color: var(--accent); border: 1px solid #1a2a5a; }
    .q-720p          { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #2d2000; }
    .q-480p          { background: #1e2030; color: var(--muted); border: 1px solid var(--border); }

    .seeds-count {
      font-size: 11px; font-family: var(--mono); color: var(--green);
      flex-shrink: 0; white-space: nowrap; min-width: 44px; text-align: right;
    }
    .seeds-count.low { color: var(--yellow); }
    .seeds-count.dead { color: var(--muted); }

    .torrent-size {
      font-size: 11px; color: var(--muted); flex-shrink: 0;
      white-space: nowrap; font-family: var(--mono); min-width: 56px; text-align: right;
    }

    .add-torrent-btn {
      padding: 3px 10px; border-radius: 5px; border: 1px solid var(--green-dim);
      background: transparent; color: var(--green);
      font-size: 11px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: background 0.15s; flex-shrink: 0;
    }
    .add-torrent-btn:hover { background: var(--green-dim); }
    .add-torrent-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .add-torrent-btn.adding { animation: pulse 0.8s infinite; }
    .add-torrent-btn.added  { color: var(--muted); border-color: var(--border); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Add item row ── */
    .add-item-row {
      display: flex; gap: 8px; padding: 10px 14px;
      border-top: 1px solid var(--border); background: var(--surface3);
    }
    .add-item-row input[type="text"] {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; color: var(--text);
      font-size: 13px; outline: none; min-width: 0;
    }
    .add-item-row input[type="text"]:focus { border-color: var(--accent); }
    .add-item-row input[type="text"]::placeholder { color: var(--muted); }
    .add-item-btn {
      padding: 7px 14px; border-radius: 6px; border: none;
      background: var(--accent-dim); color: var(--accent);
      font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: filter 0.15s;
    }
    .add-item-btn:hover { filter: brightness(1.2); }

    /* ── Delete category button ── */
    .cat-delete-btn {
      width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 5px; border: 1px solid transparent;
      background: transparent; color: var(--muted);
      font-size: 14px; cursor: pointer; line-height: 1;
      transition: color 0.15s, border-color 0.15s, background 0.15s; opacity: 0.5;
    }
    .cat-delete-btn:hover { opacity: 1; color: var(--red); border-color: var(--red-dim); background: var(--red-dim); }

    /* ── Add category strip ── */
    .add-category {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; display: flex; gap: 8px;
    }
    .add-category input[type="text"] {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; color: var(--text);
      font-size: 13px; outline: none; min-width: 0;
    }
    .add-category input[type="text"]:focus { border-color: var(--accent); }
    .add-category input[type="text"]::placeholder { color: var(--muted); }
    .add-category-btn {
      padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent-dim);
      background: transparent; color: var(--accent);
      font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: background 0.15s;
    }
    .add-category-btn:hover { background: var(--accent-dim); }

    /* ── Backup menu ── */
    .backup-wrap { position: relative; }
    .backup-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .backup-btn:hover { color: var(--text); border-color: var(--muted); }
    .backup-panel {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px; min-width: 210px;
      display: flex; flex-direction: column; gap: 2px;
      z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .backup-panel.hidden { display: none; }
    .backup-slot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: 5px; gap: 10px;
    }
    .backup-slot:hover { background: var(--surface3); }
    .backup-slot-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .backup-slot-ts { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .backup-restore-btn {
      padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .backup-restore-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .backup-restore-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Header action buttons ── */
    .reset-btn, .lib-check-btn, .sort-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .reset-btn:hover { color: var(--yellow); border-color: var(--yellow); }
    .lib-check-btn:hover { color: var(--green); border-color: var(--green); }
    .lib-check-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .lib-check-btn.checking { color: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }
    .sort-btn:hover { color: var(--cyan); border-color: var(--cyan); }
    .sort-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sort-btn.sorting { color: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }

    /* ── Library summary chip ── */
    .lib-chip {
      font-size: 11px; color: var(--green); white-space: nowrap;
      padding: 3px 8px; border-radius: 5px;
      border: 1px solid var(--green-dim); background: var(--green-dim);
    }

    /* ── Type badges ── */
    .type-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      text-transform: uppercase; padding: 1px 6px; border-radius: 4px;
      flex-shrink: 0; white-space: nowrap;
    }
    .type-Movies        { background:#1a2a4d; color:#5b9eff; }
    .type-TV-Shows      { background:#1a0a3d; color:#a07bff; }
    .type-Anime         { background:#3d0a2d; color:#ff7bb0; }
    .type-Documentaries { background:#0a3330; color:#1abc9c; }
    .type-custom        { background:#1e2030; color:#8890b0; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      header { flex-wrap: wrap; padding: 10px 14px; }
      .item { min-height: 48px; }
      .torrent-size { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="/home" class="back-link" title="Home">🏠</a>
    <a href="/" class="back-link" title="Clockwork">⏰</a>
    <div>
      <h1>📺 To Watch</h1>
      <div class="subtitle" id="header-subtitle">Loading…</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span class="lib-chip" id="lib-chip" style="display:none"></span>
    <button class="lib-check-btn" id="lib-check-btn" onclick="checkLibrary()"
            title="Check which titles exist in the watch folder">⬛ Check Library</button>
    <button class="sort-btn" id="sort-btn" onclick="sortDownloads()"
            title="Move completed downloads from torrent dir to library">📦 Sort Downloads</button>
    <div class="backup-wrap">
      <button class="backup-btn" onclick="toggleBackupMenu()">↩ Restore</button>
      <div class="backup-panel hidden" id="backup-panel"></div>
    </div>
    <button class="reset-btn" onclick="resetAll()" title="Mark everything as unwatched">↺ Reset</button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill" style="width:0%"></div>
</div>

<div id="flash-list"></div>

<main id="main"></main>

<script>
  const STORAGE_KEY = 'to-watch-data';

  const DEFAULT_DATA = {
    categories: [
      { name: 'Movies',        items: [] },
      { name: 'TV Shows',      items: [] },
      { name: 'Anime',         items: [] },
      { name: 'Documentaries', items: [] },
    ]
  };

  const TYPE_COLORS = {
    'Movies':        'Movies',
    'TV Shows':      'TV-Shows',
    'Anime':         'Anime',
    'Documentaries': 'Documentaries',
  };

  // Library check state (in-memory, reset on reload)
  let libResults = null;
  let libChecking = false;

  // Open search panels: "ci-ii" → { open: bool, results: [], loading: bool }
  const searchState = {};

  // ── Persistence ──────────────────────────────────────────────────────────

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(_) {}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  function save(data) {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) {
      try {
        const snap = JSON.parse(current);
        snap._backedUpAt = new Date().toISOString();
        const hot = localStorage.getItem(STORAGE_KEY + '-hot');
        const cold = localStorage.getItem(STORAGE_KEY + '-cold');
        if (cold) localStorage.setItem(STORAGE_KEY + '-archive', cold);
        if (hot) localStorage.setItem(STORAGE_KEY + '-cold', hot);
        localStorage.setItem(STORAGE_KEY + '-hot', JSON.stringify(snap));
      } catch (_) {}
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ── Flash notifications ───────────────────────────────────────────────────

  function flash(msg, type = 'success') {
    const list = document.getElementById('flash-list');
    const el = document.createElement('div');
    el.className = `flash ${type}`;
    el.innerHTML = `<span>${type === 'success' ? '✓' : '✗'}&nbsp;${msg}</span>
      <button class="flash-close" onclick="this.parentElement.remove()">×</button>`;
    list.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  // ── Utilities ─────────────────────────────────────────────────────────────

  function parseTitle(raw) {
    const m = raw.trim().match(/^(.+?)\s*\((\d{4})\)\s*$/);
    if (m) return { title: m[1].trim(), year: m[2] };
    return { title: raw.trim(), year: null };
  }

  function badgeClass(catName) {
    return 'type-' + (TYPE_COLORS[catName] || 'custom');
  }

  function totalStats(data) {
    let total = 0, watched = 0;
    for (const cat of data.categories)
      for (const item of cat.items) { total++; if (item.watched) watched++; }
    return { total, watched };
  }

  function fmtBytes(bytes) {
    if (!bytes) return '';
    const units = ['B','KB','MB','GB','TB'];
    let v = bytes;
    for (const u of units) {
      if (v < 1024 || u === 'TB') return `${v.toFixed(u === 'B' ? 0 : 1)} ${u}`;
      v /= 1024;
    }
    return '';
  }

  function qualityClass(q) {
    return q ? `quality-pill q-${q.replace(/\s/g,'')}` : '';
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Header update ─────────────────────────────────────────────────────────

  function updateHeader(data) {
    const { total, watched } = totalStats(data);
    document.getElementById('header-subtitle').textContent =
      total === 0 ? 'No items yet' : `${watched} / ${total} watched`;
    document.getElementById('progress-fill').style.width =
      total === 0 ? '0%' : `${Math.round(watched / total * 100)}%`;

    const chip = document.getElementById('lib-chip');
    if (libResults && total > 0) {
      let found = 0, checked = 0;
      for (const cat of data.categories)
        for (const item of cat.items) {
          const r = libResults[item.title];
          if (r !== undefined) { checked++; if (r.found) found++; }
        }
      if (checked > 0) { chip.textContent = `${found}/${checked} in library`; chip.style.display = ''; }
      else chip.style.display = 'none';
    } else {
      chip.style.display = 'none';
    }

    const btn = document.getElementById('lib-check-btn');
    if (libChecking) {
      btn.disabled = true; btn.classList.add('checking'); btn.textContent = '⬛ Checking…';
    } else {
      btn.disabled = false; btn.classList.remove('checking');
      btn.textContent = libResults ? '⬛ Re-check' : '⬛ Check Library';
    }
  }

  // ── Render ────────────────────────────────────────────────────────────────

  function render() {
    const data = load();
    updateHeader(data);

    const main = document.getElementById('main');
    main.innerHTML = '';

    if (data.categories.length === 0) {
      main.innerHTML = '<div class="empty-state"><p>No lists yet.</p><p>Add a category below to get started.</p></div>';
    }

    for (let ci = 0; ci < data.categories.length; ci++) {
      const cat = data.categories[ci];
      const toWatch = cat.items.filter(i => !i.watched).length;
      const catSlug = badgeClass(cat.name);

      let catFound = 0;
      if (libResults) {
        for (const item of cat.items) {
          if (libResults[item.title]?.found) catFound++;
        }
      }

      const card = document.createElement('div');
      card.className = 'category';
      card.id = `cat-${ci}`;

      let countHtml = toWatch > 0
        ? `<span class="to-watch">${toWatch} to watch</span>`
        : `all watched`;
      if (libResults && cat.items.length > 0)
        countHtml += ` &nbsp;<span class="lib-found">${catFound} in library</span>`;

      card.innerHTML = `
        <div class="category-header">
          <span class="category-name">${esc(cat.name)}</span>
          <span class="category-count">${countHtml}</span>
          <button class="cat-delete-btn" onclick="deleteCategory(${ci})" title="Delete list">×</button>
        </div>
        <div class="items" id="items-${ci}"></div>
        <div class="add-item-row">
          <input type="text" id="add-input-${ci}" placeholder='Add title… or "Title (Year)"' autocomplete="off">
          <button class="add-item-btn" onclick="addItem(${ci})">+ Add</button>
        </div>
      `;
      main.appendChild(card);

      const itemsEl = document.getElementById(`items-${ci}`);
      document.getElementById(`add-input-${ci}`)
        .addEventListener('keydown', e => { if (e.key === 'Enter') addItem(ci); });

      const unwatched = cat.items.map((item, ii) => ({ item, ii })).filter(x => !x.item.watched);
      const watched   = cat.items.map((item, ii) => ({ item, ii })).filter(x =>  x.item.watched);

      if (unwatched.length + watched.length === 0) {
        itemsEl.innerHTML = `<div class="item" style="color:var(--muted);font-size:12px;font-style:italic;">Nothing here — add something to watch.</div>`;
      } else {
        for (const { item, ii } of [...unwatched, ...watched]) {
          const libResult = libResults?.[item.title];
          const libDotHtml = libResult !== undefined
            ? `<span class="lib-dot ${libResult.found ? 'found' : 'missing'}"
                     title="${libResult.found ? 'In library: ' + esc(libResult.match || '') : 'Not in library'}"></span>`
            : '';

          const key = `${ci}-${ii}`;
          const ss = searchState[key];
          const findActive = ss?.open;

          // Only show Find button for unwatched items
          const findBtnHtml = !item.watched
            ? `<button class="find-btn ${findActive ? 'active' : ''}"
                       id="find-btn-${key}"
                       onclick="toggleSearch(${ci},${ii})"
                       title="${findActive ? 'Close search' : 'Find torrent'}">🔍</button>`
            : '';

          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';
          itemDiv.id = `item-${key}`;
          itemDiv.innerHTML = `
            <button class="check-btn ${item.watched ? 'watched' : 'unwatched'}"
                    onclick="toggleItem(${ci},${ii})"
                    title="${item.watched ? 'Mark as unwatched' : 'Mark as watched'}">
              ${item.watched ? '✓' : ''}
            </button>
            <div class="item-body">
              <span class="item-title ${item.watched ? 'watched' : 'unwatched'}">${esc(item.title)}</span>
              ${item.year ? `<span class="item-year">${esc(item.year)}</span>` : ''}
            </div>
            ${libDotHtml}
            ${findBtnHtml}
            <span class="type-badge ${catSlug}">${esc(cat.name)}</span>
            <button class="delete-btn" onclick="deleteItem(${ci},${ii})" title="Remove">×</button>
          `;
          itemsEl.appendChild(itemDiv);

          // Search panel (only for unwatched)
          if (!item.watched) {
            const panel = document.createElement('div');
            panel.className = `search-panel${findActive ? ' open' : ''}`;
            panel.id = `search-panel-${key}`;
            itemsEl.appendChild(panel);
            if (findActive) renderSearchPanel(panel, key, cat.name);
          }
        }
      }
    }

    // Add category strip
    const strip = document.createElement('div');
    strip.className = 'add-category';
    strip.innerHTML = `
      <input type="text" id="new-cat-input" placeholder="New list (e.g. Shorts, Stand-up, K-Drama)…" autocomplete="off">
      <button class="add-category-btn" onclick="addCategory()">+ List</button>
    `;
    main.appendChild(strip);
    document.getElementById('new-cat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addCategory();
    });
  }

  // ── Search panel rendering ────────────────────────────────────────────────

  function renderSearchPanel(panel, key, catName) {
    const ss = searchState[key];
    const source = catName.toLowerCase() === 'anime' ? 'nyaa' : 'torrents-csv';

    let inner = `<div class="search-panel-header">
      Torrent search
      <span class="search-source-badge ${source}">${source === 'nyaa' ? 'Nyaa.si' : 'torrents-csv'}</span>
    </div>`;

    if (ss.loading) {
      inner += `<div class="search-loading">Searching…</div>`;
    } else if (!ss.results) {
      inner += `<div class="search-empty">No results yet.</div>`;
    } else if (ss.results.length === 0) {
      inner += `<div class="search-empty">No torrents found.</div>`;
    } else {
      for (let ri = 0; ri < ss.results.length; ri++) {
        const r = ss.results[ri];
        const qc = qualityClass(r.quality);
        const seedClass = r.seeders > 20 ? '' : r.seeders > 5 ? 'low' : 'dead';
        const sizeStr = r.size_str || (r.size_bytes ? fmtBytes(r.size_bytes) : '');
        inner += `
          <div class="torrent-result">
            <span class="torrent-name" title="Click to expand" onclick="this.classList.toggle('expanded')">${esc(r.name)}</span>
            ${r.quality ? `<span class="${qc}">${esc(r.quality)}</span>` : ''}
            <span class="seeds-count ${seedClass}">↑${r.seeders}</span>
            ${sizeStr ? `<span class="torrent-size">${esc(sizeStr)}</span>` : ''}
            <button class="add-torrent-btn" id="add-btn-${key}-${ri}"
                    onclick="addTorrent('${esc(r.magnet)}','${esc(r.name)}','${key}',${ri})"
                    title="Send to Magneto / Transmission">+ Add</button>
          </div>`;
      }
    }

    panel.innerHTML = inner;
  }

  // ── Search actions ────────────────────────────────────────────────────────

  async function toggleSearch(ci, ii) {
    const key = `${ci}-${ii}`;
    const data = load();
    const item = data.categories[ci]?.items[ii];
    if (!item) return;

    const ss = searchState[key];
    if (ss?.open) {
      // Close
      searchState[key] = { open: false };
      render();
      return;
    }

    // Open and trigger search
    searchState[key] = { open: true, loading: true, results: null };
    render();

    const q = item.year ? `${item.title} ${item.year}` : item.title;
    const catName = data.categories[ci].name;

    try {
      const params = new URLSearchParams({ q, cat: catName });
      const resp = await fetch(`/api/torrent-search?${params}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const json = await resp.json();
      searchState[key] = { open: true, loading: false, results: json.results || [] };
    } catch(e) {
      searchState[key] = { open: true, loading: false, results: [], error: String(e) };
      flash(`Torrent search failed: ${e}`, 'error');
    }

    // Re-render just the panel to avoid wiping focus
    const panel = document.getElementById(`search-panel-${key}`);
    if (panel) {
      const catName2 = data.categories[ci].name;
      renderSearchPanel(panel, key, catName2);
    } else {
      render();
    }
  }

  async function addTorrent(magnet, name, key, ri) {
    const btnId = `add-btn-${key}-${ri}`;
    const btn = document.getElementById(btnId);
    if (btn) { btn.disabled = true; btn.classList.add('adding'); btn.textContent = '…'; }

    try {
      const resp = await fetch('/api/torrent-add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ magnet }),
      });
      const json = await resp.json();
      if (json.ok) {
        flash(`Added "${name}" to Transmission via Magneto.`);
        if (btn) { btn.classList.remove('adding'); btn.classList.add('added'); btn.textContent = '✓ Added'; }
      } else {
        flash(`Magneto error: ${json.error || 'unknown'}`, 'error');
        if (btn) { btn.disabled = false; btn.classList.remove('adding'); btn.textContent = '+ Add'; }
      }
    } catch(e) {
      flash(`Failed to reach Magneto: ${e}`, 'error');
      if (btn) { btn.disabled = false; btn.classList.remove('adding'); btn.textContent = '+ Add'; }
    }
  }

  // ── Library check ─────────────────────────────────────────────────────────

  async function checkLibrary() {
    const data = load();
    const titles = [];
    for (const cat of data.categories)
      for (const item of cat.items)
        titles.push({ title: item.title, year: item.year || null });

    if (titles.length === 0) { flash('No items to check.', 'error'); return; }

    libChecking = true;
    updateHeader(data);

    try {
      const resp = await fetch('/api/watch-check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titles }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const json = await resp.json();
      if (!json.available) {
        flash('Watch folder not accessible — check CLOCKWORK_WATCH_DIR.', 'error');
        libResults = null;
      } else {
        libResults = json.matches;
        const found = Object.values(libResults).filter(r => r.found).length;
        flash(`Library: ${found} of ${titles.length} title${titles.length !== 1 ? 's' : ''} found in watch folder.`,
              found > 0 ? 'success' : 'error');
      }
    } catch(e) {
      flash('Library check failed — is Clockwork running?', 'error');
      libResults = null;
    }

    libChecking = false;
    render();
  }

  // ── Sort downloads ────────────────────────────────────────────────────────

  async function sortDownloads() {
    const btn = document.getElementById('sort-btn');
    if (btn) { btn.disabled = true; btn.classList.add('sorting'); btn.textContent = '⏳ Sorting…'; }

    try {
      const resp = await fetch('/api/sort-downloads', { method: 'POST' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const json = await resp.json();

      const moved = json.moved || [];
      const skipped = json.skipped || [];
      const errors = json.errors || [];

      if (moved.length === 0 && errors.length === 0) {
        const reason = skipped.length > 0
          ? `${skipped.length} item${skipped.length !== 1 ? 's' : ''} skipped (in progress or already in library)`
          : 'No completed downloads found in torrent dir.';
        flash(reason, skipped.length > 0 ? 'success' : 'error');
      } else {
        if (moved.length > 0) {
          const byType = {};
          for (const m of moved) { byType[m.type] = (byType[m.type] || 0) + 1; }
          const summary = Object.entries(byType).map(([t, n]) => `${n} ${t}`).join(', ');
          flash(`Sorted ${moved.length} item${moved.length !== 1 ? 's' : ''}: ${summary}.`);
        }
        for (const e of errors) flash(`Error moving "${e.name}": ${e.error}`, 'error');
      }

      if (moved.length > 0) {
        // Re-run library check to refresh the dots, then restore button
        if (btn) { btn.classList.remove('sorting'); btn.textContent = '📦 Sort Downloads'; }
        await checkLibrary();
        if (btn) btn.disabled = false;
        return;
      }
    } catch(e) {
      flash(`Sort failed: ${e}`, 'error');
    }

    if (btn) { btn.disabled = false; btn.classList.remove('sorting'); btn.textContent = '📦 Sort Downloads'; }
  }

  // ── Item actions ──────────────────────────────────────────────────────────

  function toggleItem(ci, ii) {
    const data = load();
    data.categories[ci].items[ii].watched = !data.categories[ci].items[ii].watched;
    // Close any open search for this item when marking watched
    if (data.categories[ci].items[ii].watched)
      searchState[`${ci}-${ii}`] = { open: false };
    save(data);
    render();
  }

  function addItem(ci) {
    const input = document.getElementById(`add-input-${ci}`);
    const raw = input.value.trim();
    if (!raw) return;
    const { title, year } = parseTitle(raw);
    const data = load();
    const cat = data.categories[ci];
    if (cat.items.some(i => i.title.toLowerCase() === title.toLowerCase())) {
      flash(`"${title}" is already in ${cat.name}.`, 'error');
      return;
    }
    cat.items.push({ title, watched: false, ...(year ? { year } : {}) });
    save(data);
    input.value = '';
    flash(`Added "${title}" to ${cat.name}.`);
    render();
    const newInput = document.getElementById(`add-input-${ci}`);
    if (newInput) newInput.focus();
  }

  function deleteItem(ci, ii) {
    const data = load();
    const title = data.categories[ci].items[ii].title;
    data.categories[ci].items.splice(ii, 1);
    delete searchState[`${ci}-${ii}`];
    save(data);
    flash(`Removed "${title}".`);
    render();
  }

  function addCategory() {
    const input = document.getElementById('new-cat-input');
    const name = input.value.trim();
    if (!name) return;
    const data = load();
    if (data.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      flash(`"${name}" already exists.`, 'error');
      return;
    }
    data.categories.push({ name, items: [] });
    save(data);
    input.value = '';
    flash(`Created list "${name}".`);
    render();
  }

  function deleteCategory(ci) {
    const data = load();
    const name = data.categories[ci].name;
    if (!confirm(`Delete the "${name}" list and all its items?`)) return;
    // Clear any open search panels for this category
    for (let ii = 0; ii < data.categories[ci].items.length; ii++)
      delete searchState[`${ci}-${ii}`];
    data.categories.splice(ci, 1);
    save(data);
    flash(`Deleted list "${name}".`);
    render();
  }

  function resetAll() {
    if (!confirm('Mark all items as unwatched?')) return;
    const data = load();
    for (const cat of data.categories)
      for (const item of cat.items) item.watched = false;
    save(data);
    flash('Reset — all items marked as unwatched.');
    render();
  }

  // ── Backup menu ───────────────────────────────────────────────────────────

  let _backupMenuOpen = false;

  function toggleBackupMenu() {
    _backupMenuOpen = !_backupMenuOpen;
    const panel = document.getElementById('backup-panel');
    if (_backupMenuOpen) {
      renderBackupPanel(panel);
      panel.classList.remove('hidden');
      setTimeout(() => document.addEventListener('click', _outsideBackupClick, { once: true }), 0);
    } else {
      panel.classList.add('hidden');
    }
  }

  function _outsideBackupClick(e) {
    const wrap = document.getElementById('backup-panel')?.closest('.backup-wrap');
    if (wrap?.contains(e.target)) {
      setTimeout(() => document.addEventListener('click', _outsideBackupClick, { once: true }), 0);
    } else {
      _backupMenuOpen = false;
      document.getElementById('backup-panel')?.classList.add('hidden');
    }
  }

  function renderBackupPanel(panel) {
    const slots = [
      { key: 'hot',     label: 'Hot',     desc: 'previous version' },
      { key: 'cold',    label: 'Cold',    desc: '2 versions ago' },
      { key: 'archive', label: 'Archive', desc: '3 versions ago' },
    ];
    panel.innerHTML = slots.map(({ key, label, desc }) => {
      let ts = '', hasData = false;
      try {
        const raw = localStorage.getItem(STORAGE_KEY + '-' + key);
        if (raw) {
          hasData = true;
          const d = JSON.parse(raw);
          if (d._backedUpAt) {
            ts = new Date(d._backedUpAt).toLocaleString(undefined,
              { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          }
        }
      } catch(_) {}
      return `<div class="backup-slot">
        <div>
          <div class="backup-slot-name">${label}</div>
          <div class="backup-slot-ts">${ts || desc}</div>
        </div>
        <button class="backup-restore-btn" onclick="restoreFromBackup('${key}')"
                ${hasData ? '' : 'disabled'}>Restore</button>
      </div>`;
    }).join('');
  }

  function restoreFromBackup(slot) {
    _backupMenuOpen = false;
    document.getElementById('backup-panel')?.classList.add('hidden');
    const raw = localStorage.getItem(STORAGE_KEY + '-' + slot);
    if (!raw) { flash(`No ${slot} backup found.`, 'error'); return; }
    let backup;
    try { backup = JSON.parse(raw); } catch (_) { flash('Corrupt backup.', 'error'); return; }
    const ts = backup._backedUpAt
      ? new Date(backup._backedUpAt).toLocaleString(undefined,
          { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : 'unknown time';
    if (!confirm(`Restore ${slot} backup from ${ts}?\nYour current list will become the new hot backup.`)) return;
    delete backup._backedUpAt;
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) {
      try {
        const snap = JSON.parse(current);
        snap._backedUpAt = new Date().toISOString();
        const hot = localStorage.getItem(STORAGE_KEY + '-hot');
        const cold = localStorage.getItem(STORAGE_KEY + '-cold');
        if (cold) localStorage.setItem(STORAGE_KEY + '-archive', cold);
        if (hot) localStorage.setItem(STORAGE_KEY + '-cold', hot);
        localStorage.setItem(STORAGE_KEY + '-hot', JSON.stringify(snap));
      } catch (_) {}
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(backup));
    flash(`Restored from ${slot} backup (${ts}).`);
    render();
  }

  render();
</script>

</body>
</html>
