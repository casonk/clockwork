<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>Tradility — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --surface3: color-mix(in srgb, var(--bg) 50%, var(--surface)); --muted-fg: var(--muted); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--font-size);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
    .header-meta { font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
    .header-meta.stale { color: var(--red); font-weight: 700; }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted-fg); white-space: nowrap;
    }
    .indicator-group { display: flex; gap: 4px; }
    .ind-row { display: flex; justify-content: space-between; gap: 8px; }
    .ind-btn {
      padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .ind-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .ind-btn:hover:not(.active) { border-color: var(--muted-fg); color: var(--text); }
    /* strength: weak is dashed and quiet, strong is solid and bold; the tag spells it out */
    .ind-btn.lvl-weak { border-style: dashed; opacity: 0.8; }
    .ind-btn.lvl-strong { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .ind-settings { position: relative; }
    .ind-settings > summary {
      list-style: none; cursor: pointer; padding: 5px 12px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600;
    }
    .ind-settings > summary::-webkit-details-marker { display: none; }
    .ind-settings[open] > summary { color: var(--accent); border-color: var(--accent); }
    .ind-settings-body {
      position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; width: min(420px, 92vw);
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35); padding: 12px 14px; display: grid; gap: 12px;
    }
    .ind-set { display: grid; gap: 6px; }
    .ind-set h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted-fg); }
    .ind-set-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; }
    .ind-set-row label { display: inline-flex; gap: 5px; align-items: center; color: var(--text); }
    .ind-set select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 6px; font-size: 12px;
    }
    .ind-set-reset {
      justify-self: start; padding: 4px 12px; border-radius: 99px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted-fg); font-size: 12px;
    }
    .ind-set-reset:hover { color: var(--text); border-color: var(--muted-fg); }
    .ind-tag { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 5px; }
    .ind-tag:empty { display: none; }

    .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted-fg);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--muted-fg); }
    .filter-btn:hover:not(.active) { border-color: var(--muted-fg); }

    .sort-select {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    .search-input {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; outline: none; width: 130px; transition: width 0.2s;
    }
    .search-input:focus { border-color: var(--accent); width: 200px; }
    .search-input::placeholder { color: var(--muted-fg); }

    .refresh-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted-fg); }
    .refresh-btn + .refresh-btn { margin-left: 0; }
    .refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon { display: inline-block; }

    /* ── Gradient legend ── */
    .legend {
      padding: 10px 20px 8px;
      background: var(--surface3);
      border-bottom: 1px solid var(--border);
    }
    .legend-scale { position: relative; }
    .legend-bar {
      height: 8px; border-radius: 4px; width: 100%; max-width: 340px;
    }
    .legend-ticks {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 3px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-labels {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 1px;
      font-size: 10px; font-weight: 700;
    }
    .legend-lbl-buy  { color: var(--green); }
    .legend-lbl-mid  { color: var(--yellow); }
    .legend-lbl-sell { color: var(--red); }
    .legend-no-data {
      margin-top: 6px; display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-no-data-swatch {
      width: 28px; height: 8px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 16px; padding: 6px 20px;
      background: var(--surface3); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
    }
    .stat { font-size: 11px; color: var(--muted-fg); }
    .stat strong { font-weight: 700; }

    /* ── Grid ── */
    main { padding: 14px 20px 80px; }

    .ticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 8px;
    }

    /* Cards use only inline styles for color; only structural rules here */
    .ticker-card {
      border-radius: 9px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
      overflow: hidden;
      width: 100%; text-align: left; font: inherit; color: inherit;
      appearance: none; background: var(--surface);
    }
    .ticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .ticker-card.no-data { background: var(--surface); opacity: 0.55; }
    .ticker-card:disabled { cursor: default; }
    .ticker-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card-ticker {
      font-family: var(--mono);
      font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 46px;
    }
    .card-asset {
      font-size: 10px; color: var(--muted-fg); margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-price { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }

    .card-indicator {
      font-size: 11px; display: flex; align-items: center;
      justify-content: space-between; margin-top: 3px;
    }
    .card-ind-label { color: var(--muted-fg); }
    .card-ind-value { font-weight: 700; font-family: var(--mono); font-size: 11px; }

    /* Signal badge — colored inline */
    .signal-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; border: 1px solid transparent;
    }

    /* RSI progress bar */
    .rsi-bar-wrap {
      margin-top: 7px; height: 4px; border-radius: 2px; overflow: hidden;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      position: relative;
    }
    .rsi-bar-fill { height: 100%; border-radius: 2px; }
    /* Zone markers at 30% and 70% */
    .rsi-bar-wrap::before,
    .rsi-bar-wrap::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 1px;
      background: color-mix(in srgb, var(--text) 18%, transparent);
    }
    .rsi-bar-wrap::before { left: 30%; }
    .rsi-bar-wrap::after  { left: 70%; }

    /* VWAP delta */
    .vwap-delta { font-size: 10px; font-weight: 600; margin-top: 4px; }
    .card-detail-cue { margin-top: 7px; font-size: 9px; color: var(--muted-fg); }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* ── Stock detail dialog ── */
    body.detail-open { overflow: hidden; }
    /* The detail view fills the window below the top bar (--detail-top is the bar's bottom edge, set from
       the page), so the bar and its theme controls stay available. It sits under the bar (z-index 300)
       so the bar's menus open over it. */
    .detail-overlay {
      position: fixed; left: 0; right: 0; bottom: 0; top: var(--detail-top, 0px); z-index: 250;
      background: var(--bg); padding: 0; display: block;
    }
    .detail-overlay[hidden] { display: none; }
    .detail-panel {
      width: 100%; height: 100%; overflow: auto; box-sizing: border-box;
      background: var(--surface); border: 0; border-top: 1px solid var(--border); border-radius: 0;
      box-shadow: none; padding: 20px clamp(16px, 3vw, 44px);
    }
    .detail-layout { max-width: 1700px; margin: 0 auto; }
    /* a detail opened in its own window shows nothing but the detail (and the top bar) */
    body.popout header, body.popout .controls, body.popout .accounts-panel, body.popout .stats-bar,
    body.popout main, body.popout #detail-popout, body.popout .detail-close { display: none; }
    .detail-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    .detail-title { flex: 1; min-width: 0; }
    .detail-ticker { font: 800 24px var(--mono); letter-spacing: 0.6px; }
    .detail-name { color: var(--muted-fg); font-size: 12px; }
    .detail-price { font-size: 22px; font-weight: 750; white-space: nowrap; }
    .accounts-panel { margin: 8px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .accounts-panel > summary { cursor: pointer; padding: 8px 12px; font-weight: 700; font-size: 13px; }
    .accounts-total { color: var(--muted-fg); font-weight: 500; margin-left: 8px; }
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; padding: 0 12px 12px; }
    .account-card { border: 1px solid var(--border); border-radius: 9px; padding: 10px; background: var(--surface2); font-size: 12px; }
    .account-card h4 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
    .account-card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
    .account-card dt { color: var(--muted-fg); }
    .account-card dd { margin: 0; text-align: right; font-family: var(--mono); }
    .account-flag { font-size: 10px; border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; color: var(--muted-fg); }
    .account-flag.warn { border-color: var(--red); color: var(--red); }
    .account-warning { grid-column: 1 / -1; color: var(--red); font-size: 11px; margin-top: 6px; }
    .trade-box { border: 1px solid var(--border); border-radius: 9px; padding: 10px; margin-top: 10px; }
    .impact-table { margin: 6px 0 4px; }
    .trade-box h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted-fg); }
    .trade-box .trade-warn { color: var(--red); font-size: 11px; }
    .trade-box input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 12px; width: 150px; }
    .trade-box button { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 11px; margin-right: 4px; }
    .trade-box button.primary { border-color: var(--accent); color: var(--accent); }
    .template-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 2px; }
    .template-chips button { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 99px; padding: 2px 10px; font-size: 11px; cursor: pointer; }
    .template-chips button.buy { border-color: color-mix(in srgb, var(--green) 60%, var(--border)); }
    .template-chips button.sell { border-color: color-mix(in srgb, var(--red) 60%, var(--border)); }
    .template-chips button.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .order-effect { font-size: 11px; min-width: 190px; }
    /* share bars: the fill is what you hold now, the lighter segment is the change an order makes,
       and the ink tick is the To Invest target. One hue and ink, so it reads in every theme. */
    .sbar { display: block; margin-top: 4px; }
    .sbar-track { display: block; position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--border) 55%, transparent); overflow: hidden; }
    .sbar-now, .sbar-move { position: absolute; top: 0; bottom: 0; }
    .sbar-now { left: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
    .sbar-move.up { background: color-mix(in srgb, var(--accent) 38%, var(--surface)); border-radius: 0 4px 4px 0; border-left: 2px solid var(--surface); }
    .sbar-move.down { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, var(--surface)) 0 2px, transparent 2px 4px); border-radius: 0 4px 4px 0; border-left: 2px solid var(--surface); }
    .sbar-target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
    .sbar-big .sbar-track { height: 14px; border-radius: 7px; }
    .sbar-big .sbar-now, .sbar-big .sbar-move { border-radius: 0 7px 7px 0; }
    .sbar-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; color: var(--muted-fg); margin-top: 4px; }
    .sbar-legend i { display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .sbar-legend i.k-now { background: var(--accent); }
    .sbar-legend i.k-up { background: color-mix(in srgb, var(--accent) 38%, var(--surface)); }
    .sbar-legend i.k-target { width: 2px; background: var(--text); border-radius: 0; }
    .card-target { font-size: 10px; margin-top: 3px; color: var(--muted-fg); }
    .card-target.under { color: var(--accent); }
    .card-target.over { color: var(--red); }
    .target-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .target-form input, .target-form select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 11px; max-width: 130px; }
    .target-form button { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 11px; }
    #detail-target-card { order: 3; }
    .orders-sync { color: var(--muted-fg); font-size: 11px; margin: 4px 0 8px; }
    .orders-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 10px; font-size: 12px; }
    .orders-summary span { color: var(--muted-fg); }
    .orders-summary strong { color: var(--text); margin-left: 4px; }
    .orders-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    .orders-table th { text-align: left; color: var(--muted-fg); font-weight: 700; padding: 3px 6px; }
    .orders-table td { padding: 3px 6px; border-top: 1px solid var(--border); }
    .orders-table .num { text-align: right; font-family: var(--mono); }
    .order-open td:first-child { box-shadow: inset 3px 0 var(--accent); }
    .order-actions button, .order-form button {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 11px; margin-right: 3px;
    }
    .order-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .order-form select, .order-form input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 6px; font-size: 11px; max-width: 120px;
    }
    .order-form input[name=note] { max-width: 200px; }
    .order-error { color: var(--red); font-size: 11px; min-height: 14px; margin-top: 4px; }
    .detail-step {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px;
    }
    .detail-step:disabled { opacity: 0.35; cursor: default; }
    .detail-pos { align-self: center; color: var(--muted-fg); font-size: 11px; white-space: nowrap; }
    .detail-close {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px;
    }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(240px, 1fr); gap: 16px; }
    .detail-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .detail-card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted-fg); font-weight: 750; margin-bottom: 9px; }
    .detail-range-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .detail-range-btn {
      border: 1px solid var(--border); background: transparent; color: var(--muted-fg);
      border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .detail-range-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    .detail-chart-wrap { position: relative; height: clamp(280px, 40vh, 560px); }
    #detail-chart { width: 100%; height: 100%; display: block; }
    .detail-chart-summary { display: flex; justify-content: space-between; gap: 12px; color: var(--muted-fg); font-size: 11px; margin-top: 5px; }
    .detail-rating { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .detail-rating-label { font-size: 22px; font-weight: 800; }
    .rating-positive { color: var(--green); }
    .rating-negative { color: var(--red); }
    .rating-neutral { color: var(--yellow); }
    .detail-disclaimer { color: var(--muted-fg); font-size: 10px; margin-top: 6px; }
    .company-description { font-size: 12px; line-height: 1.6; margin: 0; color: var(--text); }
    .company-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-top: 12px; }
    .company-fact { min-width: 0; }
    .company-fact span { display: block; color: var(--muted-fg); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
    .company-fact strong { display: block; font-size: 11px; margin-top: 2px; overflow-wrap: anywhere; }
    .company-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; }
    .company-link { display: inline-block; color: var(--accent); font-size: 11px; text-decoration: none; }
    .company-link:hover { text-decoration: underline; }
    .component-list { display: grid; gap: 6px; margin-top: 12px; }
    .component-row, .detail-meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
    .component-row span:first-child, .detail-meta-row span:first-child { color: var(--muted-fg); }
    .return-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .return-cell { text-align: center; background: var(--surface3); border-radius: 7px; padding: 7px 3px; }
    .return-label { display: block; color: var(--muted-fg); font-size: 9px; text-transform: uppercase; }
    .return-value { display: block; font: 700 12px var(--mono); margin-top: 2px; }
    .range-track { height: 7px; background: var(--surface3); border-radius: 99px; position: relative; margin: 14px 0 5px; }
    .range-marker { position: absolute; top: -4px; width: 3px; height: 15px; background: var(--accent); border-radius: 2px; transform: translateX(-50%); }
    .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-fg); }
    /* minmax(0, 1fr) and min-width: 0 let a card shrink to the stack; an auto track would grow to the
       widest thing in it (a wide table, the order form) and push the whole stack off a narrow screen */
    .detail-stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
    .detail-card { min-width: 0; }
    #detail-orders-card { order: 2; }  /* the chart comes first, then the position and orders */
    .detail-loading { padding: 70px 20px; text-align: center; color: var(--muted-fg); }
    @media (max-width: 720px) {
      .detail-overlay { padding: 0; place-items: stretch; }
      .detail-panel { max-height: 100vh; width: 100%; border-radius: 0; padding: 15px; }
      /* minmax(0, 1fr): a plain 1fr lets a wide table stretch the column past the screen, which the
         phone answers by zooming the page; the tables scroll inside themselves instead */
      .detail-layout { grid-template-columns: minmax(0, 1fr); }
      .detail-chart-wrap { height: 260px; }
      .detail-header { flex-wrap: wrap; gap: 8px; }
      .detail-title { flex-basis: 100%; }
      .orders-table { display: block; overflow-x: auto; max-width: 100%; }
      .order-effect { min-width: 0; }
      .order-form select, .order-form input, .order-form input[name=note],
      .target-form input, .target-form select, .trade-box input[type=text] { max-width: 100%; }
      /* 16px stops iOS zooming into a field on focus, and keeps the zoom after it */
      input, select, textarea { font-size: 16px !important; }
      .order-form button, .target-form button, .trade-box button, .template-chips button,
      .order-actions button, .detail-range-btn { min-height: 36px; font-size: 13px; }
      .return-grid { grid-template-columns: repeat(3, 1fr); }
      .company-facts { grid-template-columns: 1fr; }
    }

    /* State messages */
    .state-msg { text-align: center; color: var(--muted-fg); padding: 60px 24px; font-size: 14px; }
    .error-card {
      border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); padding: 16px;
      font-size: 13px; margin-bottom: 12px; color: var(--red);
    }
  </style>

<script>
  // ── matplotlib RdYlGn colormap (11 stops, t=0 → red, t=1 → green) ─────────
  const RDYLGN = [
    [165,   0,  38],
    [215,  48,  39],
    [244, 109,  67],
    [253, 174,  97],
    [254, 224, 139],
    [255, 255, 191],
    [217, 239, 139],
    [166, 217, 106],
    [102, 189,  99],
    [ 26, 152,  80],
    [  0, 104,  55],
  ];

  function rdylgn(t) {
    t = Math.max(0, Math.min(1, t));
    const n   = RDYLGN.length - 1;
    const pos = t * n;
    const lo  = Math.floor(pos);
    const hi  = Math.min(n, lo + 1);
    const f   = pos - lo;
    return [
      Math.round(RDYLGN[lo][0] + (RDYLGN[hi][0] - RDYLGN[lo][0]) * f),
      Math.round(RDYLGN[lo][1] + (RDYLGN[hi][1] - RDYLGN[lo][1]) * f),
      Math.round(RDYLGN[lo][2] + (RDYLGN[hi][2] - RDYLGN[lo][2]) * f),
    ];
  }

  // ── Indicator settings ──────────────────────────────────────────────────────
  // What each indicator measures, chosen from the Settings panel and kept in this browser. The
  // server computes the alternative windows (indicator_variants), so a setting only picks one.
  const DEFAULT_SETTINGS = {
    rsi:   { period: 14, buy: 30, sell: 70 },          // window, and the oversold / overbought bands
    vwap:  { window: 20, band: 3 },                     // window, and how far from VWAP is decisive (%)
    trend: { short: 50, long: 200, gap: 5 },           // the two averages, and a decisive gap (%)
    fund:  { groups: ['valuation', 'profitability', 'growth', 'balance', 'short'], agree: 50 },
  };
  const FUND_GROUPS = {
    valuation: ['pe', 'peg'], profitability: ['roe', 'net_margin'], growth: ['rev_growth', 'eps_growth'],
    balance: ['debt_to_equity', 'current_ratio', 'interest_coverage'], short: ['short_float'],
  };
  let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));

  // The value of a window the server computed; the standard windows also have their own fields.
  const STANDARD_FIELD = { rsi: { 14: 'rsi_14' }, vwap: { 20: 'vwap_20' }, sma: { 50: 'sma_50', 200: 'sma_200' } };
  function variant(ticker, kind, n) {
    const found = ticker.indicator_variants && ticker.indicator_variants[kind]
      ? ticker.indicator_variants[kind][String(n)] : undefined;
    if (found != null) return found;
    const field = STANDARD_FIELD[kind] && STANDARD_FIELD[kind][n];
    return field && ticker[field] != null ? ticker[field] : null;
  }
  const rsiValue  = t => variant(t, 'rsi', settings.rsi.period);
  const vwapValue = t => variant(t, 'vwap', settings.vwap.window);
  function trendRead(t) {
    const a = variant(t, 'sma', settings.trend.short), b = variant(t, 'sma', settings.trend.long);
    const price = t.last_price;
    if (a == null || b == null || price == null) {
      const standard = settings.trend.short === 50 && settings.trend.long === 200;
      return standard && t.long_term_trend && t.long_term_trend !== 'unknown' ? t.long_term_trend : null;
    }
    if (a > b && price > b) return 'bullish';
    if (a < b && price < b) return 'bearish';
    return 'mixed';
  }
  // The fundamental rules in the chosen groups: {score, n}, or null when too few apply.
  function fundRead(t) {
    const rules = t.fundamental_signals;
    if (Array.isArray(rules)) {
      const keys = new Set(settings.fund.groups.flatMap(g => FUND_GROUPS[g] || []));
      const picked = rules.filter(r => keys.has(r.key));
      const all = settings.fund.groups.length === Object.keys(FUND_GROUPS).length;
      if (!picked.length || (all && t.fundamental_rating === 'unavailable') || (!all && picked.length < 2)) return null;
      return { score: picked.reduce((sum, r) => sum + (r.score ?? (r.signal === 'buy' ? 1 : r.signal === 'sell' ? -1 : 0)), 0), n: picked.length };
    }
    const n = t.fundamental_signal_count;
    if (!n || t.fundamental_rating === 'unavailable' || t.fundamental_score == null) return null;
    return { score: t.fundamental_score, n };
  }

  // The rating word for a chosen set of fundamental rules, on the same scale as the server's.
  function fundRating(read) {
    const ratio = read.score / read.n;
    return ratio >= 0.5 ? 'strong_buy' : ratio >= 0.2 ? 'buy' : ratio <= -0.5 ? 'strong_sell' : ratio <= -0.2 ? 'sell' : 'hold';
  }
  const indName = ind => ind === 'rsi' ? `RSI ${settings.rsi.period}`
    : ind === 'vwap' ? `VWAP ${settings.vwap.window}`
    : ind === 'trend' ? `Trend ${settings.trend.short}/${settings.trend.long}` : 'Fundamentals';

  // Each indicator reads as a probability that the ticker is a buy: t=1 buy/green, t=0 sell/red
  // (inverse of the raw colormap for RSI/VWAP). null means the indicator has no value.
  function signalT(ticker, ind) {
    if (ticker.fetch_status === 'error') return null;
    if (ind === 'rsi') {
      const v = rsiValue(ticker);
      if (v == null) return null;
      return 1 - v / 100;                      // RSI 0→t=1 (green), RSI 100→t=0 (red)
    } else if (ind === 'vwap') {
      const p = ticker.last_price, v = vwapValue(ticker);
      if (p == null || v == null || v === 0) return null;
      const d = (p - v) / v;                   // % above/below VWAP
      return Math.max(0, Math.min(1, 0.5 - d / 0.6));  // ±30% mapped to [0,1]
    }
    if (ind === 'fund') {
      // the share of fundamental rules that lean one way, held to 0.1–0.9 like the other reads
      const read = fundRead(ticker);
      if (!read) return null;
      return 0.5 + 0.4 * Math.max(-1, Math.min(1, read.score / read.n));
    }
    const read = trendRead(ticker);
    if (read === 'bullish') return 0.85;
    if (read === 'bearish') return 0.15;
    if (read === 'mixed') return 0.5;
    return null;
  }

  // Joint buy probability of the selected indicators, treated as independent evidence with an
  // even prior: P = Πp / (Πp + Π(1-p)). A neutral 0.5 changes nothing; agreeing indicators
  // reinforce each other and opposing ones cancel. Each p is held off 0 and 1 so one extreme
  // reading cannot settle the answer alone. Indicators with no value are left out; the card says
  // how many of the selected indicators contributed.
  //
  // An indicator also has a strength, cycled from its button. A weak one counts for half as much
  // (its probability is raised to the power 0.5); a strong one counts double (power 2) and speaks
  // only on a decisive reading, so a middling reading is left at an even 0.5. Normal is the plain
  // read above. `levels` maps an indicator to 'weak' | 'normal' | 'strong' (default normal).
  const P_FLOOR = 0.02;
  const LEVEL_WEIGHT = { weak: 0.5, normal: 1, strong: 2 };
  const LEVELS = ['weak', 'normal', 'strong'];
  function decisive(ticker, ind) {
    if (ind === 'rsi') {
      const v = rsiValue(ticker);
      return v <= settings.rsi.buy || v >= settings.rsi.sell;
    }
    if (ind === 'vwap') {
      const v = vwapValue(ticker);
      return Math.abs((ticker.last_price - v) / v) >= settings.vwap.band / 100;
    }
    if (ind === 'fund') {
      const read = fundRead(ticker);
      return Math.abs(read.score / read.n) >= settings.fund.agree / 100;
    }
    const a = variant(ticker, 'sma', settings.trend.short), b = variant(ticker, 'sma', settings.trend.long);
    if (a != null && b) return Math.abs((a - b) / b) >= settings.trend.gap / 100;   // gap between the averages
    const read = trendRead(ticker);
    return read === 'bullish' || read === 'bearish';
  }
  function strengthT(ticker, ind, level) {
    const p = signalT(ticker, ind);
    if (p === null || level !== 'strong') return p;
    return decisive(ticker, ind) ? p : 0.5;
  }
  function jointT(ticker, inds, levels) {
    let buy = 1, sell = 1, used = 0;
    for (const ind of inds) {
      const level = (levels && levels[ind]) || 'normal';
      const p = strengthT(ticker, ind, level);
      if (p === null) continue;
      const q = Math.max(P_FLOOR, Math.min(1 - P_FLOOR, p));
      const w = LEVEL_WEIGHT[level] || 1;
      buy *= Math.pow(q, w); sell *= Math.pow(1 - q, w); used++;
    }
    return used ? { t: buy / (buy + sell), used } : null;
  }

  function colormapT(ticker) {
    const joint = jointT(ticker, [...activeIndicators], indicatorLevels);
    return joint ? joint.t : null;
  }

  // Compute all inline color values for one card
  function cardPalette(t) {
    if (t === null) return null;
    const [r, g, b] = rdylgn(t);
    const rgb = `rgb(${r},${g},${b})`;
    return {
      bg:     `linear-gradient(135deg, color-mix(in srgb, ${rgb} 28%, var(--bg)) 0%, color-mix(in srgb, ${rgb} 15%, var(--bg)) 100%)`,
      border: `rgba(${r},${g},${b},0.42)`,
      fg:     `color-mix(in srgb, ${rgb} 75%, var(--text))`,
      fgDim:  `rgba(${r},${g},${b},0.55)`,
      fill:   `rgb(${r},${g},${b})`,
    };
  }

  // ── Legend gradient bar (canvas, left=green buy, right=red sell) ────────────
  function paintLegend() {
    const canvas = document.getElementById('legend-bar');
    const ctx    = canvas.getContext('2d');
    const W      = canvas.offsetWidth || 340;
    canvas.width = W * devicePixelRatio;
    canvas.height = 8 * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    // left=green (t=1), right=red (t=0) — reverse the stops
    for (let i = 0; i <= 10; i++) {
      const [r, g, b] = RDYLGN[10 - i];
      grad.addColorStop(i / 10, `rgb(${r},${g},${b})`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(0, 0, W, 8, 4);
    ctx.fill();

    // Labels and ticks
    if (activeIndicators.size > 1) {
      document.getElementById('legend-ticks').innerHTML =
        '<span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Joint buy probability high';
      document.getElementById('legend-lbl-mid').textContent  = 'Even';
      document.getElementById('legend-lbl-sell').textContent = 'Joint buy probability low';
    } else if (activeIndicator() === 'rsi') {
      document.getElementById('legend-ticks').innerHTML =
        `<span>0</span><span>${settings.rsi.buy}</span><span>50</span><span>${settings.rsi.sell}</span><span>100</span>`;
      document.getElementById('legend-lbl-buy').textContent  = 'Oversold (buy)';
      document.getElementById('legend-lbl-mid').textContent  = 'Neutral';
      document.getElementById('legend-lbl-sell').textContent = 'Overbought (sell)';
    } else if (activeIndicator() === 'vwap') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>−30%</span><span>−15%</span><span>0%</span><span>+15%</span><span>+30%</span>';
      document.getElementById('legend-lbl-buy').textContent  = `Below VWAP ${settings.vwap.window} (buy)`;
      document.getElementById('legend-lbl-mid').textContent  = 'At VWAP';
      document.getElementById('legend-lbl-sell').textContent = 'Above VWAP (sell)';
    } else if (activeIndicator() === 'fund') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>Strong</span><span></span><span>Mixed</span><span></span><span>Weak</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Fundamentals favour a buy';
      document.getElementById('legend-lbl-mid').textContent  = 'Mixed';
      document.getElementById('legend-lbl-sell').textContent = 'Fundamentals favour a sell';
    } else {
      document.getElementById('legend-ticks').innerHTML =
        '<span>Bullish</span><span></span><span>Mixed</span><span></span><span>Bearish</span>';
      document.getElementById('legend-lbl-buy').textContent  = `${settings.trend.short}-day above ${settings.trend.long}-day`;
      document.getElementById('legend-lbl-mid').textContent  = 'Mixed';
      document.getElementById('legend-lbl-sell').textContent = `${settings.trend.short}-day below ${settings.trend.long}-day`;
    }
  }

  // ── State ───────────────────────────────────────────────────────────────────
  let allTickers    = [];
  let activeIndicators = new Set(['rsi']);
  let indicatorLevels  = {};   // indicator -> 'weak' | 'normal' | 'strong' (absent means normal)
  const activeIndicator = () => [...activeIndicators][0];
  let activeClasses   = new Set(['all']);
  let allClasses      = [];
  let csrfToken       = '';
  let detailRecord    = null;
  // One chart range for every card: changing it on one chart changes all of them, and it is
  // remembered in this browser.
  const RANGES = ['1m', '3m', '1y', '3y', '5y'];
  const RANGE_KEY = 'tradility-detail-range';
  let detailRange = (() => {
    try { const v = localStorage.getItem(RANGE_KEY); if (RANGES.includes(v)) return v; } catch (e) {}
    return '5y';
  })();
  let detailTrigger   = null;
  let detailTicker    = null;
  let targetsData     = null;   // To Invest targets and current allocations, by ticker
  let tradeStatus     = null;   // {available, enabled, tickers, per_order_usd, ...} from the trader service
  let tradeStep       = null;   // the preview or cancel awaiting its typed confirmation
  let detailOrders    = null;   // {position, orders} for the open card, from /api/tradility-orders
  let shownOrder      = [];   // tickers with details, in the order the grid shows them
  let artifactVersion = '';
  let refreshWatch    = null;

  const REFRESH_POLL_INTERVAL_MS = 5000;
  const REFRESH_START_GRACE_MS = 30000;
  const REFRESH_TIMEOUT_MS = 15 * 60 * 1000;

  function delay(ms) {
    return new Promise(resolve => window.setTimeout(resolve, ms));
  }

  function formatElapsed(milliseconds) {
    const seconds = Math.max(0, Math.floor(milliseconds / 1000));
    const minutes = Math.floor(seconds / 60);
    return `${minutes}:${String(seconds % 60).padStart(2, '0')}`;
  }

  function setRefreshControl(running, label = 'Update market data') {
    const btn = document.getElementById('refresh-btn');
    document.getElementById('refresh-label').textContent = label;
    btn.disabled = running;
    btn.classList.toggle('spinning', running);
  }

  function applyAnalysisData(data) {
    csrfToken = data.csrf_token || csrfToken;
    artifactVersion = data.artifact_version || '';
    allTickers = data.tickers || [];
    if (data.generated_at) {
      const d = new Date(data.generated_at);
      const meta = document.getElementById('meta-generated');
      const stale = Boolean(data.freshness && data.freshness.stale);
      meta.textContent = `${stale ? '⚠ Stale — ' : ''}Updated ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
      meta.classList.toggle('stale', stale);
    }
    const classSet = new Set();
    for (const t of allTickers) if (t.asset_class) classSet.add(t.asset_class);
    allClasses = [...classSet].sort();
    buildClassFilters();
    renderGrid();
  }

  // ── Data load ────────────────────────────────────────────────────────────────
  // ── To Invest targets ────────────────────────────────────────────────────────
  async function loadTargets() {
    try {
      const res = await fetch('/api/tradility-targets', {cache: 'no-store'});
      const data = await res.json();
      if (res.ok && data.ok) targetsData = data;
    } catch (err) {
      /* targets are an extra; the cards work without them */
    }
  }

  function targetFor(ticker) {
    return (targetsData && targetsData.targets && targetsData.targets[ticker]) || null;
  }

  // How far below its To Invest target a holding is, in percentage points (negative: above it).
  function targetGap(ticker) {
    const r = targetFor(ticker);
    return r && r.target != null ? r.target - (r.current || 0) : null;
  }

  function pctPlain(v) {
    return v == null ? '—' : Number(v).toFixed(2) + '%';
  }

  // A horizontal share bar. `now` is the fill, `after` (optional) adds a lighter segment for an order's
  // change (hatched when it shrinks the holding), and `target` is an ink tick. With a target the scale puts
  // the tick at 75% of the width, so bars are comparable as "progress to target"; `max` overrides that
  // (used where bars sit side by side in one table). Text and a tooltip carry the exact numbers.
  function shareBar(now, after, target, {max = null, big = false} = {}) {
    const hasAfter = after != null && Math.abs(after - now) > 1e-9;
    const top = Math.max(now || 0, after == null ? 0 : after, target || 0);
    const scale = max || (target ? Math.max(target / 0.75, top * 1.05) : Math.max(top * 1.2, 0.01));
    const w = v => Math.max(0, Math.min(100, (v || 0) / scale * 100));
    const lo = Math.min(now || 0, hasAfter ? after : now || 0), hi = Math.max(now || 0, hasAfter ? after : now || 0);
    const label = `Now ${pctPlain(now)}${hasAfter ? `, after ${pctPlain(after)}` : ''}${target != null ? `, target ${pctPlain(target)}` : ''}`;
    return `<span class="sbar${big ? ' sbar-big' : ''}" role="img" aria-label="${esc(label)}" title="${esc(label)}"><span class="sbar-track">
      <span class="sbar-now" style="width:${w(hasAfter && after < now ? after : now).toFixed(2)}%"></span>
      ${hasAfter ? `<span class="sbar-move ${after > now ? 'up' : 'down'}" style="left:${w(lo).toFixed(2)}%;width:${(w(hi) - w(lo)).toFixed(2)}%"></span>` : ''}
      ${target != null ? `<span class="sbar-target" style="left:calc(${w(target).toFixed(2)}% - 1px)"></span>` : ''}
    </span></span>`;
  }

  function barLegend(withMove) {
    return `<div class="sbar-legend"><span><i class="k-now"></i>now</span>${withMove ? '<span><i class="k-up"></i>change from open orders</span>' : ''}<span><i class="k-target"></i>To Invest target</span></div>`;
  }

  function targetChip(ticker) {
    const r = targetFor(ticker);
    if (!r || r.target == null) return '';
    const gap = targetGap(ticker);
    const kind = gap > 0.05 ? 'under' : gap < -0.05 ? 'over' : 'on';
    const now = r.current == null ? 'not held' : `now ${pctPlain(r.current)}`;
    return `<div class="card-target ${kind}" title="To Invest: ${esc(r.category)}">Target ${pctPlain(r.target)} · ${now}${shareBar(r.current || 0, null, r.target)}</div>`;
  }

  async function loadData({followActiveRefresh = true} = {}) {
    let data = null;
    try {
      const res  = await fetch('/api/tradility-analysis', {cache: 'no-store'});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      await loadTargets();
      applyAnalysisData(data);
      if (followActiveRefresh && data.refresh && data.refresh.active) {
        void watchRefresh(artifactVersion, true);
      }
    } catch (err) {
      document.getElementById('grid-container').innerHTML =
        `<div class="error-card">⚠ Could not load analysis: ${esc(err.message)}</div>`;
    }
    return data;
  }

  async function runRefresh() {
    if (refreshWatch) return refreshWatch;
    setRefreshControl(true, 'Starting update…');
    try {
      if (!csrfToken) {
        const loaded = await loadData({followActiveRefresh: false});
        if (!loaded || !csrfToken) throw new Error('Could not load refresh credentials');
      }
      const baselineVersion = artifactVersion;
      const res = await fetch('/api/tradility-refresh', {
        method: 'POST',
        headers: {'X-CSRF-Token': csrfToken},
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return watchRefresh(baselineVersion, false);
    } catch (err) {
      showRefreshError(err);
      setRefreshControl(false);
      return null;
    }
  }

  function watchRefresh(baselineVersion, alreadyActive) {
    if (refreshWatch) return refreshWatch;
    refreshWatch = monitorRefresh(baselineVersion, alreadyActive)
      .catch(showRefreshError)
      .finally(() => {
        refreshWatch = null;
        setRefreshControl(false);
      });
    return refreshWatch;
  }

  async function monitorRefresh(baselineVersion, alreadyActive) {
    const startedAt = Date.now();
    let seenActive = alreadyActive;
    let consecutiveErrors = 0;
    while (Date.now() - startedAt < REFRESH_TIMEOUT_MS) {
      const elapsed = Date.now() - startedAt;
      setRefreshControl(true, `Updating… ${formatElapsed(elapsed)}`);
      const meta = document.getElementById('meta-generated');
      meta.textContent = `Updating market data… ${formatElapsed(elapsed)}`;
      meta.classList.remove('stale');

      let status;
      try {
        const res = await fetch('/api/tradility-refresh/status', {cache: 'no-store'});
        status = await res.json();
        if (!res.ok || !status.ok) throw new Error(status.error || `HTTP ${res.status}`);
        consecutiveErrors = 0;
      } catch (err) {
        consecutiveErrors += 1;
        if (consecutiveErrors >= 3) throw err;
        await delay(REFRESH_POLL_INTERVAL_MS);
        continue;
      }

      const active = Boolean(status.refresh && status.refresh.active);
      seenActive = seenActive || active;
      if (status.artifact_version && status.artifact_version !== baselineVersion) {
        const loaded = await loadData({followActiveRefresh: false});
        if (!loaded) throw new Error('New market data was written but could not be loaded');
        return;
      }
      if (!active && seenActive) {
        throw new Error('Update finished, but no new market-data artifact was written');
      }
      if (!active && !seenActive && elapsed >= REFRESH_START_GRACE_MS) {
        throw new Error('The market-data update did not start');
      }
      await delay(REFRESH_POLL_INTERVAL_MS);
    }
    throw new Error('Market-data update timed out after 15 minutes');
  }

  function showRefreshError(err) {
    const meta = document.getElementById('meta-generated');
    meta.textContent = `Update failed: ${err.message}`;
    meta.classList.add('stale');
  }

  // ── Indicator switch ─────────────────────────────────────────────────────────
  // A button cycles off → weak → normal → strong → off. At least one indicator stays on, so the
  // last one skips "off".
  const LEVEL_TAG = { weak: 'weak', normal: '', strong: 'strong' };
  function nextIndicatorState(ind) {
    if (!activeIndicators.has(ind)) return 'weak';
    const level = indicatorLevels[ind] || 'normal';
    if (level === 'strong') return activeIndicators.size === 1 ? 'weak' : 'off';
    return LEVELS[LEVELS.indexOf(level) + 1];
  }
  function paintIndicatorButtons() {
    document.querySelectorAll('.ind-btn').forEach(b => {
      const ind = b.dataset.ind;
      const on = activeIndicators.has(ind);
      const level = on ? (indicatorLevels[ind] || 'normal') : '';
      b.classList.toggle('active', on);
      b.classList.toggle('lvl-weak', level === 'weak');
      b.classList.toggle('lvl-strong', level === 'strong');
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('.ind-tag').textContent = on ? LEVEL_TAG[level] : '';
      b.querySelector('.ind-name').textContent = indName(ind);
      b.setAttribute('aria-label', `${indName(ind)}: ${on ? level : 'off'}. Click to change strength.`);
    });
  }
  function toggleIndicator(ind) {
    const next = nextIndicatorState(ind);
    if (next === 'off') {
      activeIndicators.delete(ind);
      delete indicatorLevels[ind];
    } else {
      activeIndicators.add(ind);
      indicatorLevels[ind] = next;
    }
    paintIndicatorButtons();
    paintLegend();
    renderGrid();
  }

  // ── Class filter ──────────────────────────────────────────────────────────────
  function buildClassFilters() {
    const container = document.getElementById('class-filters');
    container.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'filter-btn active';
    all.textContent = 'All';
    all.onclick = () => toggleClass('all');
    container.appendChild(all);
    for (const cls of allClasses) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cls;
      btn.dataset.cls = cls;
      btn.onclick = () => toggleClass(cls);
      container.appendChild(btn);
    }
  }

  function toggleClass(cls) {
    if (cls === 'all') {
      activeClasses = new Set(['all']);
    } else {
      activeClasses.delete('all');
      activeClasses.has(cls) ? activeClasses.delete(cls) : activeClasses.add(cls);
      if (activeClasses.size === 0) activeClasses.add('all');
    }
    document.querySelectorAll('.filter-btn').forEach(b => {
      const isAll = !b.dataset.cls;
      b.classList.toggle('active',
        (isAll && activeClasses.has('all')) || (b.dataset.cls && activeClasses.has(b.dataset.cls)));
    });
    renderGrid();
  }

  // The label, value and detail line one indicator shows on a card. `note` is its own read when
  // several indicators are combined.
  function indicatorBlock(t, ind, pal, many) {
    const col = pal ? `color:${pal.fg}` : '';
    const level = indicatorLevels[ind] || 'normal';
    const own = strengthT(t, ind, level);
    const note = many && own !== null
      ? `${Math.round(own * 100)}% buy${level === 'normal' ? '' : ' · ' + level}` : '';
    if (ind === 'rsi') {
      const rsiV = rsiValue(t);
      const value = rsiV != null ? rsiV.toFixed(1) : '—';
      let extra = '';
      if (rsiV != null && !many) {
        const pct  = Math.min(100, Math.max(0, rsiV));
        const fill = pal ? `background:${pal.fill}` : '';
        extra = `<div class="rsi-bar-wrap"><div class="rsi-bar-fill" style="width:${pct}%;${fill}"></div></div>`;
      }
      return { label: indName('rsi'), value, extra, note };
    }
    if (ind === 'vwap') {
      let extra = '';
      const v = vwapValue(t);
      if (t.last_price != null && v != null && v !== 0) {
        const delta = (t.last_price - v) / v * 100;
        extra = `<div class="vwap-delta" style="${col}">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}% vs VWAP</div>`;
      }
      return { label: indName('vwap'), value: v != null ? fmtPrice(v) : '—', extra, note };
    }
    if (ind === 'fund') {
      const read = fundRead(t);
      const value = read ? ratingLabel(fundRating(read)) : '—';
      const extra = read ? `<div class="vwap-delta" style="${col}">${read.n} rules · score ${read.score >= 0 ? '+' : ''}${read.score}</div>` : '';
      return { label: 'Fundamentals', value, extra, note };
    }
    let extra = '';
    const a = variant(t, 'sma', settings.trend.short), b = variant(t, 'sma', settings.trend.long);
    if (a != null && b) {
      const spread = (a - b) / b * 100;
      extra = `<div class="vwap-delta" style="${col}">${spread >= 0 ? '+' : ''}${spread.toFixed(2)}% ${settings.trend.short}/${settings.trend.long} spread</div>`;
    }
    const value = a != null && b ? `${fmtPrice(a)} / ${fmtPrice(b)}` : '—';
    return { label: `SMA ${settings.trend.short} / ${settings.trend.long}`, value, extra, note };
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderGrid() {
    const query = document.getElementById('search-input').value.trim().toUpperCase();
    const sort  = document.getElementById('sort-select').value;

    let tickers = allTickers.filter(t => {
      if (query && !t.ticker.includes(query) && !(t.name || '').toUpperCase().includes(query))
        return false;
      if (!activeClasses.has('all') && !activeClasses.has(t.asset_class))
        return false;
      return true;
    });

    // Attach computed t value for sorting/stats
    tickers = tickers.map(t => ({ ...t, _t: colormapT(t) }));

    tickers.sort((a, b) => {
      if (sort === 'ticker')      return a.ticker.localeCompare(b.ticker);
      if (sort === 'price-desc')  return (b.last_price ?? 0) - (a.last_price ?? 0);
      if (sort === 'target-gap') {
        const ga = targetGap(a.ticker), gb = targetGap(b.ticker);   // largest shortfall first; no target last
        if (ga === null || gb === null) return (ga === null) - (gb === null) || a.ticker.localeCompare(b.ticker);
        return gb - ga || a.ticker.localeCompare(b.ticker);
      }
      if (sort === 'value-desc')  return (a._t ?? -1) - (b._t ?? -1); // low t (sell) first
      // value-asc: high t (buy/green) first; nulls last
      const at = a._t ?? -1, bt = b._t ?? -1;
      return bt !== at ? bt - at : a.ticker.localeCompare(b.ticker);
    });

    shownOrder = tickers.filter(t => t.detail_available).map(t => t.ticker);
    if (detailTicker) paintDetailSteps();

    // Stats: bucket by approximate signal for count display
    let buyN = 0, sellN = 0, neutralN = 0, noDataN = 0;
    for (const t of tickers) {
      if (t._t === null) { noDataN++; continue; }
      if (t._t > 0.6)       buyN++;
      else if (t._t < 0.4)  sellN++;
      else                   neutralN++;
    }
    const [buyR, buyG, buyB]    = rdylgn(0.85);
    const [sellR, sellG, sellB] = rdylgn(0.10);
    const [midR, midG, midB]    = rdylgn(0.50);
    const onlyTrend = activeIndicators.size === 1 && activeIndicator() === 'trend';
    const positiveLabel = onlyTrend ? 'bullish' : 'buy';
    const negativeLabel = onlyTrend ? 'bearish' : 'sell';
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><strong>${tickers.length}</strong> shown</div>
      <div class="stat"><strong style="color:rgb(${buyR},${buyG},${buyB})">${buyN}</strong> ${positiveLabel}</div>
      <div class="stat"><strong style="color:rgb(${sellR},${sellG},${sellB})">${sellN}</strong> ${negativeLabel}</div>
      <div class="stat"><strong style="color:rgb(${midR},${midG},${midB})">${neutralN}</strong> neutral</div>
      ${noDataN ? `<div class="stat"><strong style="color:var(--muted-fg)">${noDataN}</strong> no data</div>` : ''}
    `;

    if (!tickers.length) {
      document.getElementById('grid-container').innerHTML =
        '<div class="state-msg">No tickers match.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'ticker-grid';

    for (const t of tickers) {
      const pal   = cardPalette(t._t);
      const card  = document.createElement('button');
      card.type = 'button';
      card.dataset.ticker = t.ticker;
      card.className = 'ticker-card' + (pal ? '' : ' no-data');
      card.disabled = !t.detail_available;
      if (t.detail_available) {
        card.title = `Open ${t.ticker} historical performance`;
        card.addEventListener('click', () => openTickerDetail(t.ticker, card));
      }

      if (pal) {
        card.style.background   = pal.bg;
        card.style.borderColor  = pal.border;
      }

      const price = t.last_price != null ? fmtPrice(t.last_price) : '—';

      const joint = jointT(t, [...activeIndicators], indicatorLevels);
      const many = activeIndicators.size > 1;
      const blocks = [...activeIndicators].map(ind => indicatorBlock(t, ind, pal, many));
      const indLabel = many ? 'Joint buy probability' : blocks[0].label;
      const indValue = many
        ? (joint ? `${Math.round(joint.t * 100)}%` : '—')
        : blocks[0].value;
      const extraHtml = many
        ? blocks.map(x => `<div class="vwap-delta ind-row"><span>${x.label}</span><span>${x.value}${x.note ? ' · ' + x.note : ''}</span></div>`).join('')
          + (joint && joint.used < activeIndicators.size
            ? `<div class="vwap-delta">${joint.used} of ${activeIndicators.size} signals available</div>` : '')
        : blocks[0].extra;

      // Badge label
      let badge = '—';
      if (t._t !== null) {
        if (many) {
          badge = t._t > 0.6 ? 'Buy' : t._t < 0.4 ? 'Sell' : 'Neutral';
        } else if (activeIndicator() === 'rsi') {
          const rv = rsiValue(t);
          badge = rv <= settings.rsi.buy ? 'Oversold' : rv >= settings.rsi.sell ? 'Overbought' : 'Neutral';
        } else if (activeIndicator() === 'vwap') {
          badge = t._t > 0.55 ? 'Below' : t._t < 0.45 ? 'Above' : 'At VWAP';
        } else if (activeIndicator() === 'fund') {
          badge = t._t > 0.6 ? 'Strong' : t._t < 0.4 ? 'Weak' : 'Mixed';
        } else {
          const tr = trendRead(t);
          badge = tr === 'bullish' ? 'Bullish' : tr === 'bearish' ? 'Bearish' : 'Mixed';
        }
      } else {
        badge = t.fetch_status === 'error' ? 'No data' : '—';
      }

      const badgeBg  = pal ? `background:${pal.fgDim};border-color:${pal.border}` : '';
      const badgeFg  = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const tickFg   = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const indValFg = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';

      card.innerHTML = `
        <div class="signal-badge" style="${badgeBg};${badgeFg}">${badge}</div>
        <div class="card-ticker" style="${tickFg}">${esc(t.ticker)}</div>
        <div class="card-asset">${esc(t.asset_class || '')}${t.name ? ' · ' + esc(t.name) : ''}</div>
        <div class="card-price">${price}</div>
        ${targetChip(t.ticker)}
        <div class="card-indicator">
          <span class="card-ind-label">${indLabel}</span>
          <span class="card-ind-value" style="${indValFg}">${indValue}</span>
        </div>
        ${extraHtml}
        ${t.detail_available ? '<div class="card-detail-cue">View chart, profile, and rating →</div>' : ''}
      `;
      grid.appendChild(card);
    }

    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    container.appendChild(grid);
  }

  // ── Historical-performance detail ───────────────────────────────────────────
  // The detail view fills the window under the top bar; its top edge follows the bar's height (which
  // changes with the width), so the bar and its theme controls stay usable.
  function placeDetailOverlay() {
    const nav = document.querySelector('.cw-site-nav');
    const top = nav ? Math.max(0, Math.round(nav.getBoundingClientRect().bottom)) : 0;
    document.getElementById('detail-overlay').style.setProperty('--detail-top', top + 'px');
  }
  window.addEventListener('resize', placeDetailOverlay);

  // The detail in its own, resizable browser window. It is the same page in "popout" mode, so the top bar
  // is there and follows the theme: the choice lives in localStorage, which windows of this site share.
  const IS_POPOUT = new URLSearchParams(window.location.search).get('window') === '1';
  if (IS_POPOUT) document.body.classList.add('popout');

  function popOutDetail() {
    if (!detailTicker) return;
    const url = `${window.location.pathname}?ticker=${encodeURIComponent(detailTicker)}&window=1`;
    const opened = window.open(url, `tradility-${detailTicker}`, 'popup=yes,width=1240,height=900,resizable=yes,scrollbars=yes');
    if (opened) closeTickerDetail();
  }

  function paintDetailSteps() {
    const at = shownOrder.indexOf(detailTicker);
    document.getElementById('detail-prev').disabled = at <= 0;
    document.getElementById('detail-next').disabled = at < 0 || at >= shownOrder.length - 1;
    document.getElementById('detail-pos').textContent = at < 0 ? '' : `${at + 1} / ${shownOrder.length}`;
  }

  // Open the previous (-1) or next (+1) card in the order the grid is showing.
  function stepTickerDetail(delta) {
    const at = shownOrder.indexOf(detailTicker);
    const next = shownOrder[at + delta];
    if (at < 0 || !next) return;
    const card = [...document.querySelectorAll('.ticker-card')].find(c => c.dataset.ticker === next);
    openTickerDetail(next, card || detailTrigger, delta < 0 ? 'detail-prev' : 'detail-next');
  }

  async function openTickerDetail(ticker, trigger, keepFocus) {
    detailTrigger = trigger || null;
    detailTicker = ticker;
    paintDetailSteps();
    detailRecord = null;
    detailOrders = null;
    tradeStep = null;
    tradeQuote = null;
    heldData = null;
    const overlay = document.getElementById('detail-overlay');
    placeDetailOverlay();
    overlay.hidden = false;
    document.body.classList.add('detail-open');
    document.getElementById('detail-dialog-title').textContent = ticker;
    document.getElementById('detail-dialog-name').textContent = '';
    document.getElementById('detail-dialog-price').textContent = '';
    document.getElementById('detail-content').innerHTML =
      '<div class="detail-loading">Loading company and market details…</div>';
    const keep = keepFocus && document.getElementById(keepFocus);
    (keep && !keep.disabled ? keep : overlay.querySelector('.detail-close')).focus();

    try {
      const res = await fetch(`/api/tradility-analysis/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker) return;   // stepped on to another card while this one loaded
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailRecord = data.ticker;
      renderTickerDetail(data);
      loadOrders(ticker);
      bindTargetForm();
    } catch (err) {
      if (detailTicker !== ticker) return;
      document.getElementById('detail-content').innerHTML =
        `<div class="error-card">Could not load ${esc(ticker)} details: ${esc(err.message)}</div>`;
    }
  }

  function closeTickerDetail() {
    if (IS_POPOUT) { window.close(); return; }
    document.getElementById('detail-overlay').hidden = true;
    document.body.classList.remove('detail-open');
    detailRecord = null;
    detailOrders = null;
    detailTicker = null;
    if (detailTrigger) detailTrigger.focus();
    detailTrigger = null;
  }

  function ratingLabel(value) {
    return String(value || 'unknown').split('_').map(part =>
      part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
  }

  function ratingClass(value) {
    if (value === 'buy' || value === 'strong_buy') return 'rating-positive';
    if (value === 'sell' || value === 'strong_sell') return 'rating-negative';
    return 'rating-neutral';
  }

  function formatReturn(value) {
    if (value == null || !Number.isFinite(Number(value))) return '—';
    const number = Number(value);
    return `${number >= 0 ? '+' : ''}${number.toFixed(2)}%`;
  }

  function formatChartDate(value) {
    return value.toLocaleDateString(undefined, {timeZone: 'UTC'});
  }

  function returnClass(value) {
    if (value == null || Number(value) === 0) return '';
    return Number(value) > 0 ? 'rating-positive' : 'rating-negative';
  }

  function safeExternalUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '';
    } catch (_error) {
      return '';
    }
  }

  function formatEmployees(value) {
    if (value == null || value === '') return '—';
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? Math.round(number).toLocaleString() : '—';
  }

  function formatProfileTime(value) {
    if (!value) return '—';
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? '—' : parsed.toLocaleDateString();
  }

  // The symbol's Yahoo Finance quote page; empty when there is no symbol.
  function yahooUrl(ticker) {
    return ticker ? `https://finance.yahoo.com/quote/${encodeURIComponent(ticker)}/` : '';
  }

  function renderTickerDetail(data) {
    const t = data.ticker;
    const returns = t.returns || {};
    const components = t.technical_components || {};
    const profile = t.company_profile || {};
    const companyName = profile.canonical_name || t.name || '';
    const website = safeExternalUrl(profile.website);
    const industry = profile.industry || profile.category || '—';
    const sector = profile.sector || profile.fund_family || '—';
    const vision = profile.vision_statement
      ? esc(profile.vision_statement)
      : 'Not supplied by the current source';
    const position = Math.min(100, Math.max(0, Number(t.range_position_52w ?? 0)));
    const returnLabels = [['1m','1M'], ['3m','3M'], ['1y','1Y'], ['3y','3Y'], ['5y','5Y']];
    document.getElementById('detail-dialog-title').textContent = t.ticker || 'Stock details';
    document.getElementById('detail-dialog-name').textContent =
      [companyName, t.asset_class].filter(Boolean).join(' · ');
    document.getElementById('detail-dialog-price').textContent = fmtPrice(t.last_price);

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-layout">
        <div class="detail-stack">
          <section class="detail-card">
            <div class="detail-card-title">Company overview</div>
            ${profile.available ? `
              <p class="company-description">${esc(profile.description || 'No business description was supplied by this source.')}</p>
              <div class="company-facts">
                <div class="company-fact"><span>Sector / family</span><strong>${esc(sector)}</strong></div>
                <div class="company-fact"><span>Industry / category</span><strong>${esc(industry)}</strong></div>
                <div class="company-fact"><span>Headquarters</span><strong>${esc(profile.headquarters || '—')}</strong></div>
                <div class="company-fact"><span>Exchange</span><strong>${esc(profile.exchange || '—')}</strong></div>
                <div class="company-fact"><span>Employees</span><strong>${formatEmployees(profile.employees)}</strong></div>
                <div class="company-fact"><span>Entity type</span><strong>${esc(profile.entity_type || '—')}</strong></div>
                <div class="company-fact"><span>Official mission / vision</span><strong>${vision}</strong></div>
                <div class="company-fact"><span>Profile source</span><strong>${esc(profile.source || 'unknown')} · ${formatProfileTime(profile.retrieved_at)}</strong></div>
              </div>
            ` : `
              <p class="company-description">No qualitative profile is available for this symbol yet. Run a refresh to populate newly supported equities and funds.</p>
            `}
            <div class="company-links">
              ${website ? `<a class="company-link" href="${esc(website)}" target="_blank" rel="noopener noreferrer">Company website ↗</a>` : ''}

              ).join('')}

              </div>`).join('')}

        <div class="detail-stack">

            <div class="detail-card-title">Technical market rating</div>
            <div class="detail-rating">

            </div>

              <div class="detail-meta-row"><span>Coverage</span><strong>${esc(t.period_start || '—')} → ${esc(t.period_end || '—')}</strong></div>
              <div class="detail-meta-row"><span>Generated</span><strong>${data.generated_at ? new Date(data.generated_at).toLocaleString() : '—'}</strong></div>
