          </section>
        </div>
      </div>`;
    requestAnimationFrame(drawDetailChart);
  }

  // Schwab fundamentals: the figures, and for companies the rules that read them as buy or sell.
  const FUND_LABELS = [
    ['pe', 'P/E', 'x'], ['peg', 'PEG', 'x'], ['pb', 'Price / book', 'x'], ['roe', 'Return on equity', '%'],
    ['net_margin', 'Net margin', '%'], ['gross_margin', 'Gross margin', '%'],
    ['rev_growth', 'Revenue growth (year)', '%'], ['eps_growth', 'EPS growth (TTM)', '%'],
    ['debt_to_equity', 'Debt / equity', '%'], ['current_ratio', 'Current ratio', 'x'],
    ['interest_coverage', 'Interest coverage', 'x'], ['dividend_yield', 'Dividend yield', '%'],
    ['short_float', 'Short interest / float', '%'], ['beta', 'Beta', ''],
    ['market_cap', 'Market cap', '$'], ['eps_ttm', 'EPS (TTM)', '$'],
  ];
  function fundNumber(value, unit) {
    const n = Number(value);
    if (!Number.isFinite(n)) return '—';
    if (unit === '$' && Math.abs(n) >= 1e6) {
      const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M']];
      const [div, suffix] = units.find(([d]) => Math.abs(n) >= d);
      return '$' + (n / div).toFixed(2) + suffix;
    }
    const text = Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(2);
    return unit === '$' ? '$' + text : unit === '%' ? text + '%' : unit === 'x' ? text + 'x' : text;
  }
  function fundamentalsCardHtml(t) {
    const f = t.fundamentals;
    if (!f || !Object.keys(f).length) return '';
    const read = t.fundamental_signals || [];
    const rating = t.fundamental_rating;
    const head = read.length && rating !== 'unavailable' ? `
      <div class="detail-rating">
        <span class="detail-rating-label ${ratingClass(rating)}">${esc(ratingLabel(rating))}</span>
        <strong>${t.fundamental_score >= 0 ? '+' : ''}${t.fundamental_score} / ${t.fundamental_signal_count}</strong>
      </div>` : '';
    const signals = read.map(r => `<div class="component-row" title="${esc(r.rule)}"><span>${esc(r.label)}</span><strong class="${r.signal === 'buy' ? 'rating-positive' : r.signal === 'sell' ? 'rating-negative' : 'rating-neutral'}">${fundNumber(r.value, (FUND_LABELS.find(x => x[0] === r.key) || [])[2] || '')} · ${esc(r.signal)}</strong></div>`).join('');
    const shown = new Set(read.map(r => r.key));
    const others = FUND_LABELS.filter(([k]) => f[k] != null && !shown.has(k))
      .map(([k, label, unit]) => `<div class="detail-meta-row"><span>${esc(label)}</span><strong>${fundNumber(f[k], unit)}</strong></div>`).join('');
    const note = read.length ? '' : '<p class="detail-disclaimer">Funds report aggregates that do not read the same way, so no buy or sell rules are applied.</p>';
    return `
      <section class="detail-card" id="detail-fundamentals-card">
        <div class="detail-card-title">Fundamentals · Schwab</div>
        ${head}
        <div class="component-list">${signals}${others}</div>
        ${note}
        <p class="detail-disclaimer">Rule-based reads of Schwab's reported figures (hover a row for its threshold)—a separate view from the technical rating, not analyst consensus or investment advice.</p>
      </section>`;
  }

  function setDetailRange(range) {
    if (!RANGES.includes(range)) return;
    detailRange = range;
    try { localStorage.setItem(RANGE_KEY, range); } catch (e) {}
    document.querySelectorAll('.detail-range-btn').forEach(button =>
      button.classList.toggle('active', button.dataset.range === range));
    drawDetailChart();
  }

  function detailPointsForRange() {
    const points = (detailRecord && detailRecord.price_history || [])
      .filter(point => point && point.date && Number.isFinite(Number(point.close)))
      .map(point => ({date: new Date(`${point.date}T00:00:00Z`), close: Number(point.close)}));
    if (!points.length || detailRange === '5y') return points;
    const end = new Date(points[points.length - 1].date);
    const start = new Date(end);
    if (detailRange === '1m') start.setUTCMonth(start.getUTCMonth() - 1);
    if (detailRange === '3m') start.setUTCMonth(start.getUTCMonth() - 3);
    if (detailRange === '1y') start.setUTCFullYear(start.getUTCFullYear() - 1);
    if (detailRange === '3y') start.setUTCFullYear(start.getUTCFullYear() - 3);
    return points.filter(point => point.date >= start);
  }

  // ── Position and orders ──────────────────────────────────────────────────────
  async function loadOrders(ticker) {
    try {
      const res = await fetch(`/api/tradility-orders/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker) return;
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailOrders = data;
    } catch (err) {
      if (detailTicker !== ticker) return;
      detailOrders = null;
      const box = document.getElementById('detail-orders');
      if (box) box.innerHTML = `<div class="error-card">Could not load orders: ${esc(err.message)}</div>`;
      return;
    }
    refreshTargetCard();
    await loadTradeStatus();
    // so the account list can show what each account can spend, and a buy can be checked before previewing
    if (tradeStatus && tradeStatus.available) loadHeld();
    if (tradeStatus && tradeStatus.enabled && !accountsData) await loadAccounts();
    renderOrders();
    drawDetailChart();
  }

  async function loadTradeStatus() {
    try {
      const res = await fetch('/api/tradility-trade/status');
      tradeStatus = await res.json();
    } catch (err) {
      tradeStatus = {available: false, enabled: false};
    }
  }

  async function sendOrder(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function orderPath(id) {
    return `/api/tradility-orders/${encodeURIComponent(detailTicker)}${id ? '/' + encodeURIComponent(id) : ''}`;
  }

  async function changeOrder(id, change) {
    const order = detailOrders.orders.find(o => o.id === id);
    if (!order) return;
    const next = {side: order.side, kind: order.kind, quantity: order.quantity, price: order.price,
                  status: order.status, date: order.date, note: order.note, ...change};
    await submitOrder(() => sendOrder('PUT', orderPath(id), next));
  }

  async function submitOrder(action) {
    const ticker = detailTicker;
    try {
      const data = await action();
      if (detailTicker !== ticker) return;
      detailOrders = data;
      renderOrders();
      drawDetailChart();
    } catch (err) {
      const box = document.getElementById('order-error');
      if (box) box.textContent = err.message;
    }
  }

  // Where this ticker is held today, per account (needs the trader service).
  let heldData = null;
  function heldBox() {
    return heldData ? holdingsTable(detailTicker, heldData.accounts, heldData.statements) : '';
  }

  async function loadHeld() {
    const ticker = detailTicker;
    try {
      const res = await fetch(`/api/tradility-trade/holdings/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker || !res.ok || !data.ok) return;
      heldData = data;
    } catch (err) {
      return;
    }
    const box = document.getElementById('held-box');
    if (box) box.innerHTML = heldBox();
    if (detailOrders && !tradeStep) renderOrders();   // the 'if this fills' column uses what is held
  }

  function targetCardHtml(ticker, assetClass) {
    const r = targetFor(ticker);
    const cats = (targetsData && targetsData.categories) || [];
    if (!targetsData) return '<div class="orders-sync">To Invest is not available right now.</div>';
    if (!r) {
      const guess = /crypto/i.test(assetClass || '') ? 'Crypto' : /etf|fund/i.test(assetClass || '') ? 'ETFs' : 'Stocks';
      return `<p class="company-description">${esc(ticker)} is not in your To Invest list.</p>
        <form class="target-form" id="target-form" data-add="1" autocomplete="off">
          <select name="category" aria-label="Category">${cats.map(c => `<option ${c === guess ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
          <input name="target_pct" type="number" step="any" min="0" max="100" placeholder="Target % (optional)" aria-label="Target percent">
          <button type="submit">Add to To Invest</button>
        </form><div class="order-error" id="target-error" role="alert"></div>`;
    }
    const gap = targetGap(ticker), room = gap != null && targetsData.portfolio_value ? gap / 100 * targetsData.portfolio_value : null;
    const basket = r.mode === 'basket' && r.basket_pct != null && r.target_input != null
      ? ` <span class="orders-sync">(${esc(String(r.target_input))}% of the ${esc(r.category)} basket, which is ${esc(String(r.basket_pct))}% of the portfolio)</span>` : '';
    const pending = detailOrders ? openOrdersShare() : null;
    return `${r.target != null ? `<div>${shareBar(r.current || 0, pending, r.target, {big: true})}${barLegend(pending != null)}</div>` : ''}
      <div class="orders-summary" style="margin-top:8px">
        <span>Category<strong>${esc(r.category)}</strong></span>
        <span>Target<strong>${pctPlain(r.target)}</strong>${basket}</span>
        <span>Now<strong>${r.current == null ? 'not held' : pctPlain(r.current)}</strong></span>
        <span>${gap == null ? '' : gap > 0.05 ? 'Below target by' : gap < -0.05 ? 'Above target by' : 'At target'}<strong class="${gap > 0.05 ? 'ret-pos' : gap < -0.05 ? 'ret-neg' : ''}">${gap == null || Math.abs(gap) <= 0.05 ? '' : pctPlain(Math.abs(gap))}${room == null || Math.abs(gap) <= 0.05 ? '' : ' ≈ ' + money(Math.abs(room))}</strong></span>
      </div>
      <form class="target-form" id="target-form" autocomplete="off">
        <input name="target_pct" type="number" step="any" min="0" max="100" value="${r.target_input == null ? '' : esc(String(r.target_input))}" aria-label="Target percent" placeholder="Target %">
        <span class="orders-sync">${r.mode === 'basket' ? 'of the ' + esc(r.category) + ' basket' : 'of the portfolio'}</span>
        <button type="submit">Save target</button> <a class="company-link" href="/to-invest">Open To Invest ↗</a>
      </form><div class="order-error" id="target-error" role="alert"></div>`;
  }

  async function saveTarget(form) {
    const f = Object.fromEntries(new FormData(form).entries());
    try {
      const res = await fetch(`/api/tradility-targets/${encodeURIComponent(detailTicker)}`, {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
        body: JSON.stringify({target_pct: f.target_pct || '', category: f.category || ''}),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    } catch (err) {
      document.getElementById('target-error').textContent = err.message;
      return;
    }
    await loadTargets();
    const box = document.getElementById('detail-target');
    if (box) {
      box.innerHTML = targetCardHtml(detailTicker, detailRecord && detailRecord.asset_class);
      bindTargetForm();
    }
    renderGrid();
  }

  // The target bar also shows what the open orders would add, so redraw it once the orders are known.
  function refreshTargetCard() {
    const box = document.getElementById('detail-target');
    if (!box || !targetsData || !detailRecord) return;
    box.innerHTML = targetCardHtml(detailTicker, detailRecord.asset_class);
    bindTargetForm();
  }

  function bindTargetForm() {
    const form = document.getElementById('target-form');
    if (form) form.addEventListener('submit', event => { event.preventDefault(); saveTarget(form); });
  }

  // What an open order does to this holding's share of the portfolio, against its To Invest target.
  // The base is the same one To Invest uses (the holdings export's total), so the numbers agree
  // with the cards. `after` is the share if just this order fills; `delta` is the target minus
  // that, so a positive delta is still short of the target.
  function currentShare() {
    const r = targetFor(detailTicker);
    if (r && r.current != null) return r.current;
    const total = targetsData && targetsData.portfolio_value;
    if (!total || !heldData) return r ? 0 : null;
    const held = (heldData.accounts || []).reduce((a, x) => a + (x.value || 0), 0)
      + (heldData.statements || []).reduce((a, x) => a + (x.market_value || 0), 0);
    return held / total * 100;
  }

  function orderPrice(o) {
    return o.price != null ? o.price : (detailRecord ? detailRecord.last_price : null);
  }

  function orderEffect(o, base) {
    const total = targetsData && targetsData.portfolio_value;
    const price = orderPrice(o);
    const now = base == null ? currentShare() : base;
    if (!total || price == null || now == null) return null;
    const move = (o.side === 'buy' ? 1 : -1) * o.quantity * price / total * 100;
    const r = targetFor(detailTicker);
    const after = Math.max(0, now + move);
    return {after, move, target: r && r.target != null ? r.target : null, delta: r && r.target != null ? r.target - after : null};
  }

  function effectText(e) {
    if (!e) return '—';
    const gap = e.delta == null ? ''
      : Math.abs(e.delta) <= 0.05 ? ' · on target'
      : e.delta > 0 ? ` · ${pctPlain(e.delta)} below target ${pctPlain(e.target)}`
      : ` · ${pctPlain(-e.delta)} above target ${pctPlain(e.target)}`;
    return `→ ${pctPlain(e.after)}${gap}`;
  }

  function effectCell(o) {
    const e = orderEffect(o);
    if (!e) return '—';
    return `<div>${effectText(e)}</div>${shareBar(currentShare(), e.after, e.target)}`;
  }

  // The share after every open order fills, in order, or null.
  function openOrdersShare() {
    const open = detailOrders.orders.filter(o => o.status === 'open');
    let share = currentShare();
    if (!open.length || share == null || !(targetsData && targetsData.portfolio_value)) return null;
    for (const o of open) {
      const e = orderEffect(o, share);
      if (e) share = e.after;
    }
    return share;
  }

  function openOrdersEffect() {
    const open = detailOrders.orders.filter(o => o.status === 'open');
    if (!open.length) return '';
    let share = currentShare();
    if (share == null || !(targetsData && targetsData.portfolio_value)) return '';
    for (const o of open) {
      const e = orderEffect(o, share);
      if (e) share = e.after;
    }
    const r = targetFor(detailTicker);
    const gap = r && r.target != null ? r.target - share : null;
    const text = gap == null ? `${pctPlain(share)} of the portfolio` : `${pctPlain(share)} of the portfolio, ${Math.abs(gap) <= 0.05 ? 'on' : (gap > 0 ? pctPlain(gap) + ' below' : pctPlain(-gap) + ' above')} the ${pctPlain(r.target)} target`;
    return `<div class="orders-sync">If all ${open.length} open order${open.length === 1 ? '' : 's'} fill${open.length === 1 ? 's' : ''}: ${text}.
      ${shareBar(currentShare(), share, r && r.target != null ? r.target : null, {big: true})}${barLegend(true)}</div>`;
  }

  function sourceLabel(source) {
    return {schwab: 'Schwab', binance: 'Binance.US'}[source] || 'Manual';
  }

  // Which brokers the read-only export covers, and when it was last fetched.
  function syncNote() {
    const sync = detailOrders && detailOrders.synced || {};
    const names = Object.keys(sync.sources || {});
    if (!names.length) return 'Broker orders are not synced yet; orders below were entered by hand.';
    const ok = names.filter(n => sync.sources[n]).map(sourceLabel);
    const failed = names.filter(n => !sync.sources[n]).map(sourceLabel);
    const when = sync.generated_at ? new Date(sync.generated_at).toLocaleString() : 'unknown time';
    return `Synced (read-only) from ${ok.join(', ') || 'no broker'} · ${esc(when)}`
      + (failed.length ? ` · not available: ${failed.join(', ')}` : '');
  }

  // ── Placing orders (preview, then a typed confirmation) ─────────────────────
  function canTrade() {
    return !!(tradeStatus && tradeStatus.available && tradeStatus.enabled
              && ((tradeStatus.tickers || []).includes('*') || (tradeStatus.tickers || []).includes(detailTicker)));
  }

  // ── Accounts ─────────────────────────────────────────────────────────────────
  let accountsData = null;

  async function loadAccounts() {
    const body = document.getElementById('accounts-body');
    body.innerHTML = '<div class="state-msg">Loading accounts…</div>';
    try {
      const res = await fetch('/api/tradility-accounts');
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      accountsData = data;
    } catch (err) {
      accountsData = null;
      body.innerHTML = `<div class="error-card">Could not load accounts: ${esc(err.message)}. Account details need the trader service to be running.</div>`;
      return;
    }
    renderAccounts();
  }

  function row(label, value) {
    return value == null ? '' : `<dt>${esc(label)}</dt><dd>${value}</dd>`;
  }

  function renderAccounts() {
    const body = document.getElementById('accounts-body');
    const accounts = (accountsData && accountsData.accounts) || [];
    const sources = (accountsData && accountsData.sources) || {};
    const failed = Object.entries(sources).filter(([, v]) => !v.ok).map(([k, v]) => `${sourceLabel(k)}: ${esc(v.error || 'unavailable')}`);
    const total = accounts.reduce((sum, a) => sum + (a.total_value || 0), 0);
    const statements = (accountsData && accountsData.statements) || [];
    const statementTotal = statements.reduce((sum, i) => sum + (i.total || 0), 0);
    document.getElementById('accounts-total').textContent = accounts.length
      ? `· ${money(total)} live across ${accounts.length}${statements.length ? ` + ${money(statementTotal)} from statements` : ''}` : '';
    body.innerHTML = `<div class="accounts-grid">${accounts.map(a => `
      <div class="account-card">
        <h4><span>${esc(a.label)}</span>
          <span>
            <span class="account-flag">${esc(a.type)}</span>
            ${a.margin_eligible ? '<span class="account-flag">margin eligible</span>' : ''}
            ${a.day_trader ? '<span class="account-flag warn">pattern day trader</span>' : ''}
            ${a.closing_only ? '<span class="account-flag warn">closing only</span>' : ''}
            ${a.in_call ? '<span class="account-flag warn">margin call</span>' : ''}
          </span>
        </h4>
        <dl>
          ${row('Total value', a.total_value == null ? null : money(a.total_value))}
          ${row('Cash', a.cash == null ? null : money(a.cash))}
          ${row('Available for new stock orders', a.spendable == null ? null : money(a.spendable))}
          ${row('Buying power', a.buying_power == null ? null : money(a.buying_power))}
          ${row('Available funds', a.available_funds == null ? null : money(a.available_funds))}
          ${row('Day-trading buying power', a.day_trading_buying_power == null ? null : money(a.day_trading_buying_power))}
          ${row('Margin balance', a.margin_balance == null ? null : money(a.margin_balance))}
          ${row('Market value of holdings', a.long_market_value == null ? null : money(a.long_market_value))}
          ${row('Equity', a.equity_percentage == null ? null : a.equity_percentage.toFixed(1) + '%')}
          ${row('Positions', a.positions == null ? null : String(a.positions))}
          ${a.broker === 'binance' ? row('Key can trade', a.can_trade ? 'yes' : 'no') + row('Key can withdraw', a.can_withdraw ? 'YES' : 'no') : ''}
        </dl>
        ${a.broker === 'binance' && a.can_withdraw ? '<div class="account-warning">This API key can withdraw funds. Use a key with withdrawals disabled.</div>' : ''}
      </div>`).join('')}
      ${statements.map(i => `<div class="account-card">
        <h4><span>${esc(i.name)}</span><span class="account-flag">from statements</span></h4>
        <dl>${row('Total value', money(i.total))}${row('As of', esc(i.as_of))}</dl>
        <div class="orders-sync">Not read live. This is the last statement the finance pipeline has, so the value may be out of date.</div>
      </div>`).join('')}
      ${failed.length ? `<div class="account-warning">Not available: ${failed.join(' · ')}</div>` : ''}
    </div>
    <div class="orders-sync" style="padding:0 12px 10px">Updated ${esc(new Date(accountsData.generated_at).toLocaleTimeString())} · <a href="#" id="accounts-refresh">Refresh</a></div>
    <div id="money-box"></div>`;
    document.getElementById('accounts-refresh').addEventListener('click', event => { event.preventDefault(); loadAccounts(); });
    loadMoney();
  }

  // ── Deposits, withdrawals and transfers ──────────────────────────────────────
  let transfersData = null, moneyStep = null, includeJournals = false;

  async function loadMoney() {
    const box = document.getElementById('money-box');
    if (!box) return;
    try {
      const [tr, st] = await Promise.all([
        fetch('/api/tradility-transfers').then(r => r.json()),
        tradeStatus ? Promise.resolve(tradeStatus) : fetch('/api/tradility-trade/status').then(r => r.json()),
      ]);
      if (!tr.ok) throw new Error(tr.error || 'unavailable');
      transfersData = tr;
      tradeStatus = st;
    } catch (err) {
      box.innerHTML = `<div class="account-warning" style="padding:0 12px 10px">Deposit and withdrawal history is not available: ${esc(err.message)}</div>`;
      return;
    }
    renderMoney();
  }

  function renderMoney() {
    const box = document.getElementById('money-box');
    const rows = (transfersData.transfers || []).filter(r => includeJournals || r.kind !== 'journal');
    const hidden = (transfersData.transfers || []).length - rows.length;
    const sum = dir => rows.filter(r => r.direction === dir && r.asset === 'USD').reduce((a, r) => a + r.amount, 0);
    const w = (tradeStatus && tradeStatus.withdrawals) || {};
    box.innerHTML = `<div class="trade-box" style="margin:0 12px 12px">
      <h4>Deposits and withdrawals · past year${rows.length ? ` · ${money(sum('in'))} in, ${money(sum('out'))} out (USD)` : ''}</h4>
      <label class="orders-sync"><input type="checkbox" id="money-journals" ${includeJournals ? 'checked' : ''}> include internal journals${hidden ? ` (${hidden} hidden)` : ''}</label>
      ${rows.length ? `<table class="orders-table"><thead><tr><th>Date</th><th>Where</th><th>Type</th><th class="num">Amount</th><th>Status</th><th>Note</th></tr></thead><tbody>
        ${rows.slice(0, 40).map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.broker === 'schwab' ? 'Schwab …' + r.account : 'Binance.US')}</td><td>${esc(r.kind)}</td>
          <td class="num">${r.direction === 'in' ? '+' : '−'}${r.asset === 'USD' ? money(r.amount) : esc(String(r.amount)) + ' ' + esc(r.asset)}</td><td>${esc(r.status)}</td><td>${esc(r.note || '')}</td></tr>`).join('')}
        </tbody></table>${rows.length > 40 ? `<div class="orders-sync">Showing the latest 40 of ${rows.length}.</div>` : ''}`
        : '<p class="company-description">No deposits or withdrawals found.</p>'}
      <div class="orders-sync">Schwab does not offer money movement through its API, so transfers there are history only.</div>
      ${withdrawSection(w)}
    </div>`;
    box.querySelector('#money-journals').addEventListener('change', e => { includeJournals = e.target.checked; renderMoney(); });
    const form = box.querySelector('#withdraw-form');
    if (form) form.addEventListener('submit', event => { event.preventDefault(); startWithdraw(form); });
    const go = box.querySelector('#withdraw-go');
    if (go) go.addEventListener('click', sendWithdraw);
    const discard = box.querySelector('#withdraw-discard');
    if (discard) discard.addEventListener('click', () => { moneyStep = null; renderMoney(); });
  }

  function withdrawSection(w) {
    if (!w.enabled) return '<div class="orders-sync">Binance.US withdrawals are turned off in the trading policy.</div>';
    if (!(w.destinations || []).length) return '<div class="orders-sync">No withdrawal destinations are listed in the policy.</div>';
    return `<h4 style="margin-top:12px">Withdraw from Binance.US · only to destinations in your policy, up to ${money(w.per_withdrawal_usd)} each, ${money(w.daily_withdrawal_usd)} a day (${money(w.spent_today)} used)</h4>
      <form class="order-form" id="withdraw-form" autocomplete="off">
        <select name="label" aria-label="Destination" required>
          <option value="">Destination…</option>
          ${w.destinations.map(d => `<option value="${esc(d.label)}">${esc(d.label)} · ${esc(d.coin)} ${esc(d.network)} ${esc(d.to)}</option>`).join('')}
        </select>
        <input name="amount" type="number" step="any" min="0" placeholder="Amount" aria-label="Amount" required>
        <button type="submit" class="primary">Preview</button>
      </form>
      ${moneyStep ? `<div><p>Withdraw ${esc(String(moneyStep.amount))} ${esc(moneyStep.coin)} (about ${money(moneyStep.notional)}) to <strong>${esc(moneyStep.label)}</strong> (${esc(moneyStep.network)} ${esc(moneyStep.to)}).</p>
        <p>Type <strong>${esc(moneyStep.phrase)}</strong> to confirm. This sends real funds and cannot be undone.</p>
        <input type="text" id="withdraw-phrase" autocomplete="off" aria-label="Confirmation phrase" style="width:260px">
        <button type="button" class="primary" id="withdraw-go">Withdraw</button> <button type="button" id="withdraw-discard">Discard</button></div>` : ''}
      <div class="order-error" id="withdraw-error" role="alert"></div>`;
  }

  async function withdrawCall(step, body) {
    const res = await fetch(`/api/tradility-trade/withdraw/${step}`, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken}, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  async function startWithdraw(form) {
    const f = Object.fromEntries(new FormData(form).entries());
    try {
      moneyStep = await withdrawCall('preview', {label: f.label, amount: f.amount});
    } catch (err) {
      moneyStep = null;
      renderMoney();
      document.getElementById('withdraw-error').textContent = err.message;
      return;
    }
    renderMoney();
  }

  async function sendWithdraw() {
    const step = moneyStep, phrase = document.getElementById('withdraw-phrase').value;
    moneyStep = null;   // single use, whatever happens next
    let message = 'Sent. It appears in the history once Binance.US lists it.';
    try {
      await withdrawCall('confirm', {preview_id: step.preview_id, phrase});
    } catch (err) {
      message = err.message;
    }
    tradeStatus = null;   // refresh today's total
    await loadMoney();
    const box = document.getElementById('withdraw-error');
    if (box) box.textContent = message;
  }

  document.getElementById('accounts-panel').addEventListener('toggle', event => {
    if (event.target.open && !accountsData) loadAccounts();
  });

  // The selected account's funds, shown under the order form.
  function showAccountFunds() {
    const note = document.getElementById('trade-funds');
    const form = document.getElementById('trade-form');
    if (!note || !form) return;
    const mask = form.elements.account ? form.elements.account.value : '';
    const submit = document.getElementById('trade-submit');
    if (submit) submit.textContent = mask.startsWith('fid:') ? 'Prepare Fidelity ticket' : 'Preview';
    if (mask.startsWith('fid:')) {
      const fa = ((tradeStatus && tradeStatus.fidelity_accounts) || []).find(a => 'fid:' + a.id === mask);
      note.classList.remove('trade-warn');
      note.textContent = `Fidelity has no order API, so this only prepares a ticket for you to submit on Fidelity. ${fa && fa.as_of ? 'Balances and holdings here are from the ' + fa.as_of + ' statement.' : ''}`;
      return;
    }
    const acct = ((accountsData && accountsData.accounts) || []).find(a => a.broker === (isCrypto() ? 'binance' : 'schwab') && (isCrypto() || a.id === mask));
    note.textContent = acct
      ? `${acct.label}: buying power ${money(acct.buying_power)} · cash ${money(acct.cash)} · ${acct.margin_eligible ? 'margin account' : 'cash account'}`
      : '';
    // Catch an unaffordable buy before the preview: the order's cost against what the account can spend.
    note.classList.remove('trade-warn');
    if (acct && form.elements.side.value === 'buy') {
      const qty = Number(form.elements.quantity.value);
      const px = form.elements.kind.value === 'limit' ? Number(form.elements.price.value) : (tradeQuote ? tradeQuote.mark : 0);
      const cost = qty * px;
      const spendable = acct.spendable != null ? acct.spendable : acct.buying_power;
      if (cost > 0 && spendable != null && cost > spendable) {
        note.textContent += ` · This order costs about ${money(cost)}, more than the ${money(spendable)} this account can spend on new stock orders, so Schwab is likely to reject it. Pick another account or a smaller quantity.`;
        note.classList.add('trade-warn');
      }
    }
  }

  function money(v) {
    return '$' + Number(v || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function tradeSection() {
    if (!tradeStatus || !tradeStatus.available) return '';
    if (!tradeStatus.enabled) return '<div class="orders-sync">Order placement is turned off in the trading policy.</div>';
    if (!canTrade()) return `<div class="orders-sync">${esc(detailTicker)} is not on the trading allowlist.</div>`;
    if (isCrypto() && !(tradeStatus.brokers || []).includes('binance')) return '<div class="orders-sync">Binance.US trading is not enabled. It needs a separate trade-enabled API key (withdrawals off) and <code>binance = true</code> in the trading policy; see the Tradility README.</div>';
    const limits = `up to ${money(tradeStatus.per_order_usd)} per order, ${money(tradeStatus.daily_usd)} a day (${money(tradeStatus.spent_today)} used)`;
    return `<div class="trade-box" id="trade-box">
      <h4>Place an order · ${limits}</h4>
      <form class="order-form" id="trade-form" autocomplete="off">

          <option value="">Account…</option>
          ${(tradeStatus.schwab_accounts || []).map(a => {
            const info = ((accountsData && accountsData.accounts) || []).find(x => x.broker === 'schwab' && x.id === a);
            const spend = info ? (info.spendable != null ? info.spendable : info.buying_power) : null;
            return `<option value="${esc(a)}">…${esc(a)}${spend == null ? '' : ' · ' + money(spend) + ' available'}</option>`;
          }).join('')}
          ${(tradeStatus.fidelity_accounts || []).map(a => `<option value="fid:${esc(a.id)}">${esc(a.label)}${a.type ? ' (' + esc(a.type) + ')' : ''} · Fidelity, you submit it</option>`).join('')}
        </select>`}
        <select name="side" aria-label="Side"><option>buy</option><option>sell</option></select>
        <select name="kind" aria-label="Order type"><option>limit</option><option>market</option></select>
        <input name="quantity" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
        <input name="price" type="number" step="any" min="0" placeholder="Limit price" aria-label="Limit price">
        ${isCrypto() ? '' : `<select name="tif" aria-label="Duration">
          ${TIF_CHOICES.map(([v, label]) => `<option value="${v}" ${((tradeStatus.defaults || {}).time_in_force || 'gtc') === v ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
        <select name="session" aria-label="Trading hours">

        </select>`}
        <button type="submit" class="primary" id="trade-submit">Preview</button>
      </form>
      <div class="template-chips" id="trade-templates" aria-label="Order templates"></div>

      <div class="order-error" id="trade-error" role="alert"></div>
    </div>`;
  }

  function signed(v) {
    return (v >= 0 ? '+' : '−') + money(Math.abs(v));
  }

  function pctText(v) {
    return v == null ? '—' : v.toFixed(2) + '%';
  }

  // How the order changes the position: dollars, shares and the share of the account and of everything
  // you own, before and after, plus what is left to trade with.
  // Where a symbol is held now, account by account. In a preview the chosen account also shows
  // what it will hold after the order.
  function holdingsTable(symbol, rows, statements) {
    const list = (rows || []).filter(r => r.quantity || r.chosen);
    const stmt = statements || [];
    if (!list.length && !stmt.length) return `<div class="orders-sync">You hold no ${esc(symbol)} in any connected account.</div>`;
    const shares = n => esc(String(+Number(n).toFixed(6)));
    const barMax = Math.max(0.01, ...list.flatMap(r => [r.percent || 0, r.percent_after || 0])) * 1.15;
    const body = list.map(r => `<tr${r.chosen ? ' class="order-open"' : ''}><td>${esc(r.label)}${r.chosen ? ' (this order)' : ''}</td>
      <td class="num">${shares(r.quantity)}${r.chosen ? ' → ' + shares(r.quantity_after) : ''}</td>
      <td class="num">${money(r.value)}${r.chosen ? ' → ' + money(r.value_after) : ''}</td>
      <td class="num">${pctText(r.percent)}${r.chosen ? ' → ' + pctText(r.percent_after) : ''}${r.percent != null ? shareBar(r.percent, r.chosen ? r.percent_after : null, null, {max: barMax}) : ''}</td></tr>`).join('')
      + stmt.map(s2 => `<tr><td>${esc(s2.name)} <span class="account-flag">statement ${esc(s2.as_of)}</span></td><td class="num">${shares(s2.quantity)}</td><td class="num">${money(s2.market_value)}</td><td class="num">—</td></tr>`).join('');
    return `<table class="orders-table impact-table"><thead><tr><th>Where you hold ${esc(symbol)}</th><th class="num">Shares</th><th class="num">Value</th><th class="num">Share of account</th></tr></thead><tbody>${body}</tbody></table>`;
  }

  // Against the To Invest target: where this order leaves the holding as a share of everything.
  function targetPreviewLine(im) {
    const r = targetFor(detailTicker);
    if (!r || r.target == null) return '';
    const basis = im.everything || im.overall;
    const after = basis && basis.percent ? basis.percent.after : null;
    const before = basis && basis.percent ? basis.percent.before : null;
    if (after == null) return '';
    const gap = r.target - after;
    const verdict = gap > 0.05 ? `still ${pctPlain(gap)} below` : gap < -0.05 ? `${pctPlain(-gap)} above` : 'on';
    return `<div class="orders-sync"><strong>To Invest target ${pctPlain(r.target)}</strong> (${esc(r.category)}): this order moves the holding from ${pctPlain(before)} to ${pctPlain(after)} of everything, ${verdict} the target.
      ${shareBar(before || 0, after, r.target, {big: true})}${barLegend(true)}</div>`;
  }

  function impactTable(im) {
    if (!im) return '<div class="orders-sync">Position impact is not available right now.</div>';
    const a = im.account, o = im.overall;
    const shareMax = Math.max(0.01, ...[a.percent, o.percent, im.everything && im.everything.percent].filter(Boolean).flatMap(p => [p.before || 0, p.after || 0])) * 1.15;
    const row = (label, q, v, p, total) => `<tr><td>${esc(label)}</td>
      <td class="num">${esc(String(+q.before.toFixed(6)))} → ${esc(String(+q.after.toFixed(6)))}</td>
      <td class="num">${money(v.before)} → ${money(v.after)} <span class="${v.after >= v.before ? 'ret-pos' : 'ret-neg'}">(${signed(v.after - v.before)})</span></td>
      <td class="num">${pctText(p.before)} → ${pctText(p.after)}${p.before != null && p.after != null ? shareBar(p.before, p.after, null, {max: shareMax}) : ''}</td><td class="num">${money(total)}</td></tr>`;
    return `<table class="orders-table impact-table"><thead><tr><th>${esc(im.symbol)} position</th><th class="num">Shares</th><th class="num">Value</th><th class="num">Share of total</th><th class="num">Total</th></tr></thead><tbody>
      ${row(a.label || 'This account', a.quantity, a.value, a.percent, a.total)}
      ${row('All live accounts (Schwab + Binance.US)', o.quantity, o.value, o.percent, o.total)}
      ${im.everything ? row(`Plus ${im.everything.institutions.map(i => i.name + ' (statement ' + i.as_of + ')').join(', ')}`, im.everything.quantity, im.everything.value, im.everything.percent, im.everything.total) : ''}
      </tbody></table>
      <div class="orders-sync">“Live” accounts are read from Schwab and Binance.US now. ${im.everything ? 'The last row adds accounts known only from statements, whose values may be months old.' : 'Accounts that are only known from statements are not included.'}</div>
      <div class="orders-sync">${a.cash_after == null ? '' : `Cash after: ${money(a.cash_after)}${a.cash_after < 0 ? ' (the shortfall is margin)' : ''}`}${a.buying_power_after == null ? '' : ` · available for new stock orders after: ${money(a.buying_power_after)}`}</div>
      ${targetPreviewLine(im)}
      ${holdingsTable(im.symbol, im.holdings, null)}`;
  }

  // The optional browser step: have the service fill in Fidelity's own ticket, press its Preview and check it.
  function fidelityStagePanel() {
    const mode = (tradeStatus && tradeStatus.fidelity_automation) || 'off';
    const st = tradeStep;
    if (st.staged) {
      const ok = (st.staged.checks || []).map(c => `<li>${esc(c)}</li>`).join('');
      const submit = mode === 'submit';
      return `<div class="orders-sync"><strong>Staged on Fidelity and checked.</strong> Fidelity's own preview shows this order:
          <ul style="margin:4px 0 4px 18px">${ok}</ul>
          ${st.staged.screenshot ? `Screenshot: ${esc(st.staged.screenshot)}.` : ''}</div>
        ${submit
          ? `<p>This sends a real order through Fidelity's website.</p>
             ${st.confirmation === 'phrase' ? `<p>Type <strong>${esc(st.phrase)}</strong> to confirm.</p><input type="text" id="fid-phrase" autocomplete="off" aria-label="Confirmation phrase" style="width:260px">` : ''}
             <button type="button" class="primary" id="fid-submit">Place order at Fidelity</button>`
          : '<p>Submitting from here is off (the policy says <code>stage</code>). Submit it on Fidelity yourself, then record it below.</p>'}`;
    }
    if (mode === 'off') return "<p>Nothing is sent from here. Review these fields on Fidelity's trade page and submit the order there, then record it.</p>";
    return `<p>Nothing has been sent. You can have the service fill in Fidelity's trade ticket in its browser and check Fidelity's own preview against this order${mode === 'submit' ? ', and then place it' : ''}.</p>
      <button type="button" id="fid-stage">Stage on Fidelity</button>`;
  }

  async function stageOnFidelity() {
    const st = tradeStep;
    tradeFail('Filling in Fidelity’s ticket…');
    try {
      const data = await tradeCall('fidelity-stage', {ticker: detailTicker, ...st.ticket.order});
      tradeStep = {...st, ticket: data, staged: data.staged, previewId: data.preview_id, phrase: data.phrase, confirmation: data.confirmation, warnings: data.warnings};
    } catch (err) {
      renderOrders();
      tradeFail(err.message);
      return;
    }
    renderOrders();
    tradeFail('');
  }

  async function submitOnFidelity() {
    const st = tradeStep;
    const phraseInput = document.getElementById('fid-phrase');
    const phrase = phraseInput ? phraseInput.value : '';
    tradeStep = null;   // single use, whatever happens next
    try {
      await tradeCall('fidelity-submit', {preview_id: st.previewId, phrase});
    } catch (err) {
      renderOrders();
      tradeFail(err.message);
      return;
    }
    await loadOrders(detailTicker);
    tradeFail('Sent through Fidelity’s website. Fidelity is not read live, so record it below or check Fidelity for the fill.');
  }

  function fidelityPanel() {
    const t = tradeStep.ticket;
    return `<div>
      <p>${tradeStep.summary}</p>
      <table class="orders-table"><tbody>${t.fields.map(([k, v]) => `<tr><td>${esc(k)}</td><td><strong>${esc(v)}</strong></td></tr>`).join('')}</tbody></table>
      ${impactTable(t.impact)}
      ${(t.warnings || []).map(w => `<div class="trade-warn">${esc(w)}</div>`).join('')}
      ${fidelityStagePanel()}
      <button type="button" id="fid-copy">Copy ticket</button>
      <a class="company-link" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Open Fidelity's trade page ↗</a>
      <button type="button" class="primary" id="fid-record">I placed it at Fidelity</button>
      <button type="button" id="trade-discard">Discard</button>
    </div>`;
  }

  function confirmPanel() {
    const st = tradeStep;
    if (st.kind === 'fidelity') return fidelityPanel();
    const button = st.kind === 'place' && st.confirmation === 'button';
    return `<div>
      <p>${st.summary}</p>
      ${st.kind === 'place' ? impactTable(st.impact) : ''}
      ${(st.warnings || []).map(w => `<div class="trade-warn">${esc(w)}</div>`).join('')}
      ${button ? `<p>${'This sends a real order.'}</p>`
               : `<p>Type <strong>${esc(st.phrase)}</strong> to confirm. ${st.kind === 'cancel' ? 'This cancels a real order.' : 'This sends a real order.'}</p>
      <input type="text" id="trade-phrase" autocomplete="off" aria-label="Confirmation phrase">`}
      <button type="button" class="primary" id="trade-go">${button ? 'Place order' : (st.kind === 'cancel' ? 'Cancel order' : 'Send order')}</button>
      <button type="button" id="trade-discard">Discard</button>
    </div>`;
  }

  // Schwab's durations and sessions. Day, GTC and the extended session are the familiar
  // DAY, DAY EXT, GTC and GTC EXT; the rest are checked here and again by the service.
  const TIF_CHOICES = [['day', 'Day'], ['gtc', 'GTC'], ['fok', 'Fill or kill'], ['ioc', 'Immediate or cancel'],
                       ['end_of_week', 'End of week'], ['end_of_month', 'End of month'], ['next_end_of_month', 'Next end of month']];
  const SESSION_CHOICES = [['normal', 'Regular hours'], ['extended', 'Extended hours'],
                           ['am', 'Pre-market only'], ['pm', 'After-hours only']];
  const TIF_LABEL = Object.fromEntries(TIF_CHOICES);
  const HOURS_LABEL = {normal: '', extended: ', extended hours', am: ', pre-market only', pm: ', after-hours only'};

  // Keep the choices to ones Schwab accepts: a market order is a regular-hours day / FOK / IOC order,
  // and extended, pre-market and after-hours orders are limit orders that are day or GTC.
  function syncOrderChoices(form) {
    const kind = form.elements.kind.value, tif = form.elements.tif, session = form.elements.session;
    if (!tif || !session) return;
    if (kind === 'market') {
      session.value = 'normal';
      if (!['day', 'fok', 'ioc'].includes(tif.value)) tif.value = 'day';
    } else if (session.value !== 'normal' && !['day', 'gtc'].includes(tif.value)) {
      tif.value = 'gtc';
    }
    for (const option of tif.options) {
      const restricted = (kind === 'market' && !['day', 'fok', 'ioc'].includes(option.value))
        || (session.value !== 'normal' && !['day', 'gtc'].includes(option.value));
      option.disabled = restricted;
    }
    for (const option of session.options) option.disabled = kind === 'market' && option.value !== 'normal';
  }

  function isCrypto() {
    return /-USD$/.test(detailTicker || '');
  }

  // The default order: a good-till-cancelled limit at the policy's offset from the live mark
  // (below it for a buy, above it for a sell). Editable; it refills when the side changes.
  let tradeQuote = null;
  async function loadQuote() {
    const ticker = detailTicker;
    try {
      const res = await fetch(`/api/tradility-trade/quote/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker || !res.ok || !data.ok) throw new Error(data.error || 'no quote');
      tradeQuote = data;
    } catch (err) {
      tradeQuote = null;
      const note = document.getElementById('trade-default');
      if (note) note.textContent = `No live mark for ${ticker}: ${err.message}`;
      return;
    }
    fillDefaults();
    paintTemplates();
  }

  // One-click order shapes from the policy (default: buy 1/2/4/8% under the mark, sell 1/2/4/8% over).
  // A template sets the side, a limit order, the price from the live mark and, if it names them, the
  // duration and hours. You still enter the quantity and preview before anything is sent.
  function paintTemplates() {
    const box = document.getElementById('trade-templates');
    if (!box || !tradeQuote) return;
    const list = tradeQuote.templates || [];
    box.innerHTML = list.map((t, i) => `<button type="button" class="${esc(t.side)}" data-template="${i}" title="${esc(t.side)} limit at ${fmtPrice(t.price)}">${esc(t.name)}</button>`).join('');
    box.querySelectorAll('button').forEach(button => button.addEventListener('click', () => applyTemplate(list[Number(button.dataset.template)], button)));
  }

  function applyTemplate(t, button) {
    const form = document.getElementById('trade-form');
    if (!form || !t) return;
    form.elements.side.value = t.side;
    form.elements.kind.value = 'limit';
    form.elements.price.disabled = false;
    form.elements.price.value = t.price;
    if (form.elements.tif && t.tif) form.elements.tif.value = t.tif;
    if (form.elements.session && t.session) form.elements.session.value = t.session;
    if (form.elements.tif) syncOrderChoices(form);
    document.querySelectorAll('#trade-templates button').forEach(b => b.classList.toggle('active', b === button));
    document.getElementById('trade-default').textContent =
      `Mark ${fmtPrice(tradeQuote.mark)} · template: ${t.name} (${t.offset_pct > 0 ? '+' : ''}${t.offset_pct}% → ${fmtPrice(t.price)})`;
    form.elements.quantity.focus();
  }

  function fillDefaults() {
    const form = document.getElementById('trade-form');
    if (!form || !tradeQuote) return;
    const d = (tradeStatus && tradeStatus.defaults) || {};
    const side = form.elements.side.value;
    const pct = side === 'buy' ? d.buy_offset_pct : d.sell_offset_pct;
    if (form.elements.kind.value === 'limit') form.elements.price.value = side === 'buy' ? tradeQuote.buy_price : tradeQuote.sell_price;
    document.getElementById('trade-default').textContent =
      `Mark ${fmtPrice(tradeQuote.mark)} · default: limit ${Math.abs(pct)}% ${pct < 0 ? 'below' : 'above'} the mark`;
  }

  function tradeFail(message) {
    const box = document.getElementById('trade-error');
    if (box) box.textContent = message;
  }

  async function tradeCall(action, body) {
    const res = await fetch(`/api/tradility-trade/${action}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // Fidelity has no order API, so an order for a Fidelity account is only prepared: the service checks it
  // and lays it out in Fidelity's fields, and you submit it on Fidelity's own page.
  function fidelityAccount(form) {
    const v = form.elements.account ? form.elements.account.value : '';
    return v.startsWith('fid:') ? v.slice(4) : null;
  }

  async function startFidelityTicket(form, mask) {
    const f = Object.fromEntries(new FormData(form).entries());
    try {
      const t = await tradeCall('fidelity-ticket', {ticker: detailTicker, account: mask, side: f.side, kind: f.kind, quantity: f.quantity, price: f.kind === 'limit' ? f.price : null, ...(f.session ? {session: f.session, tif: f.tif} : {})});
      tradeStep = {kind: 'fidelity', ticket: t, warnings: t.warnings, impact: t.impact, summary: `Prepare for Fidelity: ${esc(t.order.side)} ${esc(String(t.order.quantity))} ${esc(t.order.ticker)}${t.order.price != null ? ' at ' + fmtPrice(t.order.price) : ' at market'}, about ${fmtPrice(t.notional)} (last price ${fmtPrice(t.last_price)})`};
    } catch (err) {
      tradeStep = null;
      renderOrders();
      tradeFail(err.message);
      return;
    }
    renderOrders();
  }

  async function recordFidelityOrder() {
    const st = tradeStep, o = st.ticket.order;
    tradeStep = null;
    try {
      const res = await fetch(`/api/tradility-orders/${encodeURIComponent(detailTicker)}`, {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
        body: JSON.stringify({side: o.side, kind: o.kind, quantity: o.quantity, price: o.price, status: 'open', note: `${st.ticket.fields[0][1]} (submitted at Fidelity)`}),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailOrders = data;
    } catch (err) {
      renderOrders();
      tradeFail(err.message);
      return;
    }
    renderOrders();
    tradeFail('Recorded as an open order. Fidelity is not read live, so mark it filled or cancelled here when it is.');
  }

  async function copyTicket() {
    const text = tradeStep && tradeStep.ticket ? tradeStep.ticket.text : '';
    try {
      await navigator.clipboard.writeText(text);
      tradeFail('Ticket copied.');
    } catch (err) {
      tradeFail('Could not copy; select the fields above instead.');
    }
  }

  async function startPreview(form) {
    tradeFail('');
    const fid = fidelityAccount(form);
    if (fid) return startFidelityTicket(form, fid);
    const f = Object.fromEntries(new FormData(form).entries());
    try {
      const pv = await tradeCall('preview', {ticker: detailTicker, account: f.account || '', side: f.side, kind: f.kind, quantity: f.quantity, price: f.kind === 'limit' ? f.price : null, ...(f.session ? {session: f.session, tif: f.tif} : {})});
      const o = pv.order;
      tradeStep = {
        kind: 'place', previewId: pv.preview_id, phrase: pv.phrase, warnings: pv.warnings, impact: pv.impact, confirmation: pv.confirmation,
        summary: `${esc(o.side)} ${esc(String(o.quantity))} ${esc(o.ticker)} ${o.kind === 'limit' ? 'at ' + fmtPrice(o.price) + ' (' + (TIF_LABEL[o.tif] || o.tif) + (HOURS_LABEL[o.session] || '') + ')' : 'at market'} on ${esc(pv.broker)}${o.account ? ' account …' + esc(o.account) : ''}, about ${fmtPrice(pv.notional)} (last price ${fmtPrice(pv.last_price)})`,
      };
    } catch (err) {
      tradeStep = null;
      renderOrders();
      tradeFail(err.message);
      return;
    }
    renderOrders();
  }

  function startBrokerCancel(id) {
    const order = detailOrders.orders.find(o => o.id === id);
    if (!order) return;
    const brokerId = id.replace(/^[a-z]+-/, '');
    tradeStep = {
      kind: 'cancel', broker: order.source, orderId: brokerId, account: order.account || '', phrase: `CANCEL ${brokerId}`, warnings: [],
      symbol: order.source === 'binance' ? detailTicker.replace(/-USD$/, '') + 'USD' : '',
      summary: `Cancel the open ${esc(order.side)} ${esc(String(order.quantity))} ${esc(detailTicker)} order at ${esc(sourceLabel(order.source))}`,
    };
    renderOrders();
  }

  async function sendStep() {
    const st = tradeStep;
    const phraseInput = document.getElementById('trade-phrase');
    const phrase = phraseInput ? phraseInput.value : '';
    tradeStep = null;   // a preview is single use; start over after any outcome
    try {
      if (st.kind === 'place') await tradeCall('confirm', {preview_id: st.previewId, phrase});
      else await tradeCall('cancel', {broker: st.broker, order_id: st.orderId, symbol: st.symbol, account: st.account, phrase});
    } catch (err) {
      renderOrders();
      tradeFail(err.message);
      return;
    }
    await loadOrders(detailTicker);   // the broker's export refreshes on its own schedule
    tradeFail('Sent. Broker orders appear here after the next sync.');
  }

  function renderOrders() {
    const box = document.getElementById('detail-orders');
    if (!box || !detailOrders) return;
    const pos = detailOrders.position || {};
    const last = detailRecord && detailRecord.last_price;
    const entry = pos.avg_entry;
    const pl = entry && last != null ? (last - entry) / entry * 100 : null;
    const shares = n => String(+Number(n).toFixed(4));
    const source = pos.source === 'orders' ? 'from filled buys'
      : pos.source === 'live+holdings' ? 'Schwab live + statements' : pos.source === 'holdings' ? 'from statements' : '';
    const coverage = pos.partial ? ` · covers ${shares(pos.covered_quantity)} of ${shares(pos.quantity)} shares; the rest have no cost on record` : '';
    const rows = detailOrders.orders.map(o => `
      <tr class="order-${esc(o.status)}">
        <td>${esc(o.date)}</td>
        <td>${esc(o.side)}</td>
        <td>${esc(o.kind.replace('_', ' '))}</td>
        <td class="num">${esc(String(o.quantity))}</td>
        <td class="num">${o.price == null ? '—' : fmtPrice(o.price)}</td>
        <td>${esc(o.status)}</td>
        <td class="order-effect">${o.status === 'open' ? effectCell(o) : ''}</td>
        <td>${esc(o.note || '')}</td>
        <td>${esc(sourceLabel(o.source))}</td>
        <td class="order-actions">
          ${o.source && o.source !== 'manual' ? '' : o.status === 'open' && o.price != null ? `<button type="button" data-order-act="fill" data-id="${esc(o.id)}">Filled</button>` : ''}
          ${o.source && o.source !== 'manual' ? (o.status === 'open' && canTrade() ? `<button type="button" data-order-act="broker-cancel" data-id="${esc(o.id)}">Cancel at broker</button>` : '') : o.status === 'open' ? `<button type="button" data-order-act="cancel" data-id="${esc(o.id)}">Cancel</button>` : ''}
          ${o.source && o.source !== 'manual' ? '' : `<button type="button" data-order-act="delete" data-id="${esc(o.id)}" aria-label="Delete order">×</button>`}
        </td>
      </tr>`).join('');
    box.innerHTML = `
      <div class="orders-summary">
        <span>Quantity<strong>${pos.quantity == null ? '—' : esc(String(pos.quantity))}</strong></span>
        <span>Average entry<strong>${entry ? fmtPrice(entry) : '—'}</strong>${source || coverage ? ` <span>${source}${coverage}</span>` : ''}</span>
        <span>Vs last price<strong class="${pl == null ? '' : returnClass(pl)}">${pl == null ? '—' : formatReturn(pl)}</strong></span>
      </div>
      ${rows ? `<table class="orders-table"><thead><tr><th>Date</th><th>Side</th><th>Type</th><th class="num">Qty</th><th class="num">Price</th><th>Status</th><th>If this fills</th><th>Note</th><th>Source</th><th></th></tr></thead><tbody>${rows}</tbody></table>${openOrdersEffect()}`
             : '<p class="company-description">No orders recorded for this ticker.</p>'}
      <div id="held-box">${heldBox()}</div>
      ${tradeSection()}
      <div class="orders-sync">${syncNote()}</div>
      <form class="order-form" id="order-form" autocomplete="off">
        <select name="side" aria-label="Side"><option>buy</option><option>sell</option></select>
        <select name="kind" aria-label="Order type"><option>limit</option><option>market</option><option>stop</option><option value="stop_limit">stop limit</option></select>
        <input name="quantity" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
        <input name="price" type="number" step="any" min="0" placeholder="Price" aria-label="Price">
        <select name="status" aria-label="Status"><option>open</option><option>filled</option><option>cancelled</option></select>
        <input name="date" type="date" aria-label="Date" value="${new Date().toISOString().slice(0, 10)}">
        <input name="note" type="text" maxlength="120" placeholder="Note" aria-label="Note">
        <button type="submit">Add order</button>
      </form>
      <div class="order-error" id="order-error" role="alert"></div>`;
    box.querySelector('#order-form').addEventListener('submit', event => {
      event.preventDefault();
      const f = new FormData(event.target);
      submitOrder(() => sendOrder('POST', orderPath(), Object.fromEntries(f.entries())));
    });
    const tradeForm = box.querySelector('#trade-form');
    if (tradeForm) {
      tradeForm.addEventListener('submit', event => { event.preventDefault(); startPreview(tradeForm); });
      tradeForm.elements.side.addEventListener('change', fillDefaults);
      if (tradeForm.elements.session) {
        tradeForm.elements.session.addEventListener('change', () => syncOrderChoices(tradeForm));
        tradeForm.elements.tif.addEventListener('change', () => syncOrderChoices(tradeForm));
        syncOrderChoices(tradeForm);
      }
      if (tradeForm.elements.account) tradeForm.elements.account.addEventListener('change', async () => {
        if (!accountsData) await loadAccounts();
        showAccountFunds();
      });
      ['quantity', 'price'].forEach(name => tradeForm.elements[name].addEventListener('input', showAccountFunds));
      ['side', 'kind'].forEach(name => tradeForm.elements[name].addEventListener('change', showAccountFunds));
      if (isCrypto()) (accountsData ? Promise.resolve() : loadAccounts()).then(showAccountFunds);
      tradeForm.elements.kind.addEventListener('change', () => {
        tradeForm.elements.price.disabled = tradeForm.elements.kind.value === 'market';
        syncOrderChoices(tradeForm);
        fillDefaults();
      });
      if (tradeQuote && tradeQuote.ticker === detailTicker) { fillDefaults(); paintTemplates(); }
      else if (!tradeQuote) loadQuote();
    }
    const stage = box.querySelector('#fid-stage');
    if (stage) stage.addEventListener('click', stageOnFidelity);
    const fidSubmit = box.querySelector('#fid-submit');
    if (fidSubmit) fidSubmit.addEventListener('click', submitOnFidelity);
    const copy = box.querySelector('#fid-copy');
    if (copy) copy.addEventListener('click', copyTicket);
    const record = box.querySelector('#fid-record');
    if (record) record.addEventListener('click', recordFidelityOrder);
    const go = box.querySelector('#trade-go');
    if (go) go.addEventListener('click', sendStep);
    const discard = box.querySelector('#trade-discard');
    if (discard) discard.addEventListener('click', () => { tradeStep = null; renderOrders(); });
    box.querySelectorAll('[data-order-act]').forEach(button => button.addEventListener('click', () => {
      const id = button.dataset.id, act = button.dataset.orderAct;
      if (act === 'delete') submitOrder(() => sendOrder('DELETE', orderPath(id)));
      else if (act === 'broker-cancel') startBrokerCancel(id);
      else if (act === 'cancel') changeOrder(id, {status: 'cancelled'});
      else changeOrder(id, {status: 'filled', date: new Date().toISOString().slice(0, 10)});
    }));
  }

  // Price levels drawn across the chart: your average entry, and each open order's price.
  function chartLevels() {
    if (!detailOrders) return [];
    const levels = [];
    const entry = detailOrders.position && detailOrders.position.avg_entry;
    if (entry) levels.push({price: entry, label: `Avg entry ${fmtPrice(entry)}${detailOrders.position.partial ? ' (partial)' : ''}`, kind: 'entry'});
    for (const o of detailOrders.orders) {
      if (o.status === 'open' && o.price != null) {
        levels.push({price: o.price, label: `${o.side} ${o.kind.replace('_', ' ')} ${fmtPrice(o.price)}`, kind: 'order'});
      }
    }
    return levels;
  }

  function drawDetailChart() {
    const canvas = document.getElementById('detail-chart');
    if (!canvas || !detailRecord) return;
    const points = detailPointsForRange();
    const summary = document.getElementById('detail-chart-summary');
    if (points.length < 2) {
      summary.textContent = 'Not enough history for this range.';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(300, rect.width);
    const height = Math.max(220, rect.height);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const pad = {left: 58, right: 12, top: 12, bottom: 28};
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const prices = points.map(point => point.close);
    let min = Math.min(...prices), max = Math.max(...prices);
    const pricePad = Math.max((max - min) * 0.08, max * 0.005, 0.01);
    min -= pricePad; max += pricePad;
    const levels = chartLevels();
    for (const level of levels) { min = Math.min(min, level.price - pricePad); max = Math.max(max, level.price + pricePad); }
    const t0 = points[0].date.getTime(), t1 = points[points.length - 1].date.getTime();
    const x = point => pad.left + (point.date.getTime() - t0) / Math.max(1, t1 - t0) * plotW;
    const y = point => pad.top + (max - point.close) / Math.max(0.000001, max - min) * plotH;
    const styles = getComputedStyle(document.documentElement);
    const muted = styles.getPropertyValue('--muted').trim() || '#8b949e';
    const border = styles.getPropertyValue('--border').trim() || '#30363d';
    const rising = points[points.length - 1].close >= points[0].close;
    const line = styles.getPropertyValue(rising ? '--green' : '--red').trim() || (rising ? '#3fb950' : '#f85149');

    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const yy = pad.top + plotH * i / 4;
      const value = max - (max - min) * i / 4;
      ctx.strokeStyle = border; ctx.globalAlpha = 0.65; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = muted;
      ctx.fillText(fmtPrice(value), pad.left - 7, yy);
    }

    ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.lineTo(x(points[points.length - 1]), pad.top + plotH);
    ctx.lineTo(x(points[0]), pad.top + plotH);
    ctx.closePath(); ctx.fillStyle = line; ctx.globalAlpha = 0.12; ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

    const accent = styles.getPropertyValue('--accent').trim() || '#58a6ff';
    const levelY = price => pad.top + (max - price) / Math.max(0.000001, max - min) * plotH;
    ctx.font = '10px ui-monospace, monospace';
    for (const level of levels) {
      const yy = levelY(level.price);
      ctx.save();
      ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = level.kind === 'entry' ? 1.6 : 1;
      ctx.setLineDash(level.kind === 'entry' ? [] : [5, 4]);
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.setLineDash([]); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(level.label, width - pad.right - 2, yy - 2);
      ctx.restore();
    }
    ctx.fillStyle = muted; ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left'; ctx.fillText(formatChartDate(points[0].date), pad.left, height - 3);
    ctx.textAlign = 'right'; ctx.fillText(formatChartDate(points[points.length - 1].date), width - pad.right, height - 3);
    const change = (points[points.length - 1].close - points[0].close) / points[0].close * 100;
    const calendarReturn = detailRecord.returns && detailRecord.returns[detailRange];
    const displayedReturn = calendarReturn == null ? change : Number(calendarReturn);
    summary.innerHTML = `<span>${points.length.toLocaleString()} observations</span><strong class="${returnClass(displayedReturn)}">${formatReturn(displayedReturn)}</strong>`;
  }

  function fmtPrice(v) {
    if (v == null) return '—';
    if (v >= 1000) return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (v >= 1)    return '$' + v.toFixed(2);
    if (v >= 0.01) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Indicator settings panel ─────────────────────────────────────────────────
  const SETTINGS_KEY = 'tradility-indicator-settings';
  const SMA_PAIRS = ['20/50', '20/100', '50/100', '50/200', '100/200', '200/300'];
  const FUND_GROUP_LABELS = {
    valuation: 'Valuation (P/E, PEG)', profitability: 'Profitability (ROE, margin)',
    growth: 'Growth (revenue, earnings)', balance: 'Balance sheet (debt, liquidity, coverage)',
    short: 'Short interest',
  };
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) { /* private mode */ }
  }
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (!saved || typeof saved !== 'object') return;
      for (const key of Object.keys(DEFAULT_SETTINGS)) {
        if (saved[key] && typeof saved[key] === 'object') Object.assign(settings[key], saved[key]);
      }
      settings.fund.groups = (settings.fund.groups || []).filter(g => g in FUND_GROUPS);
      if (!settings.fund.groups.length) settings.fund.groups = [...DEFAULT_SETTINGS.fund.groups];
    } catch (_) { /* unreadable settings fall back to the defaults */ }
  }
  function setting(path, value) {
    const [group, key] = path.split('.');
    settings[group][key] = value;
    applySettings();
  }
  function toggleFundGroup(group, on) {
    const next = new Set(settings.fund.groups);
    if (on) next.add(group); else next.delete(group);
    if (!next.size) { buildSettingsPanel(); return; }   // keep at least one group
    settings.fund.groups = Object.keys(FUND_GROUPS).filter(g => next.has(g));
    applySettings();
  }
  function resetSettings() {
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    buildSettingsPanel();
    applySettings();
  }
  function applySettings() {
    saveSettings();
    paintIndicatorButtons();
    paintLegend();
    renderGrid();
  }
  function selectHtml(path, current, options, suffix = '') {
    return `<select onchange="setting('${path}', Number(this.value))">${options.map(o =>
      `<option value="${o}" ${Number(o) === Number(current) ? 'selected' : ''}>${o}${suffix}</option>`).join('')}</select>`;
  }
  function buildSettingsPanel() {
    const s = settings;
    document.getElementById('ind-settings-body').innerHTML = `
      <div class="ind-set"><h4>RSI</h4><div class="ind-set-row">
        <label>Period ${selectHtml('rsi.period', s.rsi.period, [7, 14, 21], ' days')}</label>
        <label>Oversold at or below ${selectHtml('rsi.buy', s.rsi.buy, [20, 25, 30, 35, 40])}</label>
        <label>Overbought at or above ${selectHtml('rsi.sell', s.rsi.sell, [60, 65, 70, 75, 80])}</label>
      </div></div>
      <div class="ind-set"><h4>VWAP</h4><div class="ind-set-row">
        <label>Window ${selectHtml('vwap.window', s.vwap.window, [10, 20, 50], ' days')}</label>
        <label>Decisive beyond ±${selectHtml('vwap.band', s.vwap.band, [1, 3, 5, 10], '%')}</label>
      </div></div>
      <div class="ind-set"><h4>Trend</h4><div class="ind-set-row">
        <label>Averages <select onchange="const [a, b] = this.value.split('/').map(Number); settings.trend.short = a; settings.trend.long = b; applySettings();">${SMA_PAIRS.map(pair =>
          `<option value="${pair}" ${pair === s.trend.short + '/' + s.trend.long ? 'selected' : ''}>${pair}-day</option>`).join('')}</select></label>
        <label>Decisive gap ${selectHtml('trend.gap', s.trend.gap, [2, 5, 10], '%')}</label>
      </div></div>
      <div class="ind-set"><h4>Fundamentals</h4><div class="ind-set-row">
        ${Object.keys(FUND_GROUPS).map(g => `<label><input type="checkbox" ${s.fund.groups.includes(g) ? 'checked' : ''} onchange="toggleFundGroup('${g}', this.checked)">${FUND_GROUP_LABELS[g]}</label>`).join('')}
      </div><div class="ind-set-row">
        <label>Decisive when rules agree ${selectHtml('fund.agree', s.fund.agree, [50, 75, 100], '%')}</label>
      </div></div>
      <button type="button" class="ind-set-reset" onclick="resetSettings()">Reset to defaults</button>`;
  }
  loadSettings();
  buildSettingsPanel();
  paintIndicatorButtons();

  // Repaint legend after fonts/layout settle
  window.addEventListener('load', paintLegend);
  window.addEventListener('resize', () => {
    paintLegend();
    if (detailRecord) drawDetailChart();
  });
  document.getElementById('detail-overlay').addEventListener('click', event => {
    if (event.target.id === 'detail-overlay') closeTickerDetail();
  });
  document.addEventListener('keydown', event => {
    if (document.getElementById('detail-overlay').hidden) return;
    if (event.key === 'Escape') {
      closeTickerDetail();
    } else if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && !event.altKey
               && !event.ctrlKey && !event.metaKey && !/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) {
      stepTickerDetail(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  loadData().then(() => {
    const requestedTicker = new URLSearchParams(window.location.search).get('ticker');
    if (!requestedTicker) return;
    const normalized = requestedTicker.toUpperCase();
    const trigger = [...document.querySelectorAll('.ticker-card')]
      .find(card => card.dataset.ticker === normalized && !card.disabled);
    if (trigger) openTickerDetail(normalized, trigger);
  });
</script>
</body>
</html>
