<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>Tradility — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --surface3: color-mix(in srgb, var(--bg) 50%, var(--surface)); --muted-fg: var(--muted); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-link { font-size: 20px; text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
    .back-link:hover { opacity: 1; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
    .header-meta { font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
    .header-meta.stale { color: var(--red); font-weight: 700; }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted-fg); white-space: nowrap;
    }
    .indicator-group { display: flex; gap: 4px; }
    .ind-btn {
      padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .ind-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .ind-btn:hover:not(.active) { border-color: var(--muted-fg); color: var(--text); }

    .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted-fg);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--muted-fg); }
    .filter-btn:hover:not(.active) { border-color: var(--muted-fg); }

    .sort-select {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    .search-input {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; outline: none; width: 130px; transition: width 0.2s;
    }
    .search-input:focus { border-color: var(--accent); width: 200px; }
    .search-input::placeholder { color: var(--muted-fg); }

    .refresh-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted-fg); }
    .refresh-btn + .refresh-btn { margin-left: 0; }
    .refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon { display: inline-block; }

    /* ── Gradient legend ── */
    .legend {
      padding: 10px 20px 8px;
      background: var(--surface3);
      border-bottom: 1px solid var(--border);
    }
    .legend-scale { position: relative; }
    .legend-bar {
      height: 8px; border-radius: 4px; width: 100%; max-width: 340px;
    }
    .legend-ticks {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 3px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-labels {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 1px;
      font-size: 10px; font-weight: 700;
    }
    .legend-lbl-buy  { color: var(--green); }
    .legend-lbl-mid  { color: var(--yellow); }
    .legend-lbl-sell { color: var(--red); }
    .legend-no-data {
      margin-top: 6px; display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-no-data-swatch {
      width: 28px; height: 8px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 16px; padding: 6px 20px;
      background: var(--surface3); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
    }
    .stat { font-size: 11px; color: var(--muted-fg); }
    .stat strong { font-weight: 700; }

    /* ── Grid ── */
    main { padding: 14px 20px 80px; }

    .ticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 8px;
    }

    /* Cards use only inline styles for color; only structural rules here */
    .ticker-card {
      border-radius: 9px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
      overflow: hidden;
      width: 100%; text-align: left; font: inherit; color: inherit;
      appearance: none; background: var(--surface);
    }
    .ticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .ticker-card.no-data { background: var(--surface); opacity: 0.55; }
    .ticker-card:disabled { cursor: default; }
    .ticker-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card-ticker {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 46px;
    }
    .card-asset {
      font-size: 10px; color: var(--muted-fg); margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-price { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }

    .card-indicator {
      font-size: 11px; display: flex; align-items: center;
      justify-content: space-between; margin-top: 3px;
    }
    .card-ind-label { color: var(--muted-fg); }
    .card-ind-value { font-weight: 700; font-family: ui-monospace, monospace; font-size: 11px; }

    /* Signal badge — colored inline */
    .signal-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; border: 1px solid transparent;
    }

    /* RSI progress bar */
    .rsi-bar-wrap {
      margin-top: 7px; height: 4px; border-radius: 2px; overflow: hidden;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      position: relative;
    }
    .rsi-bar-fill { height: 100%; border-radius: 2px; }
    /* Zone markers at 30% and 70% */
    .rsi-bar-wrap::before,
    .rsi-bar-wrap::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 1px;
      background: color-mix(in srgb, var(--text) 18%, transparent);
    }
    .rsi-bar-wrap::before { left: 30%; }
    .rsi-bar-wrap::after  { left: 70%; }

    /* VWAP delta */
    .vwap-delta { font-size: 10px; font-weight: 600; margin-top: 4px; }
    .card-detail-cue { margin-top: 7px; font-size: 9px; color: var(--muted-fg); }

    /* ── Stock detail dialog ── */
    body.detail-open { overflow: hidden; }
    .detail-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(7px); padding: 20px;
      display: grid; place-items: center;
    }
    .detail-overlay[hidden] { display: none; }
    .detail-panel {
      width: min(980px, 100%); max-height: calc(100vh - 40px); overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55); padding: 20px;
    }
    .detail-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    .detail-title { flex: 1; min-width: 0; }
    .detail-ticker { font: 800 24px ui-monospace, monospace; letter-spacing: 0.6px; }
    .detail-name { color: var(--muted-fg); font-size: 12px; }
    .detail-price { font-size: 22px; font-weight: 750; white-space: nowrap; }
    .detail-close {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px;
    }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(240px, 1fr); gap: 16px; }
    .detail-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .detail-card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted-fg); font-weight: 750; margin-bottom: 9px; }
    .detail-range-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .detail-range-btn {
      border: 1px solid var(--border); background: transparent; color: var(--muted-fg);
      border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .detail-range-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    .detail-chart-wrap { position: relative; height: 310px; }
    #detail-chart { width: 100%; height: 100%; display: block; }
    .detail-chart-summary { display: flex; justify-content: space-between; gap: 12px; color: var(--muted-fg); font-size: 11px; margin-top: 5px; }
    .detail-rating { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .detail-rating-label { font-size: 22px; font-weight: 800; }
    .rating-positive { color: var(--green); }
    .rating-negative { color: var(--red); }
    .rating-neutral { color: var(--yellow); }
    .detail-disclaimer { color: var(--muted-fg); font-size: 10px; margin-top: 6px; }
    .component-list { display: grid; gap: 6px; margin-top: 12px; }
    .component-row, .detail-meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
    .component-row span:first-child, .detail-meta-row span:first-child { color: var(--muted-fg); }
    .return-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .return-cell { text-align: center; background: var(--surface3); border-radius: 7px; padding: 7px 3px; }
    .return-label { display: block; color: var(--muted-fg); font-size: 9px; text-transform: uppercase; }
    .return-value { display: block; font: 700 12px ui-monospace, monospace; margin-top: 2px; }
    .range-track { height: 7px; background: var(--surface3); border-radius: 99px; position: relative; margin: 14px 0 5px; }
    .range-marker { position: absolute; top: -4px; width: 3px; height: 15px; background: var(--accent); border-radius: 2px; transform: translateX(-50%); }
    .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-fg); }
    .detail-stack { display: grid; gap: 12px; }
    .detail-loading { padding: 70px 20px; text-align: center; color: var(--muted-fg); }
    @media (max-width: 720px) {
      .detail-overlay { padding: 0; place-items: stretch; }
      .detail-panel { max-height: 100vh; width: 100%; border-radius: 0; padding: 15px; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-chart-wrap { height: 260px; }
      .return-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* State messages */
    .state-msg { text-align: center; color: var(--muted-fg); padding: 60px 24px; font-size: 14px; }
    .error-card {
      border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); padding: 16px;
      font-size: 13px; margin-bottom: 12px; color: var(--red);
    }
  </style>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='site-nav.css') }}">
</head>
<body>
{% include "_site_nav.html" %}

<header>
  <a href="/" class="back-link" title="Home">←</a>
  <span class="header-title">📈 Tradility</span>
  <span class="header-meta" id="meta-generated"></span>
</header>

<div class="controls">
  <span class="controls-label">Indicator</span>
  <div class="indicator-group">
    <button class="ind-btn active" data-ind="rsi"  onclick="setIndicator('rsi')">RSI 14</button>
    <button class="ind-btn"        data-ind="vwap" onclick="setIndicator('vwap')">VWAP 20</button>
    <button class="ind-btn"        data-ind="trend" onclick="setIndicator('trend')">Trend 50/200</button>
  </div>

  <span class="controls-label" style="margin-left:6px">Class</span>
  <div class="filter-group" id="class-filters"></div>

  <input class="search-input" id="search-input" type="text"
         placeholder="Search ticker…" oninput="renderGrid()">

  <select class="sort-select" id="sort-select" onchange="renderGrid()">
    <option value="value-asc">Sort: value ↑ (buy first)</option>
    <option value="value-desc">Sort: value ↓ (sell first)</option>
    <option value="ticker">Sort: ticker A–Z</option>
    <option value="price-desc">Sort: price ↓</option>
  </select>

  <button class="refresh-btn" id="reload-btn" onclick="loadData()">
    <span class="refresh-icon">↻</span> Reload
  </button>
  <button class="refresh-btn" id="refresh-btn" onclick="runRefresh()">
    <span class="refresh-icon">▶</span> Run refresh
  </button>
</div>

<div class="legend">
  <div class="legend-scale">
    <canvas class="legend-bar" id="legend-bar" height="8"></canvas>
    <div class="legend-ticks" id="legend-ticks"></div>
    <div class="legend-labels">
      <span class="legend-lbl-buy"  id="legend-lbl-buy"></span>
      <span class="legend-lbl-mid"  id="legend-lbl-mid"></span>
      <span class="legend-lbl-sell" id="legend-lbl-sell"></span>
    </div>
  </div>
  <div class="legend-no-data">
    <div class="legend-no-data-swatch"></div>
    No data / fetch error
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<main>
  <div id="grid-container"><div class="state-msg">Loading…</div></div>
</main>

<div class="detail-overlay" id="detail-overlay" hidden
     role="dialog" aria-modal="true" aria-labelledby="detail-dialog-title">
  <section class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div class="detail-title">
        <div class="detail-ticker" id="detail-dialog-title">Stock details</div>
        <div class="detail-name" id="detail-dialog-name"></div>
      </div>
      <div class="detail-price" id="detail-dialog-price"></div>
      <button class="detail-close" type="button" onclick="closeTickerDetail()" aria-label="Close details">×</button>
    </div>
    <div id="detail-content"><div class="detail-loading">Loading historical performance…</div></div>
  </section>
</div>

<script>
  // ── matplotlib RdYlGn colormap (11 stops, t=0 → red, t=1 → green) ─────────
  const RDYLGN = [
    [165,   0,  38],
    [215,  48,  39],
    [244, 109,  67],
    [253, 174,  97],
    [254, 224, 139],
    [255, 255, 191],
    [217, 239, 139],
    [166, 217, 106],
    [102, 189,  99],
    [ 26, 152,  80],
    [  0, 104,  55],
  ];

  function rdylgn(t) {
    t = Math.max(0, Math.min(1, t));
    const n   = RDYLGN.length - 1;
    const pos = t * n;
    const lo  = Math.floor(pos);
    const hi  = Math.min(n, lo + 1);
    const f   = pos - lo;
    return [
      Math.round(RDYLGN[lo][0] + (RDYLGN[hi][0] - RDYLGN[lo][0]) * f),
      Math.round(RDYLGN[lo][1] + (RDYLGN[hi][1] - RDYLGN[lo][1]) * f),
      Math.round(RDYLGN[lo][2] + (RDYLGN[hi][2] - RDYLGN[lo][2]) * f),
    ];
  }

  // t=1 → buy/green, t=0 → sell/red  (inverse of raw colormap for RSI/VWAP)
  function colormapT(ticker) {
    if (ticker.fetch_status === 'error') return null;
    if (activeIndicator === 'rsi') {
      if (ticker.rsi_14 == null) return null;
      return 1 - ticker.rsi_14 / 100;          // RSI 0→t=1 (green), RSI 100→t=0 (red)
    } else if (activeIndicator === 'vwap') {
      const p = ticker.last_price, v = ticker.vwap_20;
      if (p == null || v == null || v === 0) return null;
      const d = (p - v) / v;                   // % above/below VWAP
      return Math.max(0, Math.min(1, 0.5 - d / 0.6));  // ±30% mapped to [0,1]
    } else {
      if (ticker.long_term_trend === 'bullish') return 0.85;
      if (ticker.long_term_trend === 'bearish') return 0.15;
      if (ticker.long_term_trend === 'mixed') return 0.5;
      return null;
    }
  }

  // Compute all inline color values for one card
  function cardPalette(t) {
    if (t === null) return null;
    const [r, g, b] = rdylgn(t);
    const rgb = `rgb(${r},${g},${b})`;
    return {
      bg:     `linear-gradient(135deg, color-mix(in srgb, ${rgb} 28%, var(--bg)) 0%, color-mix(in srgb, ${rgb} 15%, var(--bg)) 100%)`,
      border: `rgba(${r},${g},${b},0.42)`,
      fg:     `color-mix(in srgb, ${rgb} 75%, var(--text))`,
      fgDim:  `rgba(${r},${g},${b},0.55)`,
      fill:   `rgb(${r},${g},${b})`,
    };
  }

  // ── Legend gradient bar (canvas, left=green buy, right=red sell) ────────────
  function paintLegend() {
    const canvas = document.getElementById('legend-bar');
    const ctx    = canvas.getContext('2d');
    const W      = canvas.offsetWidth || 340;
    canvas.width = W * devicePixelRatio;
    canvas.height = 8 * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    // left=green (t=1), right=red (t=0) — reverse the stops
    for (let i = 0; i <= 10; i++) {
      const [r, g, b] = RDYLGN[10 - i];
      grad.addColorStop(i / 10, `rgb(${r},${g},${b})`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(0, 0, W, 8, 4);
    ctx.fill();

    // Labels and ticks
    if (activeIndicator === 'rsi') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>0</span><span>30</span><span>50</span><span>70</span><span>100</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Oversold (buy)';
      document.getElementById('legend-lbl-mid').textContent  = 'Neutral';
      document.getElementById('legend-lbl-sell').textContent = 'Overbought (sell)';
    } else if (activeIndicator === 'vwap') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>−30%</span><span>−15%</span><span>0%</span><span>+15%</span><span>+30%</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Below VWAP (buy)';
      document.getElementById('legend-lbl-mid').textContent  = 'At VWAP';
      document.getElementById('legend-lbl-sell').textContent = 'Above VWAP (sell)';
    } else {
      document.getElementById('legend-ticks').innerHTML =
        '<span>Bullish</span><span></span><span>Mixed</span><span></span><span>Bearish</span>';
      document.getElementById('legend-lbl-buy').textContent  = '50-day above 200-day';
      document.getElementById('legend-lbl-mid').textContent  = 'Mixed';
      document.getElementById('legend-lbl-sell').textContent = '50-day below 200-day';
    }
  }

  // ── State ───────────────────────────────────────────────────────────────────
  let allTickers    = [];
  let activeIndicator = 'rsi';
  let activeClasses   = new Set(['all']);
  let allClasses      = [];
  let csrfToken       = '';
  let detailRecord    = null;
  let detailRange     = '5y';
  let detailTrigger   = null;

  // ── Data load ────────────────────────────────────────────────────────────────
  async function loadData() {
    const btn = document.getElementById('reload-btn');
    btn.classList.add('spinning');
    try {
      const res  = await fetch('/api/tradility-analysis');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      csrfToken = data.csrf_token || '';
      allTickers = data.tickers || [];
      if (data.generated_at) {
        const d = new Date(data.generated_at);
        const meta = document.getElementById('meta-generated');
        const stale = Boolean(data.freshness && data.freshness.stale);
        meta.textContent = `${stale ? '⚠ Stale — ' : ''}Updated ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
        meta.classList.toggle('stale', stale);
      }
      const classSet = new Set();
      for (const t of allTickers) if (t.asset_class) classSet.add(t.asset_class);
      allClasses = [...classSet].sort();
      buildClassFilters();
      renderGrid();
    } catch (err) {
      document.getElementById('grid-container').innerHTML =
        `<div class="error-card">⚠ Could not load analysis: ${err.message}</div>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  async function runRefresh() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    btn.disabled = true;
    try {
      if (!csrfToken) await loadData();
      const res = await fetch('/api/tradility-refresh', {
        method: 'POST',
        headers: {'X-CSRF-Token': csrfToken},
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const meta = document.getElementById('meta-generated');
      meta.textContent = 'Refresh started… reload in a few minutes';
      meta.classList.remove('stale');
    } catch (err) {
      const meta = document.getElementById('meta-generated');
      meta.textContent = `Refresh failed: ${err.message}`;
      meta.classList.add('stale');
    } finally {
      btn.classList.remove('spinning');
      btn.disabled = false;
    }
  }

  // ── Indicator switch ─────────────────────────────────────────────────────────
  function setIndicator(ind) {
    activeIndicator = ind;
    document.querySelectorAll('.ind-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.ind === ind));
    paintLegend();
    renderGrid();
  }

  // ── Class filter ──────────────────────────────────────────────────────────────
  function buildClassFilters() {
    const container = document.getElementById('class-filters');
    container.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'filter-btn active';
    all.textContent = 'All';
    all.onclick = () => toggleClass('all');
    container.appendChild(all);
    for (const cls of allClasses) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cls;
      btn.dataset.cls = cls;
      btn.onclick = () => toggleClass(cls);
      container.appendChild(btn);
    }
  }

  function toggleClass(cls) {
    if (cls === 'all') {
      activeClasses = new Set(['all']);
    } else {
      activeClasses.delete('all');
      activeClasses.has(cls) ? activeClasses.delete(cls) : activeClasses.add(cls);
      if (activeClasses.size === 0) activeClasses.add('all');
    }
    document.querySelectorAll('.filter-btn').forEach(b => {
      const isAll = !b.dataset.cls;
      b.classList.toggle('active',
        (isAll && activeClasses.has('all')) || (b.dataset.cls && activeClasses.has(b.dataset.cls)));
    });
    renderGrid();
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderGrid() {
    const query = document.getElementById('search-input').value.trim().toUpperCase();
    const sort  = document.getElementById('sort-select').value;

    let tickers = allTickers.filter(t => {
      if (query && !t.ticker.includes(query) && !(t.name || '').toUpperCase().includes(query))
        return false;
      if (!activeClasses.has('all') && !activeClasses.has(t.asset_class))
        return false;
      return true;
    });

    // Attach computed t value for sorting/stats
    tickers = tickers.map(t => ({ ...t, _t: colormapT(t) }));

    tickers.sort((a, b) => {
      if (sort === 'ticker')      return a.ticker.localeCompare(b.ticker);
      if (sort === 'price-desc')  return (b.last_price ?? 0) - (a.last_price ?? 0);
      if (sort === 'value-desc')  return (a._t ?? -1) - (b._t ?? -1); // low t (sell) first
      // value-asc: high t (buy/green) first; nulls last
      const at = a._t ?? -1, bt = b._t ?? -1;
      return bt !== at ? bt - at : a.ticker.localeCompare(b.ticker);
    });

    // Stats: bucket by approximate signal for count display
    let buyN = 0, sellN = 0, neutralN = 0, noDataN = 0;
    for (const t of tickers) {
      if (t._t === null) { noDataN++; continue; }
      if (t._t > 0.6)       buyN++;
      else if (t._t < 0.4)  sellN++;
      else                   neutralN++;
    }
    const [buyR, buyG, buyB]    = rdylgn(0.85);
    const [sellR, sellG, sellB] = rdylgn(0.10);
    const [midR, midG, midB]    = rdylgn(0.50);
    const positiveLabel = activeIndicator === 'trend' ? 'bullish' : 'buy';
    const negativeLabel = activeIndicator === 'trend' ? 'bearish' : 'sell';
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><strong>${tickers.length}</strong> shown</div>
      <div class="stat"><strong style="color:rgb(${buyR},${buyG},${buyB})">${buyN}</strong> ${positiveLabel}</div>
      <div class="stat"><strong style="color:rgb(${sellR},${sellG},${sellB})">${sellN}</strong> ${negativeLabel}</div>
      <div class="stat"><strong style="color:rgb(${midR},${midG},${midB})">${neutralN}</strong> neutral</div>
      ${noDataN ? `<div class="stat"><strong style="color:var(--muted-fg)">${noDataN}</strong> no data</div>` : ''}
    `;

    if (!tickers.length) {
      document.getElementById('grid-container').innerHTML =
        '<div class="state-msg">No tickers match.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'ticker-grid';

    for (const t of tickers) {
      const pal   = cardPalette(t._t);
      const card  = document.createElement('button');
      card.type = 'button';
      card.dataset.ticker = t.ticker;
      card.className = 'ticker-card' + (pal ? '' : ' no-data');
      card.disabled = !t.detail_available;
      if (t.detail_available) {
        card.title = `Open ${t.ticker} historical performance`;
        card.addEventListener('click', () => openTickerDetail(t.ticker, card));
      }

      if (pal) {
        card.style.background   = pal.bg;
        card.style.borderColor  = pal.border;
      }

      const price = t.last_price != null ? fmtPrice(t.last_price) : '—';

      let indLabel = '', indValue = '', extraHtml = '';
      if (activeIndicator === 'rsi') {
        indLabel = 'RSI 14';
        indValue = t.rsi_14 != null ? t.rsi_14.toFixed(1) : '—';
        if (t.rsi_14 != null) {
          const pct  = Math.min(100, Math.max(0, t.rsi_14));
          const fill = pal ? `background:${pal.fill}` : '';
          extraHtml = `<div class="rsi-bar-wrap">
            <div class="rsi-bar-fill" style="width:${pct}%;${fill}"></div>
          </div>`;
        }
      } else if (activeIndicator === 'vwap') {
        indLabel = 'VWAP 20';
        indValue = t.vwap_20 != null ? fmtPrice(t.vwap_20) : '—';
        if (t.last_price != null && t.vwap_20 != null && t.vwap_20 !== 0) {
          const delta = (t.last_price - t.vwap_20) / t.vwap_20 * 100;
          const sign  = delta >= 0 ? '+' : '';
          const col   = pal ? `color:${pal.fg}` : '';
          extraHtml = `<div class="vwap-delta" style="${col}">${sign}${delta.toFixed(2)}% vs VWAP</div>`;
        }
      } else {
        indLabel = 'SMA 50 / 200';
        indValue = t.sma_50 != null && t.sma_200 != null
          ? `${fmtPrice(t.sma_50)} / ${fmtPrice(t.sma_200)}` : '—';
        if (t.sma_50 != null && t.sma_200 != null && t.sma_200 !== 0) {
          const spread = (t.sma_50 - t.sma_200) / t.sma_200 * 100;
          const sign = spread >= 0 ? '+' : '';
          const col = pal ? `color:${pal.fg}` : '';
          extraHtml = `<div class="vwap-delta" style="${col}">${sign}${spread.toFixed(2)}% 50/200 spread</div>`;
        }
      }

      // Badge label
      let badge = '—';
      if (t._t !== null) {
        if (activeIndicator === 'rsi') {
          badge = t._t > 0.7 ? 'Oversold' : t._t < 0.3 ? 'Overbought' : 'Neutral';
        } else if (activeIndicator === 'vwap') {
          badge = t._t > 0.55 ? 'Below' : t._t < 0.45 ? 'Above' : 'At VWAP';
        } else {
          badge = t.long_term_trend === 'bullish' ? 'Bullish'
            : t.long_term_trend === 'bearish' ? 'Bearish' : 'Mixed';
        }
      } else {
        badge = t.fetch_status === 'error' ? 'No data' : '—';
      }

      const badgeBg  = pal ? `background:${pal.fgDim};border-color:${pal.border}` : '';
      const badgeFg  = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const tickFg   = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const indValFg = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';

      card.innerHTML = `
        <div class="signal-badge" style="${badgeBg};${badgeFg}">${badge}</div>
        <div class="card-ticker" style="${tickFg}">${esc(t.ticker)}</div>
        <div class="card-asset">${esc(t.asset_class || '')}${t.name ? ' · ' + esc(t.name) : ''}</div>
        <div class="card-price">${price}</div>
        <div class="card-indicator">
          <span class="card-ind-label">${indLabel}</span>
          <span class="card-ind-value" style="${indValFg}">${indValue}</span>
        </div>
        ${extraHtml}
        ${t.detail_available ? '<div class="card-detail-cue">View chart and rating →</div>' : ''}
      `;
      grid.appendChild(card);
    }

    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    container.appendChild(grid);
  }

  // ── Historical-performance detail ───────────────────────────────────────────
  async function openTickerDetail(ticker, trigger) {
    detailTrigger = trigger || null;
    detailRecord = null;
    detailRange = '5y';
    const overlay = document.getElementById('detail-overlay');
    overlay.hidden = false;
    document.body.classList.add('detail-open');
    document.getElementById('detail-dialog-title').textContent = ticker;
    document.getElementById('detail-dialog-name').textContent = '';
    document.getElementById('detail-dialog-price').textContent = '';
    document.getElementById('detail-content').innerHTML =
      '<div class="detail-loading">Loading historical performance…</div>';
    overlay.querySelector('.detail-close').focus();

    try {
      const res = await fetch(`/api/tradility-analysis/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailRecord = data.ticker;
      renderTickerDetail(data);
    } catch (err) {
      document.getElementById('detail-content').innerHTML =
        `<div class="error-card">Could not load ${esc(ticker)} details: ${esc(err.message)}</div>`;
    }
  }

  function closeTickerDetail() {
    document.getElementById('detail-overlay').hidden = true;
    document.body.classList.remove('detail-open');
    detailRecord = null;
    if (detailTrigger) detailTrigger.focus();
    detailTrigger = null;
  }

  function ratingLabel(value) {
    return String(value || 'unknown').split('_').map(part =>
      part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
  }

  function ratingClass(value) {
    if (value === 'buy' || value === 'strong_buy') return 'rating-positive';
    if (value === 'sell' || value === 'strong_sell') return 'rating-negative';
    return 'rating-neutral';
  }

  function formatReturn(value) {
    if (value == null || !Number.isFinite(Number(value))) return '—';
    const number = Number(value);
    return `${number >= 0 ? '+' : ''}${number.toFixed(2)}%`;
  }

  function returnClass(value) {
    if (value == null || Number(value) === 0) return '';
    return Number(value) > 0 ? 'rating-positive' : 'rating-negative';
  }

  function renderTickerDetail(data) {
    const t = data.ticker;
    const returns = t.returns || {};
    const components = t.technical_components || {};
    const position = Math.min(100, Math.max(0, Number(t.range_position_52w ?? 0)));
    const returnLabels = [['1m','1M'], ['3m','3M'], ['1y','1Y'], ['3y','3Y'], ['5y','5Y']];
    document.getElementById('detail-dialog-title').textContent = t.ticker || 'Stock details';
    document.getElementById('detail-dialog-name').textContent =
      [t.asset_class, t.name].filter(Boolean).join(' · ');
    document.getElementById('detail-dialog-price').textContent = fmtPrice(t.last_price);

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-layout">
        <div class="detail-stack">
          <section class="detail-card">
            <div class="detail-card-title">Historical close</div>
            <div class="detail-range-buttons">
              ${returnLabels.map(([key, label]) =>
                `<button type="button" class="detail-range-btn ${key === detailRange ? 'active' : ''}" data-range="${key}" onclick="setDetailRange('${key}')">${label}</button>`
              ).join('')}
            </div>
            <div class="detail-chart-wrap"><canvas id="detail-chart"></canvas></div>
            <div class="detail-chart-summary" id="detail-chart-summary"></div>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">Period performance</div>
            <div class="return-grid">
              ${returnLabels.map(([key, label]) => `<div class="return-cell">
                <span class="return-label">${label}</span>
                <span class="return-value ${returnClass(returns[key])}">${formatReturn(returns[key])}</span>
              </div>`).join('')}
            </div>
          </section>
        </div>
        <div class="detail-stack">
          <section class="detail-card">
            <div class="detail-card-title">Technical market rating</div>
            <div class="detail-rating">
              <span class="detail-rating-label ${ratingClass(t.technical_rating)}">${esc(ratingLabel(t.technical_rating))}</span>
              <strong>${Number(t.technical_score ?? 0) >= 0 ? '+' : ''}${Number(t.technical_score ?? 0)} / 4</strong>
            </div>
            <div class="component-list">
              <div class="component-row"><span>Long-term trend</span><strong>${Number(components.long_term_trend ?? 0) >= 0 ? '+' : ''}${Number(components.long_term_trend ?? 0)}</strong></div>
              <div class="component-row"><span>VWAP momentum</span><strong>${Number(components.vwap_momentum ?? 0) >= 0 ? '+' : ''}${Number(components.vwap_momentum ?? 0)}</strong></div>
              <div class="component-row"><span>RSI reversion</span><strong>${Number(components.rsi_reversion ?? 0) >= 0 ? '+' : ''}${Number(components.rsi_reversion ?? 0)}</strong></div>
            </div>
            <p class="detail-disclaimer">Rule-based technical composite—not analyst consensus or investment advice. Authorized analyst ratings remain a separate planned data source.</p>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">52-week range</div>
            <div class="range-track"><span class="range-marker" style="left:${position}%"></span></div>
            <div class="range-labels"><span>${fmtPrice(t.low_52w)}</span><span>${fmtPrice(t.high_52w)}</span></div>
            <div class="component-row" style="margin-top:8px"><span>Current position</span><strong>${t.range_position_52w == null ? '—' : Number(t.range_position_52w).toFixed(1) + '%'}</strong></div>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">Indicators and provenance</div>
            <div class="component-list">
              <div class="detail-meta-row"><span>RSI 14</span><strong>${t.rsi_14 == null ? '—' : Number(t.rsi_14).toFixed(1)} · ${esc(t.rsi_14_signal || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>VWAP 20</span><strong>${fmtPrice(t.vwap_20)} · ${esc(t.vwap_20_signal || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Trend</span><strong>${esc(t.long_term_trend || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Source</span><strong>${esc(t.data_source || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Coverage</span><strong>${esc(t.period_start || '—')} → ${esc(t.period_end || '—')}</strong></div>
              <div class="detail-meta-row"><span>Generated</span><strong>${data.generated_at ? new Date(data.generated_at).toLocaleString() : '—'}</strong></div>
            </div>
            ${t.fallback_reason ? `<p class="detail-disclaimer">Fallback: ${esc(t.fallback_reason)}</p>` : ''}
          </section>
        </div>
      </div>`;
    requestAnimationFrame(drawDetailChart);
  }

  function setDetailRange(range) {
    detailRange = range;
    document.querySelectorAll('.detail-range-btn').forEach(button =>
      button.classList.toggle('active', button.dataset.range === range));
    drawDetailChart();
  }

  function detailPointsForRange() {
    const points = (detailRecord && detailRecord.price_history || [])
      .filter(point => point && point.date && Number.isFinite(Number(point.close)))
      .map(point => ({date: new Date(`${point.date}T00:00:00Z`), close: Number(point.close)}));
    if (!points.length || detailRange === '5y') return points;
    const end = new Date(points[points.length - 1].date);
    const start = new Date(end);
    if (detailRange === '1m') start.setUTCMonth(start.getUTCMonth() - 1);
    if (detailRange === '3m') start.setUTCMonth(start.getUTCMonth() - 3);
    if (detailRange === '1y') start.setUTCFullYear(start.getUTCFullYear() - 1);
    if (detailRange === '3y') start.setUTCFullYear(start.getUTCFullYear() - 3);
    return points.filter(point => point.date >= start);
  }

  function drawDetailChart() {
    const canvas = document.getElementById('detail-chart');
    if (!canvas || !detailRecord) return;
    const points = detailPointsForRange();
    const summary = document.getElementById('detail-chart-summary');
    if (points.length < 2) {
      summary.textContent = 'Not enough history for this range.';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(300, rect.width);
    const height = Math.max(220, rect.height);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const pad = {left: 58, right: 12, top: 12, bottom: 28};
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const prices = points.map(point => point.close);
    let min = Math.min(...prices), max = Math.max(...prices);
    const pricePad = Math.max((max - min) * 0.08, max * 0.005, 0.01);
    min -= pricePad; max += pricePad;
    const t0 = points[0].date.getTime(), t1 = points[points.length - 1].date.getTime();
    const x = point => pad.left + (point.date.getTime() - t0) / Math.max(1, t1 - t0) * plotW;
    const y = point => pad.top + (max - point.close) / Math.max(0.000001, max - min) * plotH;
    const styles = getComputedStyle(document.documentElement);
    const muted = styles.getPropertyValue('--muted').trim() || '#8b949e';
    const border = styles.getPropertyValue('--border').trim() || '#30363d';
    const rising = points[points.length - 1].close >= points[0].close;
    const line = styles.getPropertyValue(rising ? '--green' : '--red').trim() || (rising ? '#3fb950' : '#f85149');

    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const yy = pad.top + plotH * i / 4;
      const value = max - (max - min) * i / 4;
      ctx.strokeStyle = border; ctx.globalAlpha = 0.65; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = muted;
      ctx.fillText(fmtPrice(value), pad.left - 7, yy);
    }

    ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.lineTo(x(points[points.length - 1]), pad.top + plotH);
    ctx.lineTo(x(points[0]), pad.top + plotH);
    ctx.closePath(); ctx.fillStyle = line; ctx.globalAlpha = 0.12; ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

    ctx.fillStyle = muted; ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left'; ctx.fillText(points[0].date.toLocaleDateString(), pad.left, height - 3);
    ctx.textAlign = 'right'; ctx.fillText(points[points.length - 1].date.toLocaleDateString(), width - pad.right, height - 3);
    const change = (points[points.length - 1].close - points[0].close) / points[0].close * 100;
    summary.innerHTML = `<span>${points.length.toLocaleString()} observations</span><strong class="${returnClass(change)}">${formatReturn(change)}</strong>`;
  }

  function fmtPrice(v) {
    if (v == null) return '—';
    if (v >= 1000) return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (v >= 1)    return '$' + v.toFixed(2);
    if (v >= 0.01) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Repaint legend after fonts/layout settle
  window.addEventListener('load', paintLegend);
  window.addEventListener('resize', () => {
    paintLegend();
    if (detailRecord) drawDetailChart();
  });
  document.getElementById('detail-overlay').addEventListener('click', event => {
    if (event.target.id === 'detail-overlay') closeTickerDetail();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !document.getElementById('detail-overlay').hidden) {
      closeTickerDetail();
    }
  });

  loadData().then(() => {
    const requestedTicker = new URLSearchParams(window.location.search).get('ticker');
    if (!requestedTicker) return;
    const normalized = requestedTicker.toUpperCase();
    const trigger = [...document.querySelectorAll('.ticker-card')]
      .find(card => card.dataset.ticker === normalized && !card.disabled);
    if (trigger) openTickerDetail(normalized, trigger);
  });
</script>
</body>
