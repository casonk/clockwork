<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>Tradility — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --surface3:   #191c2a;
      --border:     #2e3250;
      --accent:     #5b7fff;
      --accent-dim: #2d3f8a;
      --green:      #3ecf6e;
      --green-dim:  #1a4d30;
      --red:        #e05252;
      --red-dim:    #4d1a1a;
      --yellow:     #e0b832;
      --yellow-dim: #3d3000;
      --muted-fg:   #8890b0;
      --muted-dim:  #1e2133;
      --text:       #e2e4f0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-link { font-size: 20px; text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
    .back-link:hover { opacity: 1; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
    .header-meta { font-size: 11px; color: var(--muted-fg); white-space: nowrap; }

    /* ── Controls bar ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted-fg); white-space: nowrap; }

    /* Indicator toggle pills */
    .indicator-group { display: flex; gap: 4px; }
    .ind-btn {
      padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .ind-btn.active {
      background: var(--accent-dim); color: var(--accent); border-color: var(--accent);
    }
    .ind-btn:hover:not(.active) { border-color: var(--muted-fg); color: var(--text); }

    /* Asset class filter */
    .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted-fg);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--muted-fg); }
    .filter-btn:hover:not(.active) { border-color: var(--muted-fg); }

    /* Sort control */
    .sort-select {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* Search */
    .search-input {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; outline: none; width: 130px;
    }
    .search-input:focus { border-color: var(--accent); width: 200px; }
    .search-input::placeholder { color: var(--muted-fg); }
    .search-input { transition: width 0.2s; }

    /* Refresh btn */
    .refresh-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted-fg); }
    .refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon { display: inline-block; }

    /* ── Legend ── */
    .legend {
      display: flex; gap: 14px; padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface3); flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted-fg); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .legend-dot.buy    { background: var(--green); }
    .legend-dot.sell   { background: var(--red); }
    .legend-dot.neutral { background: var(--yellow); }
    .legend-dot.unknown { background: var(--muted-dim); border: 1px solid var(--border); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 16px; padding: 8px 20px;
      background: var(--surface3); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .stat { font-size: 11px; color: var(--muted-fg); }
    .stat strong { font-weight: 700; }
    .stat.buy strong   { color: var(--green); }
    .stat.sell strong  { color: var(--red); }
    .stat.neutral strong { color: var(--yellow); }
    .stat.total strong { color: var(--text); }
    .stat.errors strong { color: var(--muted-fg); }

    /* ── Grid ── */
    main { padding: 16px 20px 80px; }

    .ticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .ticker-card {
      border-radius: 9px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      cursor: default;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      overflow: hidden;
    }
    .ticker-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }

    /* Color themes per signal */
    .ticker-card.sig-buy {
      background: linear-gradient(135deg, var(--green-dim) 0%, #121e18 100%);
      border-color: #2a7a4a;
    }
    .ticker-card.sig-sell {
      background: linear-gradient(135deg, var(--red-dim) 0%, #1c1010 100%);
      border-color: #7a2a2a;
    }
    .ticker-card.sig-neutral {
      background: linear-gradient(135deg, var(--yellow-dim) 0%, #18160c 100%);
      border-color: #5a4a10;
    }
    .ticker-card.sig-unknown {
      background: var(--surface);
      border-color: var(--border);
    }
    .ticker-card.sig-error {
      background: var(--surface);
      border-color: var(--border);
      opacity: 0.5;
    }

    .card-ticker {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sig-buy  .card-ticker { color: var(--green); }
    .sig-sell .card-ticker { color: var(--red); }
    .sig-neutral .card-ticker { color: var(--yellow); }
    .sig-unknown .card-ticker { color: var(--muted-fg); }
    .sig-error .card-ticker { color: var(--muted-fg); }

    .card-asset { font-size: 10px; color: var(--muted-fg); margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-price {
      font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text);
    }

    .card-indicator {
      font-size: 11px; display: flex; align-items: center; justify-content: space-between;
      margin-top: 3px;
    }
    .card-ind-label { color: var(--muted-fg); }
    .card-ind-value { font-weight: 700; font-family: ui-monospace, monospace; font-size: 11px; }
    .sig-buy  .card-ind-value { color: var(--green); }
    .sig-sell .card-ind-value { color: var(--red); }
    .sig-neutral .card-ind-value { color: var(--yellow); }
    .sig-unknown .card-ind-value { color: var(--muted-fg); }

    /* Signal badge */
    .signal-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px;
    }
    .sig-buy    .signal-badge { background: var(--green-dim); color: var(--green); border: 1px solid #2a7a4a; }
    .sig-sell   .signal-badge { background: var(--red-dim);   color: var(--red);   border: 1px solid #7a2a2a; }
    .sig-neutral .signal-badge { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #5a4a10; }
    .sig-unknown .signal-badge { background: var(--muted-dim); color: var(--muted-fg); border: 1px solid var(--border); }
    .sig-error   .signal-badge { background: var(--muted-dim); color: var(--muted-fg); border: 1px solid var(--border); }

    /* RSI mini-bar */
    .rsi-bar-wrap {
      margin-top: 6px; height: 4px; background: var(--muted-dim);
      border-radius: 2px; overflow: hidden;
    }
    .rsi-bar-fill {
      height: 100%; border-radius: 2px; transition: width 0.4s ease;
    }
    .sig-buy    .rsi-bar-fill { background: var(--green); }
    .sig-sell   .rsi-bar-fill { background: var(--red); }
    .sig-neutral .rsi-bar-fill { background: var(--yellow); }

    /* VWAP delta badge */
    .vwap-delta {
      font-size: 10px; font-weight: 600; margin-top: 3px;
    }
    .vwap-delta.above { color: var(--red); }
    .vwap-delta.below { color: var(--green); }
    .vwap-delta.at    { color: var(--muted-fg); }

    /* Loading / empty */
    .state-msg {
      text-align: center; color: var(--muted-fg); padding: 60px 24px; font-size: 14px;
    }

    /* Error card */
    .error-card {
      border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); padding: 16px;
      color: var(--red); font-size: 13px; margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="back-link" title="Home">←</a>
  <span class="header-title">📈 Tradility</span>
  <span class="header-meta" id="meta-generated"></span>
</header>

<div class="controls">
  <span class="controls-label">Indicator</span>
  <div class="indicator-group">
    <button class="ind-btn active" data-ind="rsi"  onclick="setIndicator('rsi')">RSI 14</button>
    <button class="ind-btn"        data-ind="vwap" onclick="setIndicator('vwap')">VWAP 20</button>
  </div>

  <span class="controls-label" style="margin-left:8px">Class</span>
  <div class="filter-group" id="class-filters"></div>

  <input class="search-input" id="search-input" type="text" placeholder="Search ticker…" oninput="renderGrid()">

  <select class="sort-select" id="sort-select" onchange="renderGrid()">
    <option value="signal">Sort: signal</option>
    <option value="ticker">Sort: ticker A–Z</option>
    <option value="rsi-asc">Sort: RSI ↑</option>
    <option value="rsi-desc">Sort: RSI ↓</option>
    <option value="price-desc">Sort: price ↓</option>
  </select>

  <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
    <span class="refresh-icon">↻</span> Refresh
  </button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot buy"></div> Buy / Oversold</div>
  <div class="legend-item"><div class="legend-dot sell"></div> Sell / Overbought</div>
  <div class="legend-item"><div class="legend-dot neutral"></div> Neutral / At VWAP</div>
  <div class="legend-item"><div class="legend-dot unknown"></div> No data</div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<main>
  <div id="grid-container">
    <div class="state-msg">Loading…</div>
  </div>
</main>

<script>
  let allTickers = [];
  let activeIndicator = 'rsi';
  let activeClasses = new Set(['all']);
  let allClasses = [];

  // ── Data load ──────────────────────────────────────────────────────────────
  async function loadData() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    try {
      const res = await fetch('/api/tradility-analysis');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      allTickers = data.tickers || [];

      // Generated-at meta
      if (data.generated_at) {
        const d = new Date(data.generated_at);
        document.getElementById('meta-generated').textContent =
          `Updated ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      }

      // Build class list
      const classSet = new Set();
      for (const t of allTickers) if (t.asset_class) classSet.add(t.asset_class);
      allClasses = [...classSet].sort();
      buildClassFilters();
      renderGrid();
    } catch (err) {
      document.getElementById('grid-container').innerHTML =
        `<div class="error-card">⚠ Could not load analysis: ${err.message}</div>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  // ── Indicator toggle ───────────────────────────────────────────────────────
  function setIndicator(ind) {
    activeIndicator = ind;
    document.querySelectorAll('.ind-btn').forEach(b => b.classList.toggle('active', b.dataset.ind === ind));
    updateLegend();
    renderGrid();
  }

  function updateLegend() {
    const items = document.querySelectorAll('.legend .legend-item');
    if (activeIndicator === 'rsi') {
      items[0].querySelector('.legend-dot').className = 'legend-dot buy';
      items[0].childNodes[1].textContent = ' Buy / Oversold (≤30)';
      items[1].querySelector('.legend-dot').className = 'legend-dot sell';
      items[1].childNodes[1].textContent = ' Sell / Overbought (≥70)';
      items[2].querySelector('.legend-dot').className = 'legend-dot neutral';
      items[2].childNodes[1].textContent = ' Neutral (30–70)';
    } else {
      items[0].querySelector('.legend-dot').className = 'legend-dot buy';
      items[0].childNodes[1].textContent = ' Buy / Price Below VWAP';
      items[1].querySelector('.legend-dot').className = 'legend-dot sell';
      items[1].childNodes[1].textContent = ' Sell / Price Above VWAP';
      items[2].querySelector('.legend-dot').className = 'legend-dot neutral';
      items[2].childNodes[1].textContent = ' Neutral / At VWAP';
    }
  }

  // ── Class filter ──────────────────────────────────────────────────────────
  function buildClassFilters() {
    const container = document.getElementById('class-filters');
    container.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'filter-btn active';
    all.textContent = 'All';
    all.onclick = () => toggleClass('all');
    container.appendChild(all);
    for (const cls of allClasses) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cls;
      btn.dataset.cls = cls;
      btn.onclick = () => toggleClass(cls);
      container.appendChild(btn);
    }
  }

  function toggleClass(cls) {
    if (cls === 'all') {
      activeClasses = new Set(['all']);
    } else {
      activeClasses.delete('all');
      if (activeClasses.has(cls)) {
        activeClasses.delete(cls);
        if (activeClasses.size === 0) activeClasses.add('all');
      } else {
        activeClasses.add(cls);
      }
    }
    document.querySelectorAll('.filter-btn').forEach(b => {
      const isAll = !b.dataset.cls;
      const isCls = b.dataset.cls && activeClasses.has(b.dataset.cls);
      b.classList.toggle('active', (isAll && activeClasses.has('all')) || isCls);
    });
    renderGrid();
  }

  // ── Signal resolution ──────────────────────────────────────────────────────
  function getSignal(ticker) {
    if (ticker.fetch_status === 'error') return 'error';
    if (activeIndicator === 'rsi') {
      return ticker.rsi_14_signal || 'unknown';
    } else {
      return ticker.vwap_20_signal || 'unknown';
    }
  }

  // oversold/below → buy, overbought/above → sell, neutral/at → neutral
  function normalizeSignal(raw) {
    if (raw === 'oversold' || raw === 'below')   return 'buy';
    if (raw === 'overbought' || raw === 'above')  return 'sell';
    if (raw === 'neutral' || raw === 'at')        return 'neutral';
    if (raw === 'error')                          return 'error';
    return 'unknown';
  }

  const SIGNAL_ORDER = { buy: 0, sell: 1, neutral: 2, unknown: 3, error: 4 };

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderGrid() {
    const query = document.getElementById('search-input').value.trim().toUpperCase();
    const sort  = document.getElementById('sort-select').value;

    let tickers = allTickers.filter(t => {
      if (query && !t.ticker.includes(query) && !(t.name || '').toUpperCase().includes(query)) return false;
      if (!activeClasses.has('all') && !activeClasses.has(t.asset_class)) return false;
      return true;
    });

    // Sort
    tickers = [...tickers].sort((a, b) => {
      if (sort === 'ticker')     return a.ticker.localeCompare(b.ticker);
      if (sort === 'rsi-asc')    return (a.rsi_14 ?? 999) - (b.rsi_14 ?? 999);
      if (sort === 'rsi-desc')   return (b.rsi_14 ?? -1) - (a.rsi_14 ?? -1);
      if (sort === 'price-desc') return (b.last_price ?? 0) - (a.last_price ?? 0);
      // signal: buy first, then sell, neutral, unknown, error
      const sa = SIGNAL_ORDER[normalizeSignal(getSignal(a))] ?? 9;
      const sb = SIGNAL_ORDER[normalizeSignal(getSignal(b))] ?? 9;
      return sa !== sb ? sa - sb : a.ticker.localeCompare(b.ticker);
    });

    // Stats
    const counts = { buy: 0, sell: 0, neutral: 0, unknown: 0, error: 0 };
    for (const t of tickers) counts[normalizeSignal(getSignal(t))]++;
    const statsBar = document.getElementById('stats-bar');
    statsBar.innerHTML = `
      <div class="stat total"><strong>${tickers.length}</strong> shown</div>
      <div class="stat buy"><strong>${counts.buy}</strong> buy</div>
      <div class="stat sell"><strong>${counts.sell}</strong> sell</div>
      <div class="stat neutral"><strong>${counts.neutral}</strong> neutral</div>
      ${counts.error ? `<div class="stat errors"><strong>${counts.error}</strong> no data</div>` : ''}
    `;

    if (tickers.length === 0) {
      document.getElementById('grid-container').innerHTML = '<div class="state-msg">No tickers match.</div>';
      return;
    }

    const frag = document.createDocumentFragment();
    const grid = document.createElement('div');
    grid.className = 'ticker-grid';

    for (const t of tickers) {
      const rawSig = getSignal(t);
      const sig    = normalizeSignal(rawSig);
      const card   = document.createElement('div');
      card.className = `ticker-card sig-${sig}`;

      // Price formatting
      const price = t.last_price != null ? formatPrice(t.last_price) : '—';

      // Per-indicator values
      let indLabel = '', indValue = '', extraHtml = '';
      if (activeIndicator === 'rsi') {
        const rsiVal = t.rsi_14 != null ? t.rsi_14.toFixed(1) : '—';
        indLabel = 'RSI 14';
        indValue = rsiVal;
        const pct = t.rsi_14 != null ? Math.min(100, Math.max(0, t.rsi_14)) : null;
        if (pct !== null) {
          extraHtml = `<div class="rsi-bar-wrap"><div class="rsi-bar-fill" style="width:${pct}%"></div></div>`;
        }
      } else {
        const vwapVal = t.vwap_20 != null ? formatPrice(t.vwap_20) : '—';
        indLabel = 'VWAP 20';
        indValue = vwapVal;
        if (t.last_price != null && t.vwap_20 != null && t.vwap_20 !== 0) {
          const delta = ((t.last_price - t.vwap_20) / t.vwap_20 * 100);
          const sign  = delta >= 0 ? '+' : '';
          const cls   = rawSig === 'above' ? 'above' : rawSig === 'below' ? 'below' : 'at';
          extraHtml = `<div class="vwap-delta ${cls}">${sign}${delta.toFixed(2)}% vs VWAP</div>`;
        }
      }

      // Signal badge text
      const badgeText = sig === 'buy' ? (activeIndicator === 'rsi' ? 'Oversold' : 'Below')
                      : sig === 'sell' ? (activeIndicator === 'rsi' ? 'Overbought' : 'Above')
                      : sig === 'neutral' ? (activeIndicator === 'rsi' ? 'Neutral' : 'At VWAP')
                      : sig === 'error' ? 'No data'
                      : '—';

      card.innerHTML = `
        <div class="signal-badge">${badgeText}</div>
        <div class="card-ticker">${esc(t.ticker)}</div>
        <div class="card-asset">${esc(t.asset_class || '')}${t.name ? ' · ' + esc(t.name) : ''}</div>
        <div class="card-price">${price}</div>
        <div class="card-indicator">
          <span class="card-ind-label">${indLabel}</span>
          <span class="card-ind-value">${indValue}</span>
        </div>
        ${extraHtml}
      `;
      grid.appendChild(card);
    }

    frag.appendChild(grid);
    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    container.appendChild(frag);
  }

  function formatPrice(v) {
    if (v == null) return '—';
    if (v >= 1000) return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (v >= 1)    return '$' + v.toFixed(2);
    if (v >= 0.01) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadData();
</script>
</body>
</html>
