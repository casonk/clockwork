<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>Tradility — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --surface3: color-mix(in srgb, var(--bg) 50%, var(--surface)); --muted-fg: var(--muted); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--font-size);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
    .header-meta { font-size: 11px; color: var(--muted-fg); white-space: nowrap; }
    .header-meta.stale { color: var(--red); font-weight: 700; }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--muted-fg); white-space: nowrap;
    }
    .indicator-group { display: flex; gap: 4px; }
    .ind-row { display: flex; justify-content: space-between; gap: 8px; }
    .ind-btn {
      padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .ind-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .ind-btn:hover:not(.active) { border-color: var(--muted-fg); color: var(--text); }

    .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted-fg);
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--muted-fg); }
    .filter-btn:hover:not(.active) { border-color: var(--muted-fg); }

    .sort-select {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    .search-input {
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      font-size: 12px; outline: none; width: 130px; transition: width 0.2s;
    }
    .search-input:focus { border-color: var(--accent); width: 200px; }
    .search-input::placeholder { color: var(--muted-fg); }

    .refresh-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--muted-fg);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--muted-fg); }
    .refresh-btn + .refresh-btn { margin-left: 0; }
    .refresh-btn.spinning .refresh-icon { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-icon { display: inline-block; }

    /* ── Gradient legend ── */
    .legend {
      padding: 10px 20px 8px;
      background: var(--surface3);
      border-bottom: 1px solid var(--border);
    }
    .legend-scale { position: relative; }
    .legend-bar {
      height: 8px; border-radius: 4px; width: 100%; max-width: 340px;
    }
    .legend-ticks {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 3px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-labels {
      display: flex; justify-content: space-between;
      max-width: 340px; margin-top: 1px;
      font-size: 10px; font-weight: 700;
    }
    .legend-lbl-buy  { color: var(--green); }
    .legend-lbl-mid  { color: var(--yellow); }
    .legend-lbl-sell { color: var(--red); }
    .legend-no-data {
      margin-top: 6px; display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--muted-fg);
    }
    .legend-no-data-swatch {
      width: 28px; height: 8px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 16px; padding: 6px 20px;
      background: var(--surface3); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
    }
    .stat { font-size: 11px; color: var(--muted-fg); }
    .stat strong { font-weight: 700; }

    /* ── Grid ── */
    main { padding: 14px 20px 80px; }

    .ticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 8px;
    }

    /* Cards use only inline styles for color; only structural rules here */
    .ticker-card {
      border-radius: 9px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
      overflow: hidden;
      width: 100%; text-align: left; font: inherit; color: inherit;
      appearance: none; background: var(--surface);
    }
    .ticker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .ticker-card.no-data { background: var(--surface); opacity: 0.55; }
    .ticker-card:disabled { cursor: default; }
    .ticker-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .card-ticker {
      font-family: var(--mono);
      font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 46px;
    }
    .card-asset {
      font-size: 10px; color: var(--muted-fg); margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-price { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }

    .card-indicator {
      font-size: 11px; display: flex; align-items: center;
      justify-content: space-between; margin-top: 3px;
    }
    .card-ind-label { color: var(--muted-fg); }
    .card-ind-value { font-weight: 700; font-family: var(--mono); font-size: 11px; }

    /* Signal badge — colored inline */
    .signal-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; border: 1px solid transparent;
    }

    /* RSI progress bar */
    .rsi-bar-wrap {
      margin-top: 7px; height: 4px; border-radius: 2px; overflow: hidden;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      position: relative;
    }
    .rsi-bar-fill { height: 100%; border-radius: 2px; }
    /* Zone markers at 30% and 70% */
    .rsi-bar-wrap::before,
    .rsi-bar-wrap::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 1px;
      background: color-mix(in srgb, var(--text) 18%, transparent);
    }
    .rsi-bar-wrap::before { left: 30%; }
    .rsi-bar-wrap::after  { left: 70%; }

    /* VWAP delta */
    .vwap-delta { font-size: 10px; font-weight: 600; margin-top: 4px; }
    .card-detail-cue { margin-top: 7px; font-size: 9px; color: var(--muted-fg); }

    /* ── Stock detail dialog ── */
    body.detail-open { overflow: hidden; }
    .detail-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(7px); padding: 20px;
      display: grid; place-items: center;
    }
    .detail-overlay[hidden] { display: none; }
    .detail-panel {
      width: min(980px, 100%); max-height: calc(100vh - 40px); overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55); padding: 20px;
    }
    .detail-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    .detail-title { flex: 1; min-width: 0; }
    .detail-ticker { font: 800 24px var(--mono); letter-spacing: 0.6px; }
    .detail-name { color: var(--muted-fg); font-size: 12px; }
    .detail-price { font-size: 22px; font-weight: 750; white-space: nowrap; }
    .trade-box { border: 1px solid var(--border); border-radius: 9px; padding: 10px; margin-top: 10px; }
    .trade-box h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted-fg); }
    .trade-box .trade-warn { color: var(--red); font-size: 11px; }
    .trade-box input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 12px; width: 150px; }
    .trade-box button { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 11px; margin-right: 4px; }
    .trade-box button.primary { border-color: var(--accent); color: var(--accent); }
    .orders-sync { color: var(--muted-fg); font-size: 11px; margin: 4px 0 8px; }
    .orders-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 10px; font-size: 12px; }
    .orders-summary span { color: var(--muted-fg); }
    .orders-summary strong { color: var(--text); margin-left: 4px; }
    .orders-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    .orders-table th { text-align: left; color: var(--muted-fg); font-weight: 700; padding: 3px 6px; }
    .orders-table td { padding: 3px 6px; border-top: 1px solid var(--border); }
    .orders-table .num { text-align: right; font-family: var(--mono); }
    .order-open td:first-child { box-shadow: inset 3px 0 var(--accent); }
    .order-actions button, .order-form button {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 11px; margin-right: 3px;
    }
    .order-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .order-form select, .order-form input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 6px; font-size: 11px; max-width: 120px;
    }
    .order-form input[name=note] { max-width: 200px; }
    .order-error { color: var(--red); font-size: 11px; min-height: 14px; margin-top: 4px; }
    .detail-step {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px;
    }
    .detail-step:disabled { opacity: 0.35; cursor: default; }
    .detail-pos { align-self: center; color: var(--muted-fg); font-size: 11px; white-space: nowrap; }
    .detail-close {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px;
    }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(240px, 1fr); gap: 16px; }
    .detail-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .detail-card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted-fg); font-weight: 750; margin-bottom: 9px; }
    .detail-range-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .detail-range-btn {
      border: 1px solid var(--border); background: transparent; color: var(--muted-fg);
      border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .detail-range-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    .detail-chart-wrap { position: relative; height: 310px; }
    #detail-chart { width: 100%; height: 100%; display: block; }
    .detail-chart-summary { display: flex; justify-content: space-between; gap: 12px; color: var(--muted-fg); font-size: 11px; margin-top: 5px; }
    .detail-rating { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .detail-rating-label { font-size: 22px; font-weight: 800; }
    .rating-positive { color: var(--green); }
    .rating-negative { color: var(--red); }
    .rating-neutral { color: var(--yellow); }
    .detail-disclaimer { color: var(--muted-fg); font-size: 10px; margin-top: 6px; }
    .company-description { font-size: 12px; line-height: 1.6; margin: 0; color: var(--text); }
    .company-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-top: 12px; }
    .company-fact { min-width: 0; }
    .company-fact span { display: block; color: var(--muted-fg); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
    .company-fact strong { display: block; font-size: 11px; margin-top: 2px; overflow-wrap: anywhere; }
    .company-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; }
    .company-link { display: inline-block; color: var(--accent); font-size: 11px; text-decoration: none; }
    .company-link:hover { text-decoration: underline; }
    .component-list { display: grid; gap: 6px; margin-top: 12px; }
    .component-row, .detail-meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
    .component-row span:first-child, .detail-meta-row span:first-child { color: var(--muted-fg); }
    .return-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .return-cell { text-align: center; background: var(--surface3); border-radius: 7px; padding: 7px 3px; }
    .return-label { display: block; color: var(--muted-fg); font-size: 9px; text-transform: uppercase; }
    .return-value { display: block; font: 700 12px var(--mono); margin-top: 2px; }
    .range-track { height: 7px; background: var(--surface3); border-radius: 99px; position: relative; margin: 14px 0 5px; }
    .range-marker { position: absolute; top: -4px; width: 3px; height: 15px; background: var(--accent); border-radius: 2px; transform: translateX(-50%); }
    .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-fg); }
    .detail-stack { display: grid; gap: 12px; }
    #detail-orders-card { order: 2; }  /* the chart comes first, then the position and orders */
    .detail-loading { padding: 70px 20px; text-align: center; color: var(--muted-fg); }
    @media (max-width: 720px) {
      .detail-overlay { padding: 0; place-items: stretch; }
      .detail-panel { max-height: 100vh; width: 100%; border-radius: 0; padding: 15px; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-chart-wrap { height: 260px; }
      .return-grid { grid-template-columns: repeat(3, 1fr); }
      .company-facts { grid-template-columns: 1fr; }
    }

    /* State messages */
    .state-msg { text-align: center; color: var(--muted-fg); padding: 60px 24px; font-size: 14px; }
    .error-card {
      border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); padding: 16px;
      font-size: 13px; margin-bottom: 12px; color: var(--red);
    }
  </style>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='site-nav.css') }}">
</head>
<body>
{% include "_site_nav.html" %}

<header>
  <span class="header-title">📈 Tradility</span>
  <span class="header-meta" id="meta-generated"></span>
</header>

<div class="controls">
  <span class="controls-label" title="Select one or more. Several are combined into one joint buy probability.">Indicators</span>
  <div class="indicator-group" role="group" aria-label="Indicators (select several to combine them)">
    <button class="ind-btn active" data-ind="rsi"   aria-pressed="true"  onclick="toggleIndicator('rsi')">RSI 14</button>
    <button class="ind-btn"        data-ind="vwap"  aria-pressed="false" onclick="toggleIndicator('vwap')">VWAP 20</button>
    <button class="ind-btn"        data-ind="trend" aria-pressed="false" onclick="toggleIndicator('trend')">Trend 50/200</button>
  </div>

  <span class="controls-label" style="margin-left:6px">Class</span>
  <div class="filter-group" id="class-filters"></div>

  <input class="search-input" id="search-input" type="text"
         placeholder="Search ticker…" oninput="renderGrid()">

  <select class="sort-select" id="sort-select" onchange="renderGrid()">
    <option value="value-asc">Sort: value ↑ (buy first)</option>
    <option value="value-desc">Sort: value ↓ (sell first)</option>
    <option value="ticker">Sort: ticker A–Z</option>
    <option value="price-desc">Sort: price ↓</option>
  </select>

  <button class="refresh-btn" id="reload-btn" onclick="loadData()">
    <span class="refresh-icon">↻</span> Reload
  </button>
  <button class="refresh-btn" id="refresh-btn" onclick="runRefresh()">
    <span class="refresh-icon">▶</span> Run refresh
  </button>
</div>

<div class="legend">
  <div class="legend-scale">
    <canvas class="legend-bar" id="legend-bar" height="8"></canvas>
    <div class="legend-ticks" id="legend-ticks"></div>
    <div class="legend-labels">
      <span class="legend-lbl-buy"  id="legend-lbl-buy"></span>
      <span class="legend-lbl-mid"  id="legend-lbl-mid"></span>
      <span class="legend-lbl-sell" id="legend-lbl-sell"></span>
    </div>
  </div>
  <div class="legend-no-data">
    <div class="legend-no-data-swatch"></div>
    No data / fetch error
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<main>
  <div id="grid-container"><div class="state-msg">Loading…</div></div>
</main>

<div class="detail-overlay" id="detail-overlay" hidden
     role="dialog" aria-modal="true" aria-labelledby="detail-dialog-title">
  <section class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div class="detail-title">
        <div class="detail-ticker" id="detail-dialog-title">Stock details</div>
        <div class="detail-name" id="detail-dialog-name"></div>
      </div>
      <div class="detail-price" id="detail-dialog-price"></div>
      <span class="detail-pos" id="detail-pos"></span>
      <button class="detail-step" id="detail-prev" type="button" onclick="stepTickerDetail(-1)" aria-label="Previous ticker" title="Previous (←)">‹</button>
      <button class="detail-step" id="detail-next" type="button" onclick="stepTickerDetail(1)" aria-label="Next ticker" title="Next (→)">›</button>
      <button class="detail-close" type="button" onclick="closeTickerDetail()" aria-label="Close details">×</button>
    </div>
    <div id="detail-content"><div class="detail-loading">Loading company and market details…</div></div>
  </section>
</div>

<script>
  // ── matplotlib RdYlGn colormap (11 stops, t=0 → red, t=1 → green) ─────────
  const RDYLGN = [
    [165,   0,  38],
    [215,  48,  39],
    [244, 109,  67],
    [253, 174,  97],
    [254, 224, 139],
    [255, 255, 191],
    [217, 239, 139],
    [166, 217, 106],
    [102, 189,  99],
    [ 26, 152,  80],
    [  0, 104,  55],
  ];

  function rdylgn(t) {
    t = Math.max(0, Math.min(1, t));
    const n   = RDYLGN.length - 1;
    const pos = t * n;
    const lo  = Math.floor(pos);
    const hi  = Math.min(n, lo + 1);
    const f   = pos - lo;
    return [
      Math.round(RDYLGN[lo][0] + (RDYLGN[hi][0] - RDYLGN[lo][0]) * f),
      Math.round(RDYLGN[lo][1] + (RDYLGN[hi][1] - RDYLGN[lo][1]) * f),
      Math.round(RDYLGN[lo][2] + (RDYLGN[hi][2] - RDYLGN[lo][2]) * f),
    ];
  }

  // Each indicator reads as a probability that the ticker is a buy: t=1 buy/green, t=0 sell/red
  // (inverse of the raw colormap for RSI/VWAP). null means the indicator has no value.
  function signalT(ticker, ind) {
    if (ticker.fetch_status === 'error') return null;
    if (ind === 'rsi') {
      if (ticker.rsi_14 == null) return null;
      return 1 - ticker.rsi_14 / 100;          // RSI 0→t=1 (green), RSI 100→t=0 (red)
    } else if (ind === 'vwap') {
      const p = ticker.last_price, v = ticker.vwap_20;
      if (p == null || v == null || v === 0) return null;
      const d = (p - v) / v;                   // % above/below VWAP
      return Math.max(0, Math.min(1, 0.5 - d / 0.6));  // ±30% mapped to [0,1]
    }
    if (ticker.long_term_trend === 'bullish') return 0.85;
    if (ticker.long_term_trend === 'bearish') return 0.15;
    if (ticker.long_term_trend === 'mixed') return 0.5;
    return null;
  }

  // Joint buy probability of the selected indicators, treated as independent evidence with an
  // even prior: P = Πp / (Πp + Π(1-p)). A neutral 0.5 changes nothing; agreeing indicators
  // reinforce each other and opposing ones cancel. Each p is held off 0 and 1 so one extreme
  // reading cannot settle the answer alone. Indicators with no value are left out; the card says
  // how many of the selected indicators contributed.
  const P_FLOOR = 0.02;
  function jointT(ticker, inds) {
    let buy = 1, sell = 1, used = 0;
    for (const ind of inds) {
      const p = signalT(ticker, ind);
      if (p === null) continue;
      const q = Math.max(P_FLOOR, Math.min(1 - P_FLOOR, p));
      buy *= q; sell *= 1 - q; used++;
    }
    return used ? { t: buy / (buy + sell), used } : null;
  }

  function colormapT(ticker) {
    const joint = jointT(ticker, [...activeIndicators]);
    return joint ? joint.t : null;
  }

  // Compute all inline color values for one card
  function cardPalette(t) {
    if (t === null) return null;
    const [r, g, b] = rdylgn(t);
    const rgb = `rgb(${r},${g},${b})`;
    return {
      bg:     `linear-gradient(135deg, color-mix(in srgb, ${rgb} 28%, var(--bg)) 0%, color-mix(in srgb, ${rgb} 15%, var(--bg)) 100%)`,
      border: `rgba(${r},${g},${b},0.42)`,
      fg:     `color-mix(in srgb, ${rgb} 75%, var(--text))`,
      fgDim:  `rgba(${r},${g},${b},0.55)`,
      fill:   `rgb(${r},${g},${b})`,
    };
  }

  // ── Legend gradient bar (canvas, left=green buy, right=red sell) ────────────
  function paintLegend() {
    const canvas = document.getElementById('legend-bar');
    const ctx    = canvas.getContext('2d');
    const W      = canvas.offsetWidth || 340;
    canvas.width = W * devicePixelRatio;
    canvas.height = 8 * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    // left=green (t=1), right=red (t=0) — reverse the stops
    for (let i = 0; i <= 10; i++) {
      const [r, g, b] = RDYLGN[10 - i];
      grad.addColorStop(i / 10, `rgb(${r},${g},${b})`);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(0, 0, W, 8, 4);
    ctx.fill();

    // Labels and ticks
    if (activeIndicators.size > 1) {
      document.getElementById('legend-ticks').innerHTML =
        '<span>100%</span><span>75%</span><span>50%</span><span>25%</span><span>0%</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Joint buy probability high';
      document.getElementById('legend-lbl-mid').textContent  = 'Even';
      document.getElementById('legend-lbl-sell').textContent = 'Joint buy probability low';
    } else if (activeIndicator() === 'rsi') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>0</span><span>30</span><span>50</span><span>70</span><span>100</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Oversold (buy)';
      document.getElementById('legend-lbl-mid').textContent  = 'Neutral';
      document.getElementById('legend-lbl-sell').textContent = 'Overbought (sell)';
    } else if (activeIndicator() === 'vwap') {
      document.getElementById('legend-ticks').innerHTML =
        '<span>−30%</span><span>−15%</span><span>0%</span><span>+15%</span><span>+30%</span>';
      document.getElementById('legend-lbl-buy').textContent  = 'Below VWAP (buy)';
      document.getElementById('legend-lbl-mid').textContent  = 'At VWAP';
      document.getElementById('legend-lbl-sell').textContent = 'Above VWAP (sell)';
    } else {
      document.getElementById('legend-ticks').innerHTML =
        '<span>Bullish</span><span></span><span>Mixed</span><span></span><span>Bearish</span>';
      document.getElementById('legend-lbl-buy').textContent  = '50-day above 200-day';
      document.getElementById('legend-lbl-mid').textContent  = 'Mixed';
      document.getElementById('legend-lbl-sell').textContent = '50-day below 200-day';
    }
  }

  // ── State ───────────────────────────────────────────────────────────────────
  let allTickers    = [];
  let activeIndicators = new Set(['rsi']);
  const activeIndicator = () => [...activeIndicators][0];
  let activeClasses   = new Set(['all']);
  let allClasses      = [];
  let csrfToken       = '';
  let detailRecord    = null;
  // One chart range for every card: changing it on one chart changes all of them, and it is
  // remembered in this browser.
  const RANGES = ['1m', '3m', '1y', '3y', '5y'];
  const RANGE_KEY = 'tradility-detail-range';
  let detailRange = (() => {
    try { const v = localStorage.getItem(RANGE_KEY); if (RANGES.includes(v)) return v; } catch (e) {}
    return '5y';
  })();
  let detailTrigger   = null;
  let detailTicker    = null;
  let tradeStatus     = null;   // {available, enabled, tickers, per_order_usd, ...} from the trader service
  let tradeStep       = null;   // the preview or cancel awaiting its typed confirmation
  let detailOrders    = null;   // {position, orders} for the open card, from /api/tradility-orders
  let shownOrder      = [];   // tickers with details, in the order the grid shows them

  // ── Data load ────────────────────────────────────────────────────────────────
  async function loadData() {
    const btn = document.getElementById('reload-btn');
    btn.classList.add('spinning');
    try {
      const res  = await fetch('/api/tradility-analysis');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      csrfToken = data.csrf_token || '';
      allTickers = data.tickers || [];
      if (data.generated_at) {
        const d = new Date(data.generated_at);
        const meta = document.getElementById('meta-generated');
        const stale = Boolean(data.freshness && data.freshness.stale);
        meta.textContent = `${stale ? '⚠ Stale — ' : ''}Updated ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
        meta.classList.toggle('stale', stale);
      }
      const classSet = new Set();
      for (const t of allTickers) if (t.asset_class) classSet.add(t.asset_class);
      allClasses = [...classSet].sort();
      buildClassFilters();
      renderGrid();
    } catch (err) {
      document.getElementById('grid-container').innerHTML =
        `<div class="error-card">⚠ Could not load analysis: ${err.message}</div>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  async function runRefresh() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    btn.disabled = true;
    try {
      if (!csrfToken) await loadData();
      const res = await fetch('/api/tradility-refresh', {
        method: 'POST',
        headers: {'X-CSRF-Token': csrfToken},
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const meta = document.getElementById('meta-generated');
      meta.textContent = 'Refresh started… reload in a few minutes';
      meta.classList.remove('stale');
    } catch (err) {
      const meta = document.getElementById('meta-generated');
      meta.textContent = `Refresh failed: ${err.message}`;
      meta.classList.add('stale');
    } finally {
      btn.classList.remove('spinning');
      btn.disabled = false;
    }
  }

  // ── Indicator switch ─────────────────────────────────────────────────────────
  function toggleIndicator(ind) {
    if (activeIndicators.has(ind)) {
      if (activeIndicators.size === 1) return;   // keep at least one selected
      activeIndicators.delete(ind);
    } else {
      activeIndicators.add(ind);
    }
    document.querySelectorAll('.ind-btn').forEach(b => {
      const on = activeIndicators.has(b.dataset.ind);
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    paintLegend();
    renderGrid();
  }

  // ── Class filter ──────────────────────────────────────────────────────────────
  function buildClassFilters() {
    const container = document.getElementById('class-filters');
    container.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'filter-btn active';
    all.textContent = 'All';
    all.onclick = () => toggleClass('all');
    container.appendChild(all);
    for (const cls of allClasses) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cls;
      btn.dataset.cls = cls;
      btn.onclick = () => toggleClass(cls);
      container.appendChild(btn);
    }
  }

  function toggleClass(cls) {
    if (cls === 'all') {
      activeClasses = new Set(['all']);
    } else {
      activeClasses.delete('all');
      activeClasses.has(cls) ? activeClasses.delete(cls) : activeClasses.add(cls);
      if (activeClasses.size === 0) activeClasses.add('all');
    }
    document.querySelectorAll('.filter-btn').forEach(b => {
      const isAll = !b.dataset.cls;
      b.classList.toggle('active',
        (isAll && activeClasses.has('all')) || (b.dataset.cls && activeClasses.has(b.dataset.cls)));
    });
    renderGrid();
  }

  // The label, value and detail line one indicator shows on a card. `note` is its own read when
  // several indicators are combined.
  function indicatorBlock(t, ind, pal, many) {
    const col = pal ? `color:${pal.fg}` : '';
    const own = signalT(t, ind);
    const note = many && own !== null ? `${Math.round(own * 100)}% buy` : '';
    if (ind === 'rsi') {
      const value = t.rsi_14 != null ? t.rsi_14.toFixed(1) : '—';
      let extra = '';
      if (t.rsi_14 != null && !many) {
        const pct  = Math.min(100, Math.max(0, t.rsi_14));
        const fill = pal ? `background:${pal.fill}` : '';
        extra = `<div class="rsi-bar-wrap"><div class="rsi-bar-fill" style="width:${pct}%;${fill}"></div></div>`;
      }
      return { label: 'RSI 14', value, extra, note };
    }
    if (ind === 'vwap') {
      let extra = '';
      if (t.last_price != null && t.vwap_20 != null && t.vwap_20 !== 0) {
        const delta = (t.last_price - t.vwap_20) / t.vwap_20 * 100;
        extra = `<div class="vwap-delta" style="${col}">${delta >= 0 ? '+' : ''}${delta.toFixed(2)}% vs VWAP</div>`;
      }
      return { label: 'VWAP 20', value: t.vwap_20 != null ? fmtPrice(t.vwap_20) : '—', extra, note };
    }
    let extra = '';
    if (t.sma_50 != null && t.sma_200 != null && t.sma_200 !== 0) {
      const spread = (t.sma_50 - t.sma_200) / t.sma_200 * 100;
      extra = `<div class="vwap-delta" style="${col}">${spread >= 0 ? '+' : ''}${spread.toFixed(2)}% 50/200 spread</div>`;
    }
    const value = t.sma_50 != null && t.sma_200 != null
      ? `${fmtPrice(t.sma_50)} / ${fmtPrice(t.sma_200)}` : '—';
    return { label: 'SMA 50 / 200', value, extra, note };
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderGrid() {
    const query = document.getElementById('search-input').value.trim().toUpperCase();
    const sort  = document.getElementById('sort-select').value;

    let tickers = allTickers.filter(t => {
      if (query && !t.ticker.includes(query) && !(t.name || '').toUpperCase().includes(query))
        return false;
      if (!activeClasses.has('all') && !activeClasses.has(t.asset_class))
        return false;
      return true;
    });

    // Attach computed t value for sorting/stats
    tickers = tickers.map(t => ({ ...t, _t: colormapT(t) }));

    tickers.sort((a, b) => {
      if (sort === 'ticker')      return a.ticker.localeCompare(b.ticker);
      if (sort === 'price-desc')  return (b.last_price ?? 0) - (a.last_price ?? 0);
      if (sort === 'value-desc')  return (a._t ?? -1) - (b._t ?? -1); // low t (sell) first
      // value-asc: high t (buy/green) first; nulls last
      const at = a._t ?? -1, bt = b._t ?? -1;
      return bt !== at ? bt - at : a.ticker.localeCompare(b.ticker);
    });

    shownOrder = tickers.filter(t => t.detail_available).map(t => t.ticker);
    if (detailTicker) paintDetailSteps();

    // Stats: bucket by approximate signal for count display
    let buyN = 0, sellN = 0, neutralN = 0, noDataN = 0;
    for (const t of tickers) {
      if (t._t === null) { noDataN++; continue; }
      if (t._t > 0.6)       buyN++;
      else if (t._t < 0.4)  sellN++;
      else                   neutralN++;
    }
    const [buyR, buyG, buyB]    = rdylgn(0.85);
    const [sellR, sellG, sellB] = rdylgn(0.10);
    const [midR, midG, midB]    = rdylgn(0.50);
    const onlyTrend = activeIndicators.size === 1 && activeIndicator() === 'trend';
    const positiveLabel = onlyTrend ? 'bullish' : 'buy';
    const negativeLabel = onlyTrend ? 'bearish' : 'sell';
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><strong>${tickers.length}</strong> shown</div>
      <div class="stat"><strong style="color:rgb(${buyR},${buyG},${buyB})">${buyN}</strong> ${positiveLabel}</div>
      <div class="stat"><strong style="color:rgb(${sellR},${sellG},${sellB})">${sellN}</strong> ${negativeLabel}</div>
      <div class="stat"><strong style="color:rgb(${midR},${midG},${midB})">${neutralN}</strong> neutral</div>
      ${noDataN ? `<div class="stat"><strong style="color:var(--muted-fg)">${noDataN}</strong> no data</div>` : ''}
    `;

    if (!tickers.length) {
      document.getElementById('grid-container').innerHTML =
        '<div class="state-msg">No tickers match.</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'ticker-grid';

    for (const t of tickers) {
      const pal   = cardPalette(t._t);
      const card  = document.createElement('button');
      card.type = 'button';
      card.dataset.ticker = t.ticker;
      card.className = 'ticker-card' + (pal ? '' : ' no-data');
      card.disabled = !t.detail_available;
      if (t.detail_available) {
        card.title = `Open ${t.ticker} historical performance`;
        card.addEventListener('click', () => openTickerDetail(t.ticker, card));
      }

      if (pal) {
        card.style.background   = pal.bg;
        card.style.borderColor  = pal.border;
      }

      const price = t.last_price != null ? fmtPrice(t.last_price) : '—';

      const joint = jointT(t, [...activeIndicators]);
      const many = activeIndicators.size > 1;
      const blocks = [...activeIndicators].map(ind => indicatorBlock(t, ind, pal, many));
      const indLabel = many ? 'Joint buy probability' : blocks[0].label;
      const indValue = many
        ? (joint ? `${Math.round(joint.t * 100)}%` : '—')
        : blocks[0].value;
      const extraHtml = many
        ? blocks.map(x => `<div class="vwap-delta ind-row"><span>${x.label}</span><span>${x.value}${x.note ? ' · ' + x.note : ''}</span></div>`).join('')
          + (joint && joint.used < activeIndicators.size
            ? `<div class="vwap-delta">${joint.used} of ${activeIndicators.size} signals available</div>` : '')
        : blocks[0].extra;

      // Badge label
      let badge = '—';
      if (t._t !== null) {
        if (many) {
          badge = t._t > 0.6 ? 'Buy' : t._t < 0.4 ? 'Sell' : 'Neutral';
        } else if (activeIndicator() === 'rsi') {
          badge = t._t > 0.7 ? 'Oversold' : t._t < 0.3 ? 'Overbought' : 'Neutral';
        } else if (activeIndicator() === 'vwap') {
          badge = t._t > 0.55 ? 'Below' : t._t < 0.45 ? 'Above' : 'At VWAP';
        } else {
          badge = t.long_term_trend === 'bullish' ? 'Bullish'
            : t.long_term_trend === 'bearish' ? 'Bearish' : 'Mixed';
        }
      } else {
        badge = t.fetch_status === 'error' ? 'No data' : '—';
      }

      const badgeBg  = pal ? `background:${pal.fgDim};border-color:${pal.border}` : '';
      const badgeFg  = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const tickFg   = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';
      const indValFg = pal ? `color:${pal.fg}` : 'color:var(--muted-fg)';

      card.innerHTML = `
        <div class="signal-badge" style="${badgeBg};${badgeFg}">${badge}</div>
        <div class="card-ticker" style="${tickFg}">${esc(t.ticker)}</div>
        <div class="card-asset">${esc(t.asset_class || '')}${t.name ? ' · ' + esc(t.name) : ''}</div>
        <div class="card-price">${price}</div>
        <div class="card-indicator">
          <span class="card-ind-label">${indLabel}</span>
          <span class="card-ind-value" style="${indValFg}">${indValue}</span>
        </div>
        ${extraHtml}
        ${t.detail_available ? '<div class="card-detail-cue">View chart, profile, and rating →</div>' : ''}
      `;
      grid.appendChild(card);
    }

    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    container.appendChild(grid);
  }

  // ── Historical-performance detail ───────────────────────────────────────────
  function paintDetailSteps() {
    const at = shownOrder.indexOf(detailTicker);
    document.getElementById('detail-prev').disabled = at <= 0;
    document.getElementById('detail-next').disabled = at < 0 || at >= shownOrder.length - 1;
    document.getElementById('detail-pos').textContent = at < 0 ? '' : `${at + 1} / ${shownOrder.length}`;
  }

  // Open the previous (-1) or next (+1) card in the order the grid is showing.
  function stepTickerDetail(delta) {
    const at = shownOrder.indexOf(detailTicker);
    const next = shownOrder[at + delta];
    if (at < 0 || !next) return;
    const card = [...document.querySelectorAll('.ticker-card')].find(c => c.dataset.ticker === next);
    openTickerDetail(next, card || detailTrigger, delta < 0 ? 'detail-prev' : 'detail-next');
  }

  async function openTickerDetail(ticker, trigger, keepFocus) {
    detailTrigger = trigger || null;
    detailTicker = ticker;
    paintDetailSteps();
    detailRecord = null;
    detailOrders = null;
    tradeStep = null;
    const overlay = document.getElementById('detail-overlay');
    overlay.hidden = false;
    document.body.classList.add('detail-open');
    document.getElementById('detail-dialog-title').textContent = ticker;
    document.getElementById('detail-dialog-name').textContent = '';
    document.getElementById('detail-dialog-price').textContent = '';
    document.getElementById('detail-content').innerHTML =
      '<div class="detail-loading">Loading company and market details…</div>';
    const keep = keepFocus && document.getElementById(keepFocus);
    (keep && !keep.disabled ? keep : overlay.querySelector('.detail-close')).focus();

    try {
      const res = await fetch(`/api/tradility-analysis/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker) return;   // stepped on to another card while this one loaded
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailRecord = data.ticker;
      renderTickerDetail(data);
      loadOrders(ticker);
    } catch (err) {
      if (detailTicker !== ticker) return;
      document.getElementById('detail-content').innerHTML =
        `<div class="error-card">Could not load ${esc(ticker)} details: ${esc(err.message)}</div>`;
    }
  }

  function closeTickerDetail() {
    document.getElementById('detail-overlay').hidden = true;
    document.body.classList.remove('detail-open');
    detailRecord = null;
    detailOrders = null;
    detailTicker = null;
    if (detailTrigger) detailTrigger.focus();
    detailTrigger = null;
  }

  function ratingLabel(value) {
    return String(value || 'unknown').split('_').map(part =>
      part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
  }

  function ratingClass(value) {
    if (value === 'buy' || value === 'strong_buy') return 'rating-positive';
    if (value === 'sell' || value === 'strong_sell') return 'rating-negative';
    return 'rating-neutral';
  }

  function formatReturn(value) {
    if (value == null || !Number.isFinite(Number(value))) return '—';
    const number = Number(value);
    return `${number >= 0 ? '+' : ''}${number.toFixed(2)}%`;
  }

  function formatChartDate(value) {
    return value.toLocaleDateString(undefined, {timeZone: 'UTC'});
  }

  function returnClass(value) {
    if (value == null || Number(value) === 0) return '';
    return Number(value) > 0 ? 'rating-positive' : 'rating-negative';
  }

  function safeExternalUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '';
    } catch (_error) {
      return '';
    }
  }

  function formatEmployees(value) {
    if (value == null || value === '') return '—';
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? Math.round(number).toLocaleString() : '—';
  }

  function formatProfileTime(value) {
    if (!value) return '—';
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? '—' : parsed.toLocaleDateString();
  }

  // The symbol's Yahoo Finance quote page; empty when there is no symbol.
  function yahooUrl(ticker) {
    return ticker ? `https://finance.yahoo.com/quote/${encodeURIComponent(ticker)}/` : '';
  }

  function renderTickerDetail(data) {
    const t = data.ticker;
    const returns = t.returns || {};
    const components = t.technical_components || {};
    const profile = t.company_profile || {};
    const companyName = profile.canonical_name || t.name || '';
    const website = safeExternalUrl(profile.website);
    const industry = profile.industry || profile.category || '—';
    const sector = profile.sector || profile.fund_family || '—';
    const vision = profile.vision_statement
      ? esc(profile.vision_statement)
      : 'Not supplied by the current source';
    const position = Math.min(100, Math.max(0, Number(t.range_position_52w ?? 0)));
    const returnLabels = [['1m','1M'], ['3m','3M'], ['1y','1Y'], ['3y','3Y'], ['5y','5Y']];
    document.getElementById('detail-dialog-title').textContent = t.ticker || 'Stock details';
    document.getElementById('detail-dialog-name').textContent =
      [companyName, t.asset_class].filter(Boolean).join(' · ');
    document.getElementById('detail-dialog-price').textContent = fmtPrice(t.last_price);

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-layout">
        <div class="detail-stack">
          <section class="detail-card">
            <div class="detail-card-title">Company overview</div>
            ${profile.available ? `
              <p class="company-description">${esc(profile.description || 'No business description was supplied by this source.')}</p>
              <div class="company-facts">
                <div class="company-fact"><span>Sector / family</span><strong>${esc(sector)}</strong></div>
                <div class="company-fact"><span>Industry / category</span><strong>${esc(industry)}</strong></div>
                <div class="company-fact"><span>Headquarters</span><strong>${esc(profile.headquarters || '—')}</strong></div>
                <div class="company-fact"><span>Exchange</span><strong>${esc(profile.exchange || '—')}</strong></div>
                <div class="company-fact"><span>Employees</span><strong>${formatEmployees(profile.employees)}</strong></div>
                <div class="company-fact"><span>Entity type</span><strong>${esc(profile.entity_type || '—')}</strong></div>
                <div class="company-fact"><span>Official mission / vision</span><strong>${vision}</strong></div>
                <div class="company-fact"><span>Profile source</span><strong>${esc(profile.source || 'unknown')} · ${formatProfileTime(profile.retrieved_at)}</strong></div>
              </div>
            ` : `
              <p class="company-description">No qualitative profile is available for this symbol yet. Run a refresh to populate newly supported equities and funds.</p>
            `}
            <div class="company-links">
              ${website ? `<a class="company-link" href="${esc(website)}" target="_blank" rel="noopener noreferrer">Company website ↗</a>` : ''}
              ${yahooUrl(t.ticker) ? `<a class="company-link" href="${esc(yahooUrl(t.ticker))}" target="_blank" rel="noopener noreferrer">Yahoo Finance ↗</a>` : ''}
            </div>
          </section>
          <section class="detail-card" id="detail-orders-card">
            <div class="detail-card-title">Position and orders</div>
            <div id="detail-orders"><div class="detail-loading">Loading position…</div></div>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">Historical close</div>
            <div class="detail-range-buttons">
              ${returnLabels.map(([key, label]) =>
                `<button type="button" class="detail-range-btn ${key === detailRange ? 'active' : ''}" data-range="${key}" onclick="setDetailRange('${key}')">${label}</button>`
              ).join('')}
            </div>
            <div class="detail-chart-wrap"><canvas id="detail-chart"></canvas></div>
            <div class="detail-chart-summary" id="detail-chart-summary"></div>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">Period performance</div>
            <div class="return-grid">
              ${returnLabels.map(([key, label]) => `<div class="return-cell">
                <span class="return-label">${label}</span>
                <span class="return-value ${returnClass(returns[key])}">${formatReturn(returns[key])}</span>
              </div>`).join('')}
            </div>
          </section>
        </div>
        <div class="detail-stack">
          <section class="detail-card">
            <div class="detail-card-title">Technical market rating</div>
            <div class="detail-rating">
              <span class="detail-rating-label ${ratingClass(t.technical_rating)}">${esc(ratingLabel(t.technical_rating))}</span>
              <strong>${Number(t.technical_score ?? 0) >= 0 ? '+' : ''}${Number(t.technical_score ?? 0)} / 4</strong>
            </div>
            <div class="component-list">
              <div class="component-row"><span>Long-term trend</span><strong>${Number(components.long_term_trend ?? 0) >= 0 ? '+' : ''}${Number(components.long_term_trend ?? 0)}</strong></div>
              <div class="component-row"><span>VWAP momentum</span><strong>${Number(components.vwap_momentum ?? 0) >= 0 ? '+' : ''}${Number(components.vwap_momentum ?? 0)}</strong></div>
              <div class="component-row"><span>RSI reversion</span><strong>${Number(components.rsi_reversion ?? 0) >= 0 ? '+' : ''}${Number(components.rsi_reversion ?? 0)}</strong></div>
            </div>
            <p class="detail-disclaimer">Rule-based technical composite—not analyst consensus or investment advice. Authorized analyst ratings remain a separate planned data source.</p>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">52-week range</div>
            <div class="range-track"><span class="range-marker" style="left:${position}%"></span></div>
            <div class="range-labels"><span>${fmtPrice(t.low_52w)}</span><span>${fmtPrice(t.high_52w)}</span></div>
            <div class="component-row" style="margin-top:8px"><span>Current position</span><strong>${t.range_position_52w == null ? '—' : Number(t.range_position_52w).toFixed(1) + '%'}</strong></div>
          </section>
          <section class="detail-card">
            <div class="detail-card-title">Indicators and provenance</div>
            <div class="component-list">
              <div class="detail-meta-row"><span>RSI 14</span><strong>${t.rsi_14 == null ? '—' : Number(t.rsi_14).toFixed(1)} · ${esc(t.rsi_14_signal || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>VWAP 20</span><strong>${fmtPrice(t.vwap_20)} · ${esc(t.vwap_20_signal || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Trend</span><strong>${esc(t.long_term_trend || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Source</span><strong>${esc(t.data_source || 'unknown')}</strong></div>
              <div class="detail-meta-row"><span>Coverage</span><strong>${esc(t.period_start || '—')} → ${esc(t.period_end || '—')}</strong></div>
              <div class="detail-meta-row"><span>Generated</span><strong>${data.generated_at ? new Date(data.generated_at).toLocaleString() : '—'}</strong></div>
            </div>
            ${t.fallback_reason ? `<p class="detail-disclaimer">Fallback: ${esc(t.fallback_reason)}</p>` : ''}
          </section>
        </div>
      </div>`;
    requestAnimationFrame(drawDetailChart);
  }

  function setDetailRange(range) {
    if (!RANGES.includes(range)) return;
    detailRange = range;
    try { localStorage.setItem(RANGE_KEY, range); } catch (e) {}
    document.querySelectorAll('.detail-range-btn').forEach(button =>
      button.classList.toggle('active', button.dataset.range === range));
    drawDetailChart();
  }

  function detailPointsForRange() {
    const points = (detailRecord && detailRecord.price_history || [])
      .filter(point => point && point.date && Number.isFinite(Number(point.close)))
      .map(point => ({date: new Date(`${point.date}T00:00:00Z`), close: Number(point.close)}));
    if (!points.length || detailRange === '5y') return points;
    const end = new Date(points[points.length - 1].date);
    const start = new Date(end);
    if (detailRange === '1m') start.setUTCMonth(start.getUTCMonth() - 1);
    if (detailRange === '3m') start.setUTCMonth(start.getUTCMonth() - 3);
    if (detailRange === '1y') start.setUTCFullYear(start.getUTCFullYear() - 1);
    if (detailRange === '3y') start.setUTCFullYear(start.getUTCFullYear() - 3);
    return points.filter(point => point.date >= start);
  }

  // ── Position and orders ──────────────────────────────────────────────────────
  async function loadOrders(ticker) {
    try {
      const res = await fetch(`/api/tradility-orders/${encodeURIComponent(ticker)}`);
      const data = await res.json();
      if (detailTicker !== ticker) return;
      if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      detailOrders = data;
    } catch (err) {
      if (detailTicker !== ticker) return;
      detailOrders = null;
      const box = document.getElementById('detail-orders');
      if (box) box.innerHTML = `<div class="error-card">Could not load orders: ${esc(err.message)}</div>`;
      return;
    }
    await loadTradeStatus();
    renderOrders();
    drawDetailChart();
  }

  async function loadTradeStatus() {
    try {
      const res = await fetch('/api/tradility-trade/status');
      tradeStatus = await res.json();
    } catch (err) {
      tradeStatus = {available: false, enabled: false};
    }
  }

  async function sendOrder(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function orderPath(id) {
    return `/api/tradility-orders/${encodeURIComponent(detailTicker)}${id ? '/' + encodeURIComponent(id) : ''}`;
  }

  async function changeOrder(id, change) {
    const order = detailOrders.orders.find(o => o.id === id);
    if (!order) return;
    const next = {side: order.side, kind: order.kind, quantity: order.quantity, price: order.price,
                  status: order.status, date: order.date, note: order.note, ...change};
    await submitOrder(() => sendOrder('PUT', orderPath(id), next));
  }

  async function submitOrder(action) {
    const ticker = detailTicker;
    try {
      const data = await action();
      if (detailTicker !== ticker) return;
      detailOrders = data;
      renderOrders();
      drawDetailChart();
    } catch (err) {
      const box = document.getElementById('order-error');
      if (box) box.textContent = err.message;
    }
  }

  function sourceLabel(source) {
    return {schwab: 'Schwab', binance: 'Binance.US'}[source] || 'Manual';
  }

  // Which brokers the read-only export covers, and when it was last fetched.
  function syncNote() {
    const sync = detailOrders && detailOrders.synced || {};
    const names = Object.keys(sync.sources || {});
    if (!names.length) return 'Broker orders are not synced yet; orders below were entered by hand.';
    const ok = names.filter(n => sync.sources[n]).map(sourceLabel);
    const failed = names.filter(n => !sync.sources[n]).map(sourceLabel);
    const when = sync.generated_at ? new Date(sync.generated_at).toLocaleString() : 'unknown time';
    return `Synced (read-only) from ${ok.join(', ') || 'no broker'} · ${esc(when)}`
      + (failed.length ? ` · not available: ${failed.join(', ')}` : '');
  }

  // ── Placing orders (preview, then a typed confirmation) ─────────────────────
  function canTrade() {
    return !!(tradeStatus && tradeStatus.available && tradeStatus.enabled
              && (tradeStatus.tickers || []).includes(detailTicker));
  }

  function money(v) {
    return '$' + Number(v || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function tradeSection() {
    if (!tradeStatus || !tradeStatus.available) return '';
    if (!tradeStatus.enabled) return '<div class="orders-sync">Order placement is turned off in the trading policy.</div>';
    if (!canTrade()) return `<div class="orders-sync">${esc(detailTicker)} is not on the trading allowlist.</div>`;
    const limits = `up to ${money(tradeStatus.per_order_usd)} per order, ${money(tradeStatus.daily_usd)} a day (${money(tradeStatus.spent_today)} used)`;
    return `<div class="trade-box" id="trade-box">
      <h4>Place an order · ${limits}</h4>
      <form class="order-form" id="trade-form" autocomplete="off">
        <select name="side" aria-label="Side"><option>buy</option><option>sell</option></select>
        <select name="kind" aria-label="Order type"><option>limit</option><option>market</option></select>
        <input name="quantity" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
        <input name="price" type="number" step="any" min="0" placeholder="Limit price" aria-label="Limit price">
        <button type="submit" class="primary">Preview</button>
      </form>
      <div id="trade-confirm">${tradeStep ? confirmPanel() : ''}</div>
      <div class="order-error" id="trade-error" role="alert"></div>
    </div>`;
  }

  function confirmPanel() {
    const st = tradeStep;
    return `<div>
      <p>${st.summary}</p>
      ${(st.warnings || []).map(w => `<div class="trade-warn">${esc(w)}</div>`).join('')}
      <p>Type <strong>${esc(st.phrase)}</strong> to confirm. ${st.kind === 'cancel' ? 'This cancels a real order.' : 'This sends a real order.'}</p>
      <input type="text" id="trade-phrase" autocomplete="off" aria-label="Confirmation phrase">
      <button type="button" class="primary" id="trade-go">Send order</button>
      <button type="button" id="trade-discard">Discard</button>
    </div>`;
  }

  function tradeFail(message) {
    const box = document.getElementById('trade-error');
    if (box) box.textContent = message;
  }

  async function tradeCall(action, body) {
    const res = await fetch(`/api/tradility-trade/${action}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  async function startPreview(form) {
    tradeFail('');
    const f = Object.fromEntries(new FormData(form).entries());
    try {
      const pv = await tradeCall('preview', {ticker: detailTicker, side: f.side, kind: f.kind, quantity: f.quantity, price: f.kind === 'limit' ? f.price : null});
      const o = pv.order;
      tradeStep = {
        kind: 'place', previewId: pv.preview_id, phrase: pv.phrase, warnings: pv.warnings,
        summary: `${esc(o.side)} ${esc(String(o.quantity))} ${esc(o.ticker)} ${o.kind === 'limit' ? 'at ' + fmtPrice(o.price) : 'at market'} on ${esc(pv.broker)}, about ${fmtPrice(pv.notional)} (last price ${fmtPrice(pv.last_price)})`,
      };
    } catch (err) {
      tradeStep = null;
      renderOrders();
      tradeFail(err.message);
      return;
    }
    renderOrders();
  }

  function startBrokerCancel(id) {
    const order = detailOrders.orders.find(o => o.id === id);
    if (!order) return;
    const brokerId = id.replace(/^[a-z]+-/, '');
    tradeStep = {
      kind: 'cancel', broker: order.source, orderId: brokerId, phrase: `CANCEL ${brokerId}`, warnings: [],
      symbol: order.source === 'binance' ? detailTicker.replace(/-USD$/, '') + 'USD' : '',
      summary: `Cancel the open ${esc(order.side)} ${esc(String(order.quantity))} ${esc(detailTicker)} order at ${esc(sourceLabel(order.source))}`,
    };
    renderOrders();
  }

  async function sendStep() {
    const st = tradeStep;
    const phrase = document.getElementById('trade-phrase').value;
    tradeStep = null;   // a preview is single use; start over after any outcome
    try {
      if (st.kind === 'place') await tradeCall('confirm', {preview_id: st.previewId, phrase});
      else await tradeCall('cancel', {broker: st.broker, order_id: st.orderId, symbol: st.symbol, phrase});
    } catch (err) {
      renderOrders();
      tradeFail(err.message);
      return;
    }
    await loadOrders(detailTicker);   // the broker's export refreshes on its own schedule
    tradeFail('Sent. Broker orders appear here after the next sync.');
  }

  function renderOrders() {
    const box = document.getElementById('detail-orders');
    if (!box || !detailOrders) return;
    const pos = detailOrders.position || {};
    const last = detailRecord && detailRecord.last_price;
    const entry = pos.avg_entry;
    const pl = entry && last != null ? (last - entry) / entry * 100 : null;
    const source = pos.source === 'holdings' ? 'from holdings' : pos.source === 'orders' ? 'from filled buys' : '';
    const rows = detailOrders.orders.map(o => `
      <tr class="order-${esc(o.status)}">
        <td>${esc(o.date)}</td>
        <td>${esc(o.side)}</td>
        <td>${esc(o.kind.replace('_', ' '))}</td>
        <td class="num">${esc(String(o.quantity))}</td>
        <td class="num">${o.price == null ? '—' : fmtPrice(o.price)}</td>
        <td>${esc(o.status)}</td>
        <td>${esc(o.note || '')}</td>
        <td>${esc(sourceLabel(o.source))}</td>
        <td class="order-actions">
          ${o.source && o.source !== 'manual' ? '' : o.status === 'open' && o.price != null ? `<button type="button" data-order-act="fill" data-id="${esc(o.id)}">Filled</button>` : ''}
          ${o.source && o.source !== 'manual' ? (o.status === 'open' && canTrade() ? `<button type="button" data-order-act="broker-cancel" data-id="${esc(o.id)}">Cancel at broker</button>` : '') : o.status === 'open' ? `<button type="button" data-order-act="cancel" data-id="${esc(o.id)}">Cancel</button>` : ''}
          ${o.source && o.source !== 'manual' ? '' : `<button type="button" data-order-act="delete" data-id="${esc(o.id)}" aria-label="Delete order">×</button>`}
        </td>
      </tr>`).join('');
    box.innerHTML = `
      <div class="orders-summary">
        <span>Quantity<strong>${pos.quantity == null ? '—' : esc(String(pos.quantity))}</strong></span>
        <span>Average entry<strong>${entry ? fmtPrice(entry) : '—'}</strong>${source ? ` <span>${source}</span>` : ''}</span>
        <span>Vs last price<strong class="${pl == null ? '' : returnClass(pl)}">${pl == null ? '—' : formatReturn(pl)}</strong></span>
      </div>
      ${rows ? `<table class="orders-table"><thead><tr><th>Date</th><th>Side</th><th>Type</th><th class="num">Qty</th><th class="num">Price</th><th>Status</th><th>Note</th><th>Source</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
             : '<p class="company-description">No orders recorded for this ticker.</p>'}
      ${tradeSection()}
      <div class="orders-sync">${syncNote()}</div>
      <form class="order-form" id="order-form" autocomplete="off">
        <select name="side" aria-label="Side"><option>buy</option><option>sell</option></select>
        <select name="kind" aria-label="Order type"><option>limit</option><option>market</option><option>stop</option><option value="stop_limit">stop limit</option></select>
        <input name="quantity" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
        <input name="price" type="number" step="any" min="0" placeholder="Price" aria-label="Price">
        <select name="status" aria-label="Status"><option>open</option><option>filled</option><option>cancelled</option></select>
        <input name="date" type="date" aria-label="Date" value="${new Date().toISOString().slice(0, 10)}">
        <input name="note" type="text" maxlength="120" placeholder="Note" aria-label="Note">
        <button type="submit">Add order</button>
      </form>
      <div class="order-error" id="order-error" role="alert"></div>`;
    box.querySelector('#order-form').addEventListener('submit', event => {
      event.preventDefault();
      const f = new FormData(event.target);
      submitOrder(() => sendOrder('POST', orderPath(), Object.fromEntries(f.entries())));
    });
    const tradeForm = box.querySelector('#trade-form');
    if (tradeForm) tradeForm.addEventListener('submit', event => { event.preventDefault(); startPreview(tradeForm); });
    const go = box.querySelector('#trade-go');
    if (go) go.addEventListener('click', sendStep);
    const discard = box.querySelector('#trade-discard');
    if (discard) discard.addEventListener('click', () => { tradeStep = null; renderOrders(); });
    box.querySelectorAll('[data-order-act]').forEach(button => button.addEventListener('click', () => {
      const id = button.dataset.id, act = button.dataset.orderAct;
      if (act === 'delete') submitOrder(() => sendOrder('DELETE', orderPath(id)));
      else if (act === 'broker-cancel') startBrokerCancel(id);
      else if (act === 'cancel') changeOrder(id, {status: 'cancelled'});
      else changeOrder(id, {status: 'filled', date: new Date().toISOString().slice(0, 10)});
    }));
  }

  // Price levels drawn across the chart: your average entry, and each open order's price.
  function chartLevels() {
    if (!detailOrders) return [];
    const levels = [];
    const entry = detailOrders.position && detailOrders.position.avg_entry;
    if (entry) levels.push({price: entry, label: `Avg entry ${fmtPrice(entry)}`, kind: 'entry'});
    for (const o of detailOrders.orders) {
      if (o.status === 'open' && o.price != null) {
        levels.push({price: o.price, label: `${o.side} ${o.kind.replace('_', ' ')} ${fmtPrice(o.price)}`, kind: 'order'});
      }
    }
    return levels;
  }

  function drawDetailChart() {
    const canvas = document.getElementById('detail-chart');
    if (!canvas || !detailRecord) return;
    const points = detailPointsForRange();
    const summary = document.getElementById('detail-chart-summary');
    if (points.length < 2) {
      summary.textContent = 'Not enough history for this range.';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(300, rect.width);
    const height = Math.max(220, rect.height);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const pad = {left: 58, right: 12, top: 12, bottom: 28};
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const prices = points.map(point => point.close);
    let min = Math.min(...prices), max = Math.max(...prices);
    const pricePad = Math.max((max - min) * 0.08, max * 0.005, 0.01);
    min -= pricePad; max += pricePad;
    const levels = chartLevels();
    for (const level of levels) { min = Math.min(min, level.price - pricePad); max = Math.max(max, level.price + pricePad); }
    const t0 = points[0].date.getTime(), t1 = points[points.length - 1].date.getTime();
    const x = point => pad.left + (point.date.getTime() - t0) / Math.max(1, t1 - t0) * plotW;
    const y = point => pad.top + (max - point.close) / Math.max(0.000001, max - min) * plotH;
    const styles = getComputedStyle(document.documentElement);
    const muted = styles.getPropertyValue('--muted').trim() || '#8b949e';
    const border = styles.getPropertyValue('--border').trim() || '#30363d';
    const rising = points[points.length - 1].close >= points[0].close;
    const line = styles.getPropertyValue(rising ? '--green' : '--red').trim() || (rising ? '#3fb950' : '#f85149');

    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const yy = pad.top + plotH * i / 4;
      const value = max - (max - min) * i / 4;
      ctx.strokeStyle = border; ctx.globalAlpha = 0.65; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = muted;
      ctx.fillText(fmtPrice(value), pad.left - 7, yy);
    }

    ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.lineTo(x(points[points.length - 1]), pad.top + plotH);
    ctx.lineTo(x(points[0]), pad.top + plotH);
    ctx.closePath(); ctx.fillStyle = line; ctx.globalAlpha = 0.12; ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

    const accent = styles.getPropertyValue('--accent').trim() || '#58a6ff';
    const levelY = price => pad.top + (max - price) / Math.max(0.000001, max - min) * plotH;
    ctx.font = '10px ui-monospace, monospace';
    for (const level of levels) {
      const yy = levelY(level.price);
      ctx.save();
      ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = level.kind === 'entry' ? 1.6 : 1;
      ctx.setLineDash(level.kind === 'entry' ? [] : [5, 4]);
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.setLineDash([]); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(level.label, width - pad.right - 2, yy - 2);
      ctx.restore();
    }
    ctx.fillStyle = muted; ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left'; ctx.fillText(formatChartDate(points[0].date), pad.left, height - 3);
    ctx.textAlign = 'right'; ctx.fillText(formatChartDate(points[points.length - 1].date), width - pad.right, height - 3);
    const change = (points[points.length - 1].close - points[0].close) / points[0].close * 100;
    const calendarReturn = detailRecord.returns && detailRecord.returns[detailRange];
    const displayedReturn = calendarReturn == null ? change : Number(calendarReturn);
    summary.innerHTML = `<span>${points.length.toLocaleString()} observations</span><strong class="${returnClass(displayedReturn)}">${formatReturn(displayedReturn)}</strong>`;
  }

  function fmtPrice(v) {
    if (v == null) return '—';
    if (v >= 1000) return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (v >= 1)    return '$' + v.toFixed(2);
    if (v >= 0.01) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Repaint legend after fonts/layout settle
  window.addEventListener('load', paintLegend);
  window.addEventListener('resize', () => {
    paintLegend();
    if (detailRecord) drawDetailChart();
  });
  document.getElementById('detail-overlay').addEventListener('click', event => {
    if (event.target.id === 'detail-overlay') closeTickerDetail();
  });
  document.addEventListener('keydown', event => {
    if (document.getElementById('detail-overlay').hidden) return;
    if (event.key === 'Escape') {
      closeTickerDetail();
    } else if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && !event.altKey
               && !event.ctrlKey && !event.metaKey && !/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) {
      stepTickerDetail(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  loadData().then(() => {
    const requestedTicker = new URLSearchParams(window.location.search).get('ticker');
    if (!requestedTicker) return;
    const normalized = requestedTicker.toUpperCase();
    const trigger = [...document.querySelectorAll('.ticker-card')]
      .find(card => card.dataset.ticker === normalized && !card.disabled);
    if (trigger) openTickerDetail(normalized, trigger);
  });
</script>
</body>
</html>
