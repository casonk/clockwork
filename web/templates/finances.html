<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, user-scalable=yes">
  <title>Finances — Clockwork</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      font-size: var(--font-size); line-height: 1.5; min-height: 100vh;
    }
    .page { max-width: 760px; margin: 0 auto; padding: 14px 16px 48px; display: grid;
            grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px; min-width: 0; }
    h2 { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
         color: var(--muted); margin-bottom: 10px; }
    [hidden] { display: none !important; }
    .muted { color: var(--muted); }
    .money { font-variant-numeric: tabular-nums; }
    body.hide-amounts .money { filter: blur(7px); }

    /* hero */
    .hero-top { display: flex; align-items: flex-start; gap: 10px; }
    .hero-top > div { flex: 1; min-width: 0; }
    .hero-label { font-size: 12px; color: var(--muted); }
    .hero-value { font-size: clamp(30px, 9vw, 44px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .hero-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .eye { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; min-width: 44px; min-height: 44px; font-size: 18px; cursor: pointer; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
            background: var(--surface2); white-space: nowrap; }
    .chip.up { color: var(--green); background: var(--green-dim); border-color: transparent; }
    .chip.down { color: var(--red); background: var(--red-dim); border-color: transparent; }

    /* notice */
    .notice { border-color: var(--yellow); background: var(--yellow-dim); font-size: 14px; }
    .notice strong { color: var(--text); }

    /* controls */
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { background: var(--surface2); color: var(--muted); border: 0; min-height: 44px;
                  padding: 0 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
               margin-bottom: 8px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; cursor: pointer; }
    .switch input { width: 20px; height: 20px; accent-color: var(--accent); }

    /* chart */
    .chart-wrap { position: relative; touch-action: pan-y; }
    svg.chart { display: block; width: 100%; height: 220px; overflow: visible; }
    .grid-line { stroke: var(--border); stroke-width: 1; opacity: .7; }
    .grid-line.v { opacity: .35; }
    .dot.sm { stroke-width: 1.5; }
    .axis-text { fill: var(--muted); font-size: 11px; }
    .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .area { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }
    .band { fill: color-mix(in srgb, var(--yellow) 9%, transparent); stroke: none; }
    .zero-line { stroke: var(--muted); stroke-width: 1; opacity: .8; }
    .cat-line { fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .cat-label { fill: var(--muted); font-size: 11px; }
    .mk { stroke: var(--surface); stroke-width: 1.5; paint-order: stroke; }
    .mk-green { fill: var(--green); } .mk-red { fill: var(--red); } .mk-yellow { fill: var(--yellow); }
    .mk-na { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; }
    .chart-legend svg { width: 22px; height: 12px; overflow: visible; }
    .stk { stroke: var(--surface); stroke-width: 1.5; stroke-linejoin: round; }
    .chart-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .chart-legend span { min-width: 0; }
    .chart-legend .lg, .tip .row .lg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .tip .row > span:first-child { min-width: 0; flex: 1; }
    .tip { max-width: 260px; }
    .sw-box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
    .tip .sw-box { margin-right: 6px; }
    .tip .row span:first-child { display: inline-flex; align-items: center; min-width: 0; }
    .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
    .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface2); border: 1px solid var(--border);
           border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; min-width: 150px;
           box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 2; }
    .tip b { font-size: 14px; display: block; }
    .tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
    .tip .row span:last-child { color: var(--text); }
    details.table-view { margin-top: 8px; font-size: 13px; }
    details.table-view summary { cursor: pointer; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
    details.table-view .scroll { max-height: 260px; overflow: auto; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data th, table.data td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    table.data th:first-child, table.data td:first-child { text-align: left; }

    /* composition */
    .stack { display: flex; gap: 2px; height: 16px; }
    .stack > span { display: block; min-width: 3px; }
    .stack > span:first-child { border-radius: 4px 0 0 4px; }
    .stack > span:last-child { border-radius: 0 4px 4px 0; }
    .legend { margin-top: 12px; display: grid; gap: 2px; }
    .legend-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
                  min-height: 40px; font-size: 14px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .legend-row .pct { color: var(--muted); font-size: 12px; min-width: 38px; text-align: right; }

    /* accounts */
    .group-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin: 6px 0 6px; }
    .group-head h3 { font-size: 15px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .card-head h2 { margin: 0; }
    #ap-title { text-transform: none; letter-spacing: 0; font-size: 16px; color: var(--text); }
    .pop { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; min-width: 44px;
           min-height: 44px; font-size: 18px; cursor: pointer; }
    .pop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .acct-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
    .acct-card.uncounted { opacity: .72; }
    .chart-wrap.hist svg.chart { height: 150px; }
    body.popout .page > *:not(.pop-target) { display: none !important; }
    body.popout .pop { display: none; }
    .fs-close { display: none; }
    .fs-card { position: fixed; left: 0; right: 0; bottom: 0; top: var(--fs-top, 0px); z-index: 150; margin: 0; border-radius: 0;
               overflow: auto; max-width: none; padding: 14px clamp(12px, 3vw, 40px); }
    .fs-card .fs-close { display: inline-flex; align-items: center; justify-content: center; }
    .fs-card .pop:not(.fs-close) { display: none; }
    body.fs-lock { overflow: hidden; }
    .head-actions { display: flex; gap: 8px; }
    body.popout .page { max-width: none; }
    .acct { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
            border-radius: 10px; padding: 10px 12px; margin-bottom: 0; font: inherit; cursor: pointer; min-height: 56px; display: block; }
    .acct:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .acct-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .acct-name { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
    .acct-bal { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .acct-bal.neg::before { content: "−"; }
    .acct-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 3px; }
    .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
    .badge.warn { color: var(--yellow); background: var(--yellow-dim); border-color: transparent; }
    .acct-detail { margin: 0 12px 12px; border-top: 1px solid var(--border); padding-top: 8px; }
    svg.spark { display: block; width: 100%; height: 64px; }
    .spark-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

    /* freshness */
    .fresh-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
                 padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .fresh-row:last-child { border-bottom: 0; }
    .fresh-row .why { grid-column: 2 / 4; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .ok { color: var(--green); } .bad { color: var(--red); } .warnc { color: var(--yellow); }

    /* filters */
    #filters > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; list-style: none; }
    #filters > summary::before { content: '▸'; color: var(--muted); }
    #filters[open] > summary::before { content: '▾'; }
    #filters-summary { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .filters-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 8px; }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
    input[type="month"] { font: inherit; font-size: 16px; color: var(--text); background: var(--surface2); border: 1px solid var(--border);
                          border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0; color-scheme: light dark; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .tool { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
            min-height: 44px; padding: 0 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .tool:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pick-group { border-top: 1px solid var(--border); padding-top: 6px; }
    .pick-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 44px; font-size: 14px; cursor: pointer; }
    .pick-row input { width: 20px; height: 20px; accent-color: var(--accent); }
    .pick-row .nm { overflow-wrap: anywhere; }
    .pick-row.head { font-weight: 700; }
    .pick-row .bal { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .error-card { color: var(--red); font-size: 14px; }
    .skeleton { color: var(--muted); font-size: 14px; }
  </style>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='site-nav.css') }}">
</head>
<body>
{% include "_site_nav.html" %}

<main class="page">
  <section class="card" id="hero" aria-live="polite"><div class="skeleton">Loading…</div></section>
  <section class="card notice" id="notice" hidden></section>

  <details class="card" id="filters">
    <summary><span>⚙</span><span id="filters-summary">Accounts and dates</span></summary>
    <div class="filters-body">
      <div class="field-row">
        <label>From <input type="month" id="from" aria-label="From month"></label>
        <label>To <input type="month" id="to" aria-label="To month"></label>
      </div>
      <div class="seg" id="presets" role="group" aria-label="Date shortcuts">
        <button type="button" data-p="1y">1Y</button><button type="button" data-p="3y">3Y</button><button type="button" data-p="ytd">YTD</button><button type="button" data-p="all">All</button>
      </div>
      <div class="tools" id="tools">
        <button type="button" class="tool" data-act="counted">Counted accounts</button>
        <button type="button" class="tool" data-act="none">None</button>
        <button type="button" class="tool" data-act="everything">Everything</button>
      </div>
      <label class="switch"><input type="checkbox" id="show-out"> Show accounts not in totals</label>
      <div id="picker"></div>
    </div>
  </details>

  <section class="card" id="chart-card">
    <div class="card-head"><h2>Net worth over time</h2><div class="head-actions">
      <button type="button" class="pop" id="fs-chart" aria-label="Full screen" title="Full screen (Esc to close)">⛶</button>
      <button type="button" class="pop" id="pop-chart" aria-label="Open the chart in its own window" title="Open in its own window (resizable, keeps the top bar and theme)">⧉</button>
      <button type="button" class="pop fs-close" id="fs-close" aria-label="Close full screen" title="Close (Esc)">✕</button>
    </div></div>
    <div class="toolbar">
      <div class="seg" id="view" role="group" aria-label="Chart view">
        <button type="button" data-v="total" aria-pressed="true">Total</button>
        <button type="button" data-v="category" aria-pressed="false">By category</button>
        <button type="button" data-v="account" aria-pressed="false">By account</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="seg" id="gran" role="group" aria-label="Detail level">
        <button type="button" data-g="month" aria-pressed="true" title="One point per month, from statements">Month-end</button>
        <button type="button" data-g="day" aria-pressed="false" title="One point per day; Schwab accounts are rebuilt daily from their order history">Daily</button>
      </div>
    </div>
    <div class="toolbar">
      <label class="switch"><input type="checkbox" id="with-cash" checked> Include cash</label>
      <label class="switch" id="cats-switch"><input type="checkbox" id="show-cats"> Show categories</label>
    </div>
    <div class="chart-wrap" id="chart-wrap"><svg class="chart" id="chart" role="img" aria-label="Net worth over time"></svg><div class="tip" id="tip" hidden></div></div>
    <div class="chart-legend" id="chart-legend"></div>
    <div class="hero-sub" id="chart-note"></div>
    <details class="table-view"><summary>Table view</summary><div class="scroll" id="table"></div></details>
  </section>

  <section class="card" id="account-pop" hidden>
    <div class="card-head"><h2 id="ap-title">Account</h2><div class="head-actions"><button type="button" class="pop fs-close" id="ap-close" aria-label="Close full screen" title="Close (Esc)">✕</button></div></div>
    <div class="hero-sub" id="ap-meta"></div>
    <div id="ap-chart"></div>
    <details class="table-view"><summary>Table view</summary><div class="scroll" id="ap-table"></div></details>
  </section>

  <section class="card"><h2>What it is made of</h2><div id="mix"></div></section>
  <section class="card"><h2>Accounts</h2><div id="accounts"></div></section>
  <section class="card"><h2>Data freshness</h2><div id="fresh"></div></section>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const usd0 = new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD', maximumFractionDigits: 0});
  const usd2 = new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'});
  const money = (n, exact) => (exact ? usd2 : usd0).format(n ?? 0);
  const compact = (n) => {
    const a = Math.abs(n);
    const s = a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : String(Math.round(a));
    return (n < 0 ? '−$' : '$') + s;
  };
  const monthName = (m) => new Date(m + '-15').toLocaleDateString('en-US', {month: 'short', year: 'numeric'});
  const dayName = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});

  const GROUP_LABELS = {invest: 'Investments', bank: 'Cash', crypt: 'Crypto', cred: 'Credit'};
  const GROUP_ORDER = ['invest', 'bank', 'crypt', 'cred'];
  const state = {gran: 'month', view: 'total', meta: {}, summary: null, all: [], points: [], thresholds: {green: 0.05, red: -0.05}, cats: false, cash: true, open: null,
                 mode: 'default', ids: new Set(), from: '', to: '', showOut: false, bounds: {first: '', last: ''}};
  const KEY = 'finances-filter';
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (p && typeof p === 'object') {
        state.mode = p.mode === 'custom' ? 'custom' : 'default';
        state.ids = new Set(Array.isArray(p.ids) ? p.ids.filter((i) => typeof i === 'string') : []);
        state.from = /^\d{4}-\d{2}$/.test(p.from || '') ? p.from : '';
        state.to = /^\d{4}-\d{2}$/.test(p.to || '') ? p.to : '';
        state.showOut = !!p.showOut;
      }
    } catch (e) {}
  }
  function savePrefs() {
    try { localStorage.setItem(KEY, JSON.stringify({mode: state.mode, ids: [...state.ids], from: state.from, to: state.to, showOut: state.showOut})); } catch (e) {}
  }
  try { if (localStorage.getItem('finances-hide') === '1') document.body.classList.add('hide-amounts'); } catch (e) {}

  async function api(path, params) {
    const q = params && params.toString() ? '?' + params.toString() : '';
    const r = await fetch('/api/finances/' + path + q, {headers: {Accept: 'application/json'}});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
    return r.json();
  }
  const isSelected = (a) => state.mode === 'custom' ? state.ids.has(a.id) : a.counted;
  const displayed = () => state.all.filter(isSelected);
  function queryParams() {
    const p = new URLSearchParams();
    if (state.mode === 'custom') p.set('accounts', [...state.ids].join(','));
    if (state.from) p.set('from', state.from);
    if (state.to) p.set('to', state.to);
    return p;
  }
  const monthLabel = (m) => m ? monthName(m) : '';

  function renderHero() {
    const s = state.summary;
    const sel = displayed();
    if (!sel.length) {
      $('hero').innerHTML = '<div class="hero-label">No accounts selected</div><div class="hero-sub">Pick accounts under Accounts and dates.</div>';
      return;
    }
    const chip = (label, d) => {
      if (!d) return '';
      const up = d.amount >= 0;
      const basis = d.accounts ? `Across the ${d.accounts} accounts counted at both ends; accounts that started reporting in between are left out.` : '';
      return `<span class="chip ${up ? 'up' : 'down'}" title="${esc(basis)}">${up ? '▲' : '▼'} ${up ? '+' : '−'}${esc(money(Math.abs(d.amount)))} (${up ? '+' : '−'}${Math.abs(d.percent).toFixed(1)}%) ${label}</span>`;
    };
    const custom = state.mode === 'custom';
    const label = custom ? `Selected accounts (${sel.length} of ${state.all.length})` : 'Net worth, including cash';
    const rangeChip = s.change.range ? chip(`${monthLabel(state.from)} → ${monthLabel(state.to || state.bounds.last)}`, s.change.range) : '';
    $('hero').innerHTML = `
      <div class="hero-top"><div>
        <div class="hero-label">${esc(label)}</div>
        <div class="hero-value money">${esc(money(s.net_worth_with_cash))}</div>
        <div class="hero-sub"><span class="money">${esc(money(s.net_worth))}</span> invested and credit · <span class="money">${esc(money(s.cash))}</span> cash · as of ${esc(dayName(s.as_of))}</div>
      </div><button class="eye" id="eye" type="button" aria-label="Hide or show amounts" title="Hide or show amounts">👁</button></div>
      <div class="chips">${rangeChip}${chip('1 mo', s.change.month)}${chip('3 mo', s.change.quarter)}${chip('1 yr', s.change.year)}</div>
      <div class="hero-sub">Changes compare the same accounts over time; new accounts are not counted as growth.${custom ? ' Chosen accounts all count, so a statement and the Plaid account that replaced it would be counted twice.' : ''}</div>`;
    $('eye').onclick = () => {
      const on = document.body.classList.toggle('hide-amounts');
      try { localStorage.setItem('finances-hide', on ? '1' : '0'); } catch (e) {}
    };
  }

  function renderNotice() {
    const el = $('notice');
    const stale = displayed().filter((a) => a.stale);
    if (!stale.length || !state.summary) { el.hidden = true; return; }
    const worth = stale.reduce((t, a) => t + Math.abs(a.balance), 0);
    const total = Math.abs(state.summary.net_worth_with_cash) || 1;
    const dupes = displayed().filter((a) => a.possible_duplicate).length;
    el.hidden = false;
    el.innerHTML = `⚠ <strong>${stale.length} ${stale.length === 1 ? 'balance is' : 'balances are'} older than 45 days</strong>, worth <span class="money">${esc(money(worth))}</span> (${Math.round(100 * worth / total)}% of the total). They still count at their last statement.` +
      (dupes ? ` ${dupes} ${dupes === 1 ? 'account shares' : 'accounts share'} an identical balance with another and may be counted twice.` : '');
  }

  /* ---- filters ---- */
  function renderFilters() {
    const n = displayed().length;
    $('filters-summary').textContent = `${n} of ${state.all.length} accounts · ${state.from ? monthLabel(state.from) : 'start'} – ${state.to ? monthLabel(state.to) : 'now'}`;
    $('from').value = state.from; $('to').value = state.to;
    if (state.bounds.first) { $('from').min = $('to').min = state.bounds.first; $('from').max = $('to').max = state.bounds.last; }
    $('show-out').checked = state.showOut;
    const groups = GROUP_ORDER.map((cat) => {
      const list = state.all.filter((a) => a.category === cat && (state.showOut || a.counted || isSelected(a)) && (a.balance !== 0 || a.counted));
      if (!list.length) return '';
      const on = list.filter(isSelected).length;
      const rows = list.map((a) => `<label class="pick-row"><input type="checkbox" data-id="${esc(a.id)}" ${isSelected(a) ? 'checked' : ''}>
        <span class="nm">${esc(short(a.label))}${a.counted ? '' : ' <span class="badge">not in totals</span>'}${a.stale ? ' <span class="badge warn">⚠ ' + a.age_days + 'd</span>' : ''}</span>
        <span class="bal money">${esc(money(a.balance))}</span></label>`).join('');
      return `<div class="pick-group"><label class="pick-row head"><input type="checkbox" data-group="${cat}" ${on === list.length ? 'checked' : ''}>
        <span>${esc(GROUP_LABELS[cat])}</span><span class="bal">${on} of ${list.length}</span></label>${rows}</div>`;
    }).join('');
    $('picker').innerHTML = groups;
    document.querySelectorAll('#picker input[data-group]').forEach((el) => {
      const list = state.all.filter((a) => a.category === el.dataset.group && (state.showOut || a.counted || isSelected(a)) && (a.balance !== 0 || a.counted));
      const on = list.filter(isSelected).length;
      el.indeterminate = on > 0 && on < list.length;
    });
  }
  function toCustom() {
    if (state.mode !== 'custom') { state.ids = new Set(state.all.filter((a) => a.counted).map((a) => a.id)); state.mode = 'custom'; }
  }
  let timer = null;
  const changed = () => { savePrefs(); renderFilters(); clearTimeout(timer); timer = setTimeout(refresh, 200); };

  function wireFilters() {
    $('picker').addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.id) { toCustom(); t.checked ? state.ids.add(t.dataset.id) : state.ids.delete(t.dataset.id); }
      else if (t.dataset.group) {
        toCustom();
        state.all.filter((a) => a.category === t.dataset.group && (state.showOut || a.counted || state.ids.has(a.id)) && (a.balance !== 0 || a.counted))
          .forEach((a) => (t.checked ? state.ids.add(a.id) : state.ids.delete(a.id)));
      } else return;
      changed();
    });
    $('tools').addEventListener('click', (e) => {
      const act = e.target.closest('button')?.dataset.act; if (!act) return;
      if (act === 'counted') { state.mode = 'default'; state.ids = new Set(); }
      if (act === 'none') { state.mode = 'custom'; state.ids = new Set(); }
      if (act === 'everything') { state.mode = 'custom'; state.showOut = true; state.ids = new Set(state.all.map((a) => a.id)); }
      changed();
    });
    $('show-out').addEventListener('change', (e) => { state.showOut = e.target.checked; savePrefs(); renderFilters(); });
    $('from').addEventListener('change', (e) => { state.from = e.target.value; changed(); });
    $('to').addEventListener('change', (e) => { state.to = e.target.value; changed(); });
    $('presets').addEventListener('click', (e) => {
      const p = e.target.closest('button')?.dataset.p; if (!p || !state.bounds.last) return;
      const last = state.bounds.last, [y, m] = last.split('-').map(Number);
      const back = (n) => { const t = y * 12 + (m - 1) - n; return `${Math.floor(t / 12)}-${String((t % 12) + 1).padStart(2, '0')}`; };
      state.to = '';
      state.from = p === '1y' ? back(11) : p === '3y' ? back(35) : p === 'ytd' ? `${y}-01` : '';
      changed();
    });
  }

  async function refresh() {
    const sel = displayed();
    if (!sel.length) {
      state.summary = {change: {}}; state.points = [];
      renderHero(); renderNotice(); drawChart(); renderMix(); renderAccounts(); return;
    }
    const params = queryParams();
    const nwParams = new URLSearchParams(params);
    if (state.view === 'account') nwParams.set('by', 'account');
    if (state.gran === 'day') nwParams.set('granularity', 'daily');
    try {
      const [summary, nw] = await Promise.all([api('summary', params), api('networth', nwParams)]);
      state.summary = summary; state.points = nw.points; if (nw.thresholds) state.thresholds = nw.thresholds;
      state.meta = Object.fromEntries((nw.accounts || []).map((a) => [a.id, a]));
      renderHero(); renderNotice(); drawChart(); renderMix(); renderAccounts();
    } catch (e) {
      $('hero').innerHTML = `<div class="error-card">Could not load finances: ${esc(e.message)}</div>`;
    }
  }

  /* ---- ticks ---- */
  const NICE_STEPS = [1, 2, 2.5, 5, 10];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // Round values on the value axis: steps of 1, 2, 2.5, 5 times a power of ten, as many as fit.
  function niceTicks(lo, hi, maxTicks) {
    const span = (hi - lo) || 1, mag = Math.pow(10, Math.floor(Math.log10(span / Math.max(1, maxTicks))));
    const steps = [...new Set([mag / 10, mag, mag * 10].flatMap((m) => NICE_STEPS.map((n) => Math.round(n * m * 1e6) / 1e6)))].sort((x, y) => x - y);
    const at = (step) => { const out = []; for (let k = Math.ceil(lo / step - 1e-9); k * step <= hi + step * 1e-6; k++) out.push(Math.round(k * step * 100) / 100); return out; };
    // the finest round step that still fits, but never fewer than three ticks when a finer step gives them
    let pick = steps.find((st) => at(st).length <= maxTicks) || steps[steps.length - 1];
    let ticks = at(pick);
    if (ticks.length < 3) { const finer = [...steps].reverse().find((st) => st < pick && at(st).length >= 3); if (finer) { pick = finer; ticks = at(finer); } }
    return {ticks, step: pick};
  }
  function tickLabel(v, step) {
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    if (a >= 1e6) return `${sign}$${+(a / 1e6).toFixed(step < 1e5 ? 2 : 1)}M`;
    if (a >= 1e3) return `${sign}$${+(a / 1e3).toFixed(step % 1e3 ? 1 : 0)}K`;
    return `${sign}$${Math.round(a)}`;
  }
  const ordOf = (m) => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
  const ordFrac = (d) => { const [y, mo, da] = d.split('-').map(Number); return y * 12 + mo - 1 + ((da || 1) - 1) / 30.5; };
  // Calendar-aligned date ticks: every month, 2, 3, 6, 12, 24... months, whichever fits the width.
  function monthAxis(ordFirst, ordLast, plotW) {
    const maxTicks = Math.max(2, Math.floor(plotW / 62)), span = ordLast - ordFirst + 1;
    const step = [1, 2, 3, 6, 12, 24, 60, 120].find((st) => Math.ceil(span / st) <= maxTicks) || 120;
    const out = [];
    for (let o = Math.ceil(ordFirst / step) * step; o <= ordLast; o += step) {
      const y = Math.floor(o / 12), m = o % 12;
      out.push({ord: o, label: step >= 12 ? String(y) : `${MONTHS[m]}${m === 0 || !out.length ? ' ’' + String(y).slice(2) : ''}`});
    }
    return out;
  }
  const xLabels = (ticks, xo, W, H) => ticks.map((t) => {
    const x = xo(t.ord), anchor = x < 24 ? 'start' : x > W - 24 ? 'end' : 'middle';
    return `<text class="axis-text" x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${esc(t.label)}</text>`;
  }).join('');
  const xGrid = (ticks, xo, T, H, B) => ticks.map((t) => `<line class="grid-line v" x1="${xo(t.ord).toFixed(1)}" x2="${xo(t.ord).toFixed(1)}" y1="${T}" y2="${H - B}"/>`).join('');
  const yGrid = (nt, y, L, W, R) => nt.ticks.map((t) => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="axis-text" x="${L + 2}" y="${(y(t) - 4).toFixed(1)}">${esc(tickLabel(t, nt.step))}</text>`).join('');

  /* ---- pop-out (the same page in its own window, like Tradility's detail) ---- */
  const QS = new URLSearchParams(window.location.search);
  const IS_POPOUT = QS.get('window') === '1';
  if (IS_POPOUT) document.body.classList.add('popout');
  let FS = null; // the card currently shown full screen
  const chartH = (base) => (IS_POPOUT || FS ? Math.max(320, window.innerHeight - 300) : base);
  function placeFs() {
    const nav = document.querySelector('.cw-site-nav');
    document.documentElement.style.setProperty('--fs-top', (nav ? Math.max(0, Math.round(nav.getBoundingClientRect().bottom)) : 0) + 'px');
  }
  function openFs(el) {
    closeFs();
    FS = el; placeFs();
    el.hidden = false; el.classList.add('fs-card'); document.body.classList.add('fs-lock');
    try { const r = el.requestFullscreen && el.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
    window.scrollTo(0, 0); el.scrollTop = 0;
  }
  function closeFs() {
    if (!FS) return;
    const el = FS; FS = null;
    el.classList.remove('fs-card'); document.body.classList.remove('fs-lock');
    if (el.id === 'account-pop' && !IS_POPOUT) { el.hidden = true; $('ap-chart').innerHTML = ''; }
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
    if (el.id === 'chart-card') requestAnimationFrame(() => drawChart());
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFs(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) closeFs(); });
  window.addEventListener('resize', () => { if (FS) { placeFs(); if (FS.id === 'chart-card') drawChart(); } });
  const popOut = (query, name) => window.open(`${window.location.pathname}?${query}`, name, 'popup=yes,width=1240,height=900,resizable=yes,scrollbars=yes');

  /* ---- one account's balance history ---- */
  function mountHistoryChart(box, pts, height) {
    box.innerHTML = '<div class="chart-wrap hist"><svg class="chart" role="img" aria-label="Balance history"></svg><div class="tip" hidden></div></div>';
    const wrap = box.firstChild, svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
    const t = pts.map((p) => ordFrac(p.as_of));
    const draw = () => {
      const W = svg.clientWidth || 300, H = height, L = 6, R = 8, T = 10, B = 24;
      svg.style.height = H + 'px'; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const vs = pts.map((p) => p.balance);
      let lo = Math.min(...vs), hi = Math.max(...vs); if (hi === lo) { hi += 1; lo -= 1; }
      const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
      const t0 = t[0], t1 = t[t.length - 1];
      const xo = (o) => L + ((o - t0) * (W - L - R)) / ((t1 - t0) || 1);
      const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
      const nt = niceTicks(lo, hi, Math.max(3, Math.floor((H - T - B) / 42)));
      const ax = monthAxis(Math.floor(t0), Math.floor(t1), W - L - R).filter((k) => k.ord >= t0 - 0.01);
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${xo(t[i]).toFixed(1)},${y(p.balance).toFixed(1)}`).join('');
      // statements (and API snapshots) get a dot; between them a daily line is rebuilt from orders
      const hasSource = pts.some((p) => p.source);
      const dots = pts.map((p, i) => ((hasSource ? p.source === 'actual' : pts.length <= 60)
        ? `<circle class="dot sm" cx="${xo(t[i]).toFixed(1)}" cy="${y(p.balance).toFixed(1)}" r="3"/>` : '')).join('');
      svg.innerHTML = `${xGrid(ax, xo, T, H, B)}${yGrid(nt, y, L, W, R)}${xLabels(ax, xo, W, H)}<path class="line" d="${d}"/>${dots}<line class="cross" hidden/>`;
      svg._geo = {xo, W};
    };
    const move = (ev) => {
      const g = svg._geo, rect = svg.getBoundingClientRect(); if (!g) return;
      const px = ((ev.clientX - rect.left) / rect.width) * g.W;
      let best = 0, bd = Infinity;
      pts.forEach((_, i) => { const dd = Math.abs(g.xo(t[i]) - px); if (dd < bd) { bd = dd; best = i; } });
      const cx = g.xo(t[best]), cross = svg.querySelector('.cross');
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('y1', 10); cross.setAttribute('y2', height - 24); cross.removeAttribute('hidden');
      const pt = pts[best];
      const how = !pt.source ? '' : pt.source === 'actual' ? '<div class="muted">Statement or snapshot</div>'
        : `<div class="muted">Rebuilt from order history${pt.adjustment ? ' (' + (pt.adjustment < 0 ? '−' : '+') + esc(money(Math.abs(pt.adjustment), true)) + ' to meet statements)' : ''}</div>`;
      tip.innerHTML = `<b class="money">${esc(money(pt.balance, true))}</b><span class="muted">${esc(dayName(pt.as_of))}</span>${how}`;
      tip.hidden = false;
      const w = tip.offsetWidth, left = (cx / g.W) * wrap.clientWidth;
      tip.style.left = Math.max(0, Math.min(wrap.clientWidth - w, left - w / 2)) + 'px';
    };
    const leave = () => { tip.hidden = true; const c = svg.querySelector('.cross'); if (c) c.setAttribute('hidden', ''); };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', leave); svg.addEventListener('pointercancel', leave);
    draw();
    if (window.ResizeObserver) new ResizeObserver(draw).observe(wrap);
    if (pts.some((p) => p.source === 'reconstructed')) {
      box.insertAdjacentHTML('beforeend', '<div class="hero-sub hist-note">● Statements and API snapshots. The line between them is rebuilt day by day from the order history and adjusted to meet them.</div>');
    }
  }

  /* ---- net worth chart ---- */
  // A point is a month ("2026-02") or, in daily mode, a day ("2026-02-03").
  const isDaily = () => state.gran === 'day';
  const pKey = (p) => (isDaily() && p.date ? p.date : p.month);
  const pLabel = (key) => (key.length > 7 ? dayName(key) : monthName(key));
  const pOrd = (key) => (key.length > 7 ? ordFrac(key) : ordOf(key));
  const series = () => {
    const pts = state.points;
    return pts.map((p) => ({m: pKey(p), v: state.cash ? p.total_with_cash : p.total, p}));
  };

  const CATS = [
    {k: 'invest', label: 'Investments', dash: '', stroke: 'color-mix(in srgb, var(--accent) 65%, var(--text))'},
    {k: 'bank', label: 'Cash', dash: '6 4', stroke: 'var(--muted)'},
    {k: 'crypt', label: 'Crypto', dash: '2 3', stroke: 'color-mix(in srgb, var(--accent) 40%, var(--text))'},
    {k: 'cred', label: 'Credit', dash: '8 3 2 3', stroke: 'var(--muted)'},
  ];
  const pct = (r) => (r == null ? 'n/a' : (r >= 0 ? '+' : '−') + Math.abs(r * 100).toFixed(1) + '%');
  const SIGNAL_WORD = {green: 'strong month', yellow: 'steady', red: 'weak month', 'n/a': 'first month'};
  function marker(sig, cx, cy, r) {
    cx = Number(cx); cy = Number(cy);
    if (sig === 'green') return `<path class="mk mk-green" d="M${cx},${cy - r * 1.3}L${cx + r * 1.2},${cy + r * 0.9}L${cx - r * 1.2},${cy + r * 0.9}Z"/>`;
    if (sig === 'red') return `<path class="mk mk-red" d="M${cx},${cy + r * 1.3}L${cx + r * 1.2},${cy - r * 0.9}L${cx - r * 1.2},${cy - r * 0.9}Z"/>`;
    if (sig === 'yellow') return `<circle class="mk mk-yellow" cx="${cx}" cy="${cy}" r="${r}"/>`;
    return `<circle class="mk-na" cx="${cx}" cy="${cy}" r="${r * 0.8}"/>`;
  }

  function drawChart() {
    $('cats-switch').hidden = state.view !== 'total';
    $('chart-note').textContent = state.view === 'account'
      ? `Each band is one account's balance, stacked; the ${MAX_ACCOUNTS} largest are shown and the rest are grouped. Steps can be an account starting to report.`
      : state.view === 'category'
        ? 'Each band is a type of account, stacked. Steps can be an account starting to report.'
        : "Each dot is a month, colored by its growth over the same accounts (the pipeline's thresholds). Steps in the line can still be an account starting to report.";
    if (state.view !== 'total') return drawStacked();
    const svg = $('chart'), data = series();
    const W = svg.clientWidth || 320, H = chartH(state.cats ? 260 : 220), L = 6, R = state.cats ? 58 : 8, T = 12, B = 24;
    svg.style.height = H + 'px';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    if (data.length < 2) { $('table').innerHTML = ''; $('chart-legend').innerHTML = ''; svg.innerHTML = '<text class="axis-text" x="8" y="40">Not enough history yet.</text>'; return; }
    const daily = isDaily();
    const band = daily ? 0 : Math.max(Math.abs(state.thresholds.green), Math.abs(state.thresholds.red));
    const vals = data.flatMap((d) => [d.v, d.v - Math.abs(d.v) * band, d.v + Math.abs(d.v) * band]);
    if (state.cats) CATS.forEach((c) => data.forEach((d) => vals.push(d.p[c.k] || 0)));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (state.cats || (lo < 0 && hi > 0)) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (hi === lo) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
    const x = (i) => L + (i * (W - L - R)) / (data.length - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const line = (get) => data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(get(d)).toFixed(1)}`).join('');
    const path = line((d) => d.v);
    const upper = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.v + Math.abs(d.v) * band).toFixed(1)}`).join('');
    const lower = data.slice().reverse().map((d, i) => `L${x(data.length - 1 - i).toFixed(1)},${y(d.v - Math.abs(d.v) * band).toFixed(1)}`).join('');
    const base = lo < 0 && hi > 0 ? 0 : lo;
    const nt = niceTicks(lo, hi, Math.max(3, Math.floor((H - T - B) / 44)));
    const grid = yGrid(nt, y, L, W, R);
    const zero = lo < 0 && hi > 0 ? `<line class="zero-line" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>` : '';
    const ords = data.map((d) => pOrd(d.m));
    const xo = (o) => L + ((o - ords[0]) * (W - L - R)) / ((ords[ords.length - 1] - ords[0]) || 1);
    const ax = monthAxis(ords[0], ords[ords.length - 1], W - L - R);
    const xl = xLabels(ax, xo, W, H), vgrid = xGrid(ax, xo, T, H, B);
    let cats = '', labels = [];
    if (state.cats) {
      cats = CATS.map((c) => `<path class="cat-line" stroke="${c.stroke}" stroke-dasharray="${c.dash}" d="${line((d) => d.p[c.k] || 0)}"/>`).join('');
      labels = CATS.map((c) => ({c, y: y(data[data.length - 1].p[c.k] || 0)})).sort((a, b) => a.y - b.y);
      for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 12) labels[i].y = labels[i - 1].y + 12;
      cats += labels.map((l) => `<text class="cat-label" x="${W - R + 4}" y="${l.y + 4}">${esc(l.c.label)}</text>`).join('');
    }
    const r = data.length > 60 ? 2.8 : data.length > 30 ? 3.4 : 4.2;
    // the growth signals describe a month's step, so a daily line carries none
    const marks = daily ? '' : data.map((d, i) => marker(d.p.growth_signal, x(i).toFixed(1), y(d.v).toFixed(1), r)).join('');
    svg.innerHTML = `${vgrid}${grid}${zero}${xl}${daily ? '' : `<path class="band" d="${upper}${lower}Z"/>`}<path class="area" d="${path}L${x(data.length - 1)},${y(base)}L${x(0)},${y(base)}Z"/>${cats}<path class="line" d="${path}"/>${marks}
      <line class="cross" id="cross" y1="${T}" y2="${H - B}" hidden/><circle class="dot" id="dot" r="5" hidden/>`;
    svg._geo = {x, y, data, W, H, dot: true};

    $('chart-legend').innerHTML =
      (daily ? '' : `<span>${sw(marker('green', 11, 6, 4))} ${esc(pct(g))} or more</span>` +
      `<span>${sw(marker('yellow', 11, 6, 4))} within ${esc((Math.abs(g) * 100).toFixed(0))}%</span>` +
      `<span>${sw(marker('red', 11, 6, 4))} ${esc(pct(rd))} or less</span>`) +
      `<span>${sw('<line x1="0" x2="22" y1="6" y2="6" stroke="var(--accent)" stroke-width="2"/>')} Total</span>` +
      (state.cats ? CATS.map((c) => `<span>${sw(`<line x1="0" x2="22" y1="6" y2="6" stroke="${c.stroke}" stroke-width="1.5" stroke-dasharray="${c.dash}"/>`)} ${esc(c.label)}</span>`).join('') : '');
    $('table').innerHTML = `<table class="data"><tr><th>${daily ? 'Date' : 'Month'}</th><th>Total</th><th>Step</th><th>Invest</th><th>Cash</th><th>Credit</th></tr>` +
      data.slice().reverse().map((d) => `<tr><td>${esc(pLabel(d.m))}</td><td class="money">${esc(money(d.v))}</td><td>${daily ? '' : esc(pct(d.p.growth_rate)) + ' ' + esc(d.p.growth_signal)}</td><td class="money">${esc(money(d.p.invest))}</td><td class="money">${esc(money(d.p.cash))}</td><td class="money">${esc(money(d.p.cred))}</td></tr>`).join('') + '</table>';
  }

  /* ---- stacked views ---- */
  // Fixed order, never cycled: the theme's four chart hues at full then softer strength. A ninth
  // account would need a ninth hue, so everything past the eighth folds into "smaller accounts".
  const HUES = ['var(--accent)', 'var(--green)', 'var(--yellow)', 'var(--red)'];
  const slotColor = (i) => `color-mix(in srgb, ${HUES[i % 4]} ${i < 4 ? 100 : 55}%, var(--surface2))`;
  const tintColor = (cat) => slotColor(Math.max(0, GROUP_ORDER.indexOf(cat)));
  const OTHER = 'color-mix(in srgb, var(--muted) 55%, var(--surface2))';
  const MAX_ACCOUNTS = 8;

  function stackModel() {
    const pts = state.points;
    if (state.view === 'category') {
      const cats = GROUP_ORDER.filter((c) => (c !== 'bank' || state.cash) && pts.some((p) => p[c]));
      return {pts, series: cats.map((c) => ({key: c, label: GROUP_LABELS[c], color: tintColor(c), vals: pts.map((p) => p[c] || 0)}))};
    }
    const ids = new Set();
    pts.forEach((p) => Object.keys(p.by_account || {}).forEach((i) => ids.add(i)));
    let list = [...ids].map((id) => ({id, cat: (state.meta[id] || {}).category || 'invest', label: short((state.meta[id] || {}).label || id),
      vals: pts.map((p) => (p.by_account || {})[id] || 0)}))
      .filter((a) => state.cash || a.cat !== 'bank');
    const latest = (a) => Math.abs(a.vals[a.vals.length - 1]) || Math.max(...a.vals.map(Math.abs));
    list.sort((a, b) => latest(b) - latest(a));
    const top = list.slice(0, MAX_ACCOUNTS), rest = list.slice(MAX_ACCOUNTS);
    top.forEach((a, rank) => { a.color = slotColor(rank); });  // the colour follows the account's rank by balance
    top.sort((a, b) => GROUP_ORDER.indexOf(a.cat) - GROUP_ORDER.indexOf(b.cat) || latest(b) - latest(a));
    const series = top.map((a) => ({key: a.id, label: a.label, color: a.color, vals: a.vals}));
    if (rest.length) series.push({key: 'other', label: `${rest.length} smaller accounts`, color: OTHER, vals: pts.map((_, i) => rest.reduce((t, a) => t + a.vals[i], 0))});
    return {pts, series};
  }

  function drawStacked() {
    const svg = $('chart'), {pts, series: ser} = stackModel();
    const W = svg.clientWidth || 320, H = chartH(240), L = 6, R = 8, T = 12, B = 24;
    svg.style.height = H + 'px';
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    if (pts.length < 2 || !ser.length) { $('table').innerHTML = ''; $('chart-legend').innerHTML = ''; svg.innerHTML = '<text class="axis-text" x="8" y="40">Not enough history yet.</text>'; return; }
    const n = pts.length;
    const pos = Array(n).fill(0), neg = Array(n).fill(0);
    const bands = ser.map((s) => ({s, lo: [], hi: []}));
    bands.forEach((b) => b.s.vals.forEach((v, i) => {
      if (v >= 0) { b.lo[i] = pos[i]; pos[i] += v; b.hi[i] = pos[i]; } else { b.hi[i] = neg[i]; neg[i] += v; b.lo[i] = neg[i]; }
    }));
    let hi = Math.max(...pos, 1), lo = Math.min(...neg, 0);
    const pad = (hi - lo) * 0.04; hi += pad; if (lo < 0) lo -= pad;
    const x = (i) => L + (i * (W - L - R)) / (n - 1);
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const area = (b) => b.hi.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('') +
      b.lo.map((v, i) => `L${x(n - 1 - i).toFixed(1)},${y(b.lo[n - 1 - i]).toFixed(1)}`).join('') + 'Z';
    const nt = niceTicks(lo, hi, Math.max(3, Math.floor((H - T - B) / 44)));
    const grid = yGrid(nt, y, L, W, R);
    const ords = pts.map((p) => pOrd(pKey(p)));
    const xo = (o) => L + ((o - ords[0]) * (W - L - R)) / ((ords[n - 1] - ords[0]) || 1);
    const ax = monthAxis(ords[0], ords[n - 1], W - L - R);
    const xl = xLabels(ax, xo, W, H), vgrid = xGrid(ax, xo, T, H, B);
    const zero = lo < 0 ? `<line class="zero-line" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>` : '';
    svg.innerHTML = `${vgrid}${grid}${xl}${bands.map((b) => `<path class="stk" fill="${b.s.color}" d="${area(b)}"><title>${esc(b.s.label)}</title></path>`).join('')}${zero}
      <line class="cross" id="cross" y1="${T}" y2="${H - B}" hidden/><circle class="dot" id="dot" r="5" hidden/>`;
    const html = (i) => {
      const rows = ser.map((s) => ({s, v: s.vals[i]})).filter((r) => r.v).sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
      const shown = rows.slice(0, 5), more = rows.length - shown.length;
      const total = rows.reduce((t, r) => t + r.v, 0);
      return `<b class="money">${esc(money(total))}</b><span class="muted">${esc(pLabel(pKey(pts[i])))}</span>` +
        shown.map((r) => `<div class="row"><span><i class="sw-box" style="background:${r.s.color}"></i><span class="lg">${esc(r.s.label)}</span></span><span class="money">${esc(money(r.v))}</span></div>`).join('') +
        (more > 0 ? `<div class="row"><span>${more} more</span><span></span></div>` : '');
    };
    svg._geo = {x, y, data: pts, W, H, dot: false, html};
    $('chart-legend').innerHTML = ser.map((s) => `<span title="${esc(s.label)}"><i class="sw-box" style="background:${s.color}"></i><span class="lg">${esc(s.label)}</span></span>`).join('');
    $('table').innerHTML = `<table class="data"><tr><th>${isDaily() ? 'Date' : 'Month'}</th>${ser.map((s) => `<th>${esc(s.label)}</th>`).join('')}</tr>` +
      pts.map((p, i) => i).reverse().map((i) => `<tr><td>${esc(pLabel(pKey(pts[i])))}</td>${ser.map((s) => `<td class="money">${esc(money(s.vals[i]))}</td>`).join('')}</tr>`).join('') + '</table>';
  }

  function wireChart() {
    const svg = $('chart'), tip = $('tip'), wrap = $('chart-wrap');
    const move = (ev) => {
      const g = svg._geo; if (!g) return;
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * g.W;
      let best = 0, bd = Infinity;
      g.data.forEach((_, i) => { const d = Math.abs(g.x(i) - px); if (d < bd) { bd = d; best = i; } });
      const d = g.data[best], cx = g.x(best);
      const cross = $('cross'), dot = $('dot');
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.removeAttribute('hidden');
      if (g.dot) { dot.setAttribute('cx', cx); dot.setAttribute('cy', g.y(d.v)); dot.removeAttribute('hidden'); }
      const p = d.p || {};
      tip.innerHTML = g.html ? g.html(best) : `<b class="money">${esc(money(d.v))}</b><span class="muted">${esc(pLabel(d.m))}</span>
        ${isDaily() ? '' : `<div class="row"><span>Step</span><span>${esc(pct(p.growth_rate))} · ${esc(SIGNAL_WORD[p.growth_signal] || '')}</span></div>`}
        <div class="row"><span>Investments</span><span class="money">${esc(money(p.invest))}</span></div>
        <div class="row"><span>Cash</span><span class="money">${esc(money(p.cash))}</span></div>
        <div class="row"><span>Credit</span><span class="money">${esc(money(p.cred))}</span></div>`;
      tip.hidden = false;
      const w = tip.offsetWidth, left = (cx / g.W) * wrap.clientWidth;
      tip.style.left = Math.max(0, Math.min(wrap.clientWidth - w, left - w / 2)) + 'px';
    };
    const leave = () => { tip.hidden = true; ['cross', 'dot'].forEach((i) => { const e = $(i); if (e) e.setAttribute('hidden', ''); }); };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', leave);
    svg.addEventListener('pointercancel', leave);
    $('with-cash').addEventListener('change', (e) => { state.cash = e.target.checked; drawChart(); });
    $('gran').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || b.dataset.g === state.gran) return;
      state.gran = b.dataset.g;
      try { localStorage.setItem('finances-gran', state.gran); } catch (err) {}
      [...$('gran').children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      refresh();
    });
    $('view').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || b.dataset.v === state.view) return;
      state.view = b.dataset.v;
      [...$('view').children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      if (state.view === 'account') refresh(); else drawChart();
    });
    $('show-cats').addEventListener('change', (e) => { state.cats = e.target.checked; drawChart(); });
    if (window.ResizeObserver) new ResizeObserver(() => drawChart()).observe(wrap);
    if (IS_POPOUT) window.addEventListener('resize', () => drawChart());
    $('fs-chart').addEventListener('click', () => { openFs($('chart-card')); requestAnimationFrame(() => drawChart()); });
    $('fs-close').addEventListener('click', closeFs);
    $('ap-close').addEventListener('click', closeFs);
    $('pop-chart').addEventListener('click', () => {
      popOut(`window=1&card=chart&view=${state.view}&gran=${state.gran}&cash=${state.cash ? 1 : 0}&cats=${state.cats ? 1 : 0}`, 'finances-chart');
    });
  }

  /* ---- composition ---- */
  function renderMix() {
    const g = (state.summary && state.summary.groups) || {};
    const rows = [
      ['invest', 'Investments', 100], ['bank', 'Cash', 62], ['crypt', 'Crypto', 36],
    ].filter(([k]) => g[k] && g[k].balance > 0);
    const total = rows.reduce((t, [k]) => t + g[k].balance, 0) || 1;
    const tint = (pct) => `color-mix(in srgb, var(--accent) ${pct}%, var(--surface))`;
    const bar = rows.map(([k, , pct]) => `<span title="${esc(g[k].label)}" style="flex:${g[k].balance};background:${tint(pct)}"></span>`).join('');
    const legend = rows.map(([k, label, pct]) => `<div class="legend-row"><span class="swatch" style="background:${tint(pct)}"></span><span>${esc(label)}</span><span class="money">${esc(money(g[k].balance))}</span><span class="pct">${(100 * g[k].balance / total).toFixed(0)}%</span></div>`).join('');
    const credit = g.cred ? `<div class="legend-row"><span class="swatch" style="border:1px solid var(--muted)"></span><span>Credit owed</span><span class="money">−${esc(money(Math.abs(g.cred.balance)))}</span><span class="pct"></span></div>` : '';
    $('mix').innerHTML = `<div class="stack" role="img" aria-label="Share of assets by group">${bar}</div><div class="legend">${legend}${credit}</div>`;
  }

  /* ---- accounts ---- */
  const flowsHtml = (a) => !a.flows ? '' : `<div class="acct-meta" style="margin:0 0 6px">
      <span>Money in <span class="money">${esc(money(a.flows.money_in || 0, true))}</span></span>
      <span>Money out <span class="money">${esc(money(a.flows.money_out || 0, true))}</span></span>
      ${a.flows.interest ? `<span>Interest <span class="money">${esc(money(a.flows.interest, true))}</span></span>` : ''}
      <span>that statement period</span></div>`;
  const short = (label) => label.replace(/^[A-Z]{2,4} - /, '');
  function renderAccounts() {
    const html = GROUP_ORDER.map((cat) => {
      const list = displayed().filter((a) => a.category === cat && (a.balance !== 0 || a.counted));
      if (!list.length) return '';
      const sum = list.reduce((t, a) => t + a.balance, 0);
      const cards = list.map((a) => {
        const badges = [
          a.stale ? `<span class="badge warn">⚠ ${a.age_days}d old</span>` : '',
          !a.counted ? '<span class="badge">not in totals</span>' : '',
          a.possible_duplicate ? '<span class="badge warn">⚠ same balance as another</span>' : '',
        ].join('');
        const open = state.open === a.id;
        return `<div class="acct-card ${a.counted ? '' : 'uncounted'}" data-id="${esc(a.id)}"><button type="button" class="acct" data-id="${esc(a.id)}" aria-expanded="${open}">
          <div class="acct-top"><span class="acct-name">${esc(short(a.label))}</span><span class="acct-bal money ${a.balance < 0 ? 'neg' : ''}">${esc(money(Math.abs(a.balance), true))}</span></div>
          <div class="acct-meta"><span>${esc(a.institution.toUpperCase())}</span><span>as of ${esc(dayName(a.as_of))}</span>${badges}</div>
        </button>
        ${open ? '<div class="acct-detail">' + flowsHtml(a) + '<div id="detail-' + esc(a.id) + '"><span class="muted">Loading history…</span></div><div class="tools" style="margin-top:8px"><button type="button" class="tool" data-fs="' + esc(a.id) + '">⛶ Full screen</button><button type="button" class="tool" data-pop="' + esc(a.id) + '">⧉ Open in its own window</button></div></div>' : ''}
        </div>`;
      }).join('');
      return `<div class="group-head"><h3>${esc(GROUP_LABELS[cat] || cat)}</h3><span class="muted money">${esc(money(sum))}</span></div>${cards}`;
    }).join('');
    $('accounts').innerHTML = html || '<span class="muted">No accounts selected.</span>';
    if (state.open) loadHistory(state.open);
  }

  async function loadHistory(id) {
    const box = document.getElementById('detail-' + id);
    if (!box) return;
    try {
      const pts = (await api(`accounts/${encodeURIComponent(id)}/history`, new URLSearchParams({granularity: 'daily'}))).points;
      if (pts.length < 2) { box.innerHTML = '<span class="muted">Only one statement so far.</span>'; return; }
      mountHistoryChart(box, pts, 160);
    } catch (e) { box.innerHTML = `<span class="error-card">${esc(e.message)}</span>`; }
  }

  $('accounts').addEventListener('click', (e) => {
    const fsb = e.target.closest('[data-fs]');
    if (fsb) { showAccountPop(fsb.dataset.fs, true); return; }
    const pop = e.target.closest('[data-pop]');
    if (pop) { popOut(`window=1&account=${encodeURIComponent(pop.dataset.pop)}`, 'finances-account-' + pop.dataset.pop); return; }
    const b = e.target.closest('.acct'); if (!b) return;
    state.open = state.open === b.dataset.id ? null : b.dataset.id;
    renderAccounts();
  });

  /* ---- freshness ---- */
  function renderFresh(sources) {
    const rows = sources.map((s) => {
      let icon = '✓', cls = 'ok', word = 'ok';
      if (s.status !== 'success') { icon = '✕'; cls = 'bad'; word = 'failed'; }
      else if (s.age_days !== null && s.age_days > 10) { icon = '⚠'; cls = 'warnc'; word = 'stale'; }
      const ago = s.age_days === null ? '' : s.age_days === 0 ? 'today' : s.age_days + 'd ago';
      return `<div class="fresh-row"><span class="${cls}" aria-hidden="true">${icon}</span><span>${esc(s.source)} <span class="${cls}">${word}</span></span><span class="muted">${esc(ago)}</span>${s.failure ? `<span class="why">${esc(s.failure)}</span>` : ''}</div>`;
    }).join('');
    $('fresh').innerHTML = rows || '<span class="muted">No download records.</span>';
  }

  async function showAccountPop(id, fullScreen) {
    const card = $('account-pop');
    if (fullScreen) openFs(card); else { card.hidden = false; card.classList.add('pop-target'); }
    const a = state.all.find((x) => x.id === id);
    $('ap-title').textContent = a ? short(a.label) : 'Account';
    $('ap-meta').textContent = a ? `${a.institution.toUpperCase()} · ${money(a.balance, true)} as of ${dayName(a.as_of)}` : '';
    try {
      const pts = (await api(`accounts/${encodeURIComponent(id)}/history`, new URLSearchParams({granularity: 'daily'}))).points;
      if (pts.length < 2) { $('ap-chart').innerHTML = '<span class="muted">Only one statement so far.</span>'; return; }
      mountHistoryChart($('ap-chart'), pts, chartH(320));
      const audit = pts.some((p) => p.source);
      $('ap-table').innerHTML = `<table class="data"><tr><th>Date</th><th>Balance</th>${audit ? '<th>Source</th><th>Rebuilt</th><th>Adjustment</th>' : ''}</tr>` + pts.slice().reverse().map((p) => `<tr><td>${esc(dayName(p.as_of))}</td><td class="money">${esc(money(p.balance, true))}</td>${audit ? `<td>${esc(p.source === 'actual' ? 'statement/snapshot' : 'rebuilt')}</td><td class="money">${esc(money(p.raw, true))}</td><td class="money">${esc(money(p.adjustment, true))}</td>` : ''}</tr>`).join('') + '</table>';
    } catch (e) { $('ap-chart').innerHTML = `<span class="error-card">${esc(e.message)}</span>`; }
  }

  async function init() {
    loadPrefs();
    try { if (localStorage.getItem('finances-gran') === 'day') state.gran = 'day'; } catch (err) {}
    if (IS_POPOUT && !QS.get('account')) {
      if (['month', 'day'].includes(QS.get('gran'))) state.gran = QS.get('gran');
      const v = QS.get('view');
      if (['total', 'category', 'account'].includes(v)) state.view = v;
      state.cash = QS.get('cash') !== '0'; state.cats = QS.get('cats') === '1';
      $('with-cash').checked = state.cash; $('show-cats').checked = state.cats;
      [...$('view').children].forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.v === state.view)));
      $('chart-card').classList.add('pop-target');
    }
    [...$('gran').children].forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.g === state.gran)));
    wireChart(); wireFilters();
    try {
      const [accts, fresh, every] = await Promise.all([api('accounts'), api('freshness'), api('networth')]);
      state.all = accts.accounts;
      state.bounds = every.points.length ? {first: every.points[0].month, last: every.points[every.points.length - 1].month} : state.bounds;
      if (state.mode === 'custom') { const known = new Set(state.all.map((a) => a.id)); state.ids = new Set([...state.ids].filter((i) => known.has(i))); }
      renderFresh(fresh.sources);
      renderFilters();
      if (IS_POPOUT && QS.get('account')) { await showAccountPop(QS.get('account')); return; }
      await refresh();
    } catch (e) {
      $('hero').innerHTML = `<div class="error-card">Could not load finances: ${esc(e.message)}</div>`;
    }
  }
  init();
})();
</script>
</body>
</html>
