name: CI

on: [push, pull_request]

jobs:
  # Does the installed distribution work, on each OS we claim to support?
  # python-ci below imports the source tree on ubuntu; this installs the package
  # the way a user would and then runs the console script. pip writes that
  # launcher without checking its entry point resolves, so the two can disagree.
  install-check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: casonk/.github/.github/workflows/install-check.yml@main
    with:
      # Floor and ceiling rather than the full matrix. This job is about
      # installation, and the interesting install-time difference across that
      # range is the `tomli>=2; python_version < "3.11"` marker in
      # pyproject.toml -- 3.10 pulls the dependency, 3.14 must not.
      python-versions: '["3.10", "3.14"]'
      install-extra: dev

  ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: casonk/.github/.github/workflows/python-ci.yml@main
    with:
      # 3.13 and 3.14 are not decoration: ntpath.isabs() changed its answer for
      # rooted-but-unqualified paths in 3.13, and a Windows path-validation bug
      # slipped through a 3.10-3.12 matrix because every tested interpreter
      # agreed with each other and disagreed with the developer's.
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
