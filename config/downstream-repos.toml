# Known downstream repositories for clockwork.
# Paths are relative to the portfolio root.
# Track repos whose current scheduler behavior is a migration target for the
# shared scheduler abstraction.
#
# This file is public and lists only public consumers. Private downstream
# consumers are kept in the gitignored config/downstream-repos.local.toml so
# their names never appear in a tracked file.

[utility_repo]
path = "./util-repos/clockwork"

[downstream_repos]
tracking_basis = "repo-local scheduler patterns targeted for clockwork migration"
paths = [
  "./util-repos/archility",        # weekly/daily architecture audit and render timers
  "./util-repos/crew-chief",       # shock-relay listener daemon
  "./util-repos/dyno-lab",         # nightly self-test suite
  "./util-repos/fedora-debugg",    # recurring debug snapshot workflow + tachometer sidecar refresh
  "./util-repos/intake",           # generated user-level daemon and report timers
  "./util-repos/magneto",          # localhost torrent web UI service behind wiring-harness
  "./util-repos/shock-relay",      # shared Gmail notification digest sender
  "./util-repos/snowbridge",       # installed system service + interval timer
  "./util-repos/tachometer",       # weekly portfolio-wide performance snapshot
  "./util-repos/traction-control", # daily governance audit + daily bug sweep + every-other-day template consolidation and CI repair
  "./util-repos/terminility",      # daily tmux session alias rebuild
  "./research-repos/zillow-public-data",  # weekly data report pull and analysis
]
