# Declarative install manifest for clockwork-web privileged resources.
# Processed by scripts/activate.sh (run as: sudo ./scripts/activate.sh)
#
# Columns by type:
#   script   SRC_REL_TO_ROOT  DEST  [MODE=755]
#   sudoers  SRC_REL_TO_ROOT  DEST
#   service  SERVICE_NAME

script   config/scripts/clockwork-system-install                      /usr/local/bin/clockwork-system-install
script   ../pit-box/config/scripts/pit-box-rebuild-guacamole          /usr/local/bin/pit-box-rebuild-guacamole
sudoers  config/sudoers/clockwork-web                                 /etc/sudoers.d/clockwork-web
service  clockwork-web
